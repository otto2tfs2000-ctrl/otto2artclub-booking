<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>畢卡索的畫室</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#f3e6cf;font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:linear-gradient(#e9d3ae,#c9a577)}
#bg{position:absolute;inset:0 0 50% 0;background:url(picasso-studio.webp) center 30%/cover;opacity:0;transition:opacity .6s}
#figbox{position:absolute;left:0;right:0;bottom:42%;height:46%;display:flex;justify-content:center;align-items:flex-end;opacity:0;transition:opacity .6s}
#fig{height:100%;width:auto;transform-origin:50% 100%;filter:drop-shadow(-4px 2px 6px rgba(90,45,10,.22))}
.ready #bg,.ready #figbox{opacity:1}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f3e6cf;color:#8a6a45;font-size:16px;z-index:9;transition:opacity .4s}
.ready #load{opacity:0;pointer-events:none}
.hop{animation:hop .5s}.tilt{animation:tilt .6s}.turn{animation:turn .6s}
@keyframes hop{30%{transform:translateY(-14px) scaleY(1.03)}60%{transform:translateY(0) scaleY(.97)}}
@keyframes tilt{50%{transform:rotate(-5deg)}}
@keyframes turn{50%{transform:scaleX(.92) rotate(4deg)}}
#back{position:absolute;top:14px;left:14px;background:rgba(255,248,236,.92);border:1.5px solid #e2c9a4;border-radius:20px;padding:6px 14px;font-size:14px;color:#6b4a2b;z-index:3}
#pop{position:absolute;top:14%;left:8%;background:#fff8ec;border:1.5px solid #e2c9a4;border-radius:14px;padding:5px 12px;font-size:16px;color:#9a4a22;font-family:"Noto Serif TC","Songti TC",serif;opacity:0;transition:opacity .3s}
/* 頭上的自言自語：不能點，只是讓他看起來有自己的心思 */
#tb{position:absolute;top:5%;left:56%;max-width:42%;background:#fff8ec;border:1.5px solid #e2c9a4;border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:14px;line-height:1.5;color:#5a4630;box-shadow:0 3px 10px rgba(80,40,10,.2);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .35s,transform .35s;pointer-events:none}
#tb.on{opacity:1;transform:none}
#tb small{display:block;font-size:11px;color:#9a8466;margin-bottom:2px}
#sheet{position:absolute;left:0;right:0;bottom:0;height:52%;background:#fff8ec;border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(80,40,10,.28);display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:10px;padding:12px 18px 9px;border-bottom:1px solid #f0e0c6}
.nm{font-size:18px;font-weight:700;color:#3e2a18}.sub{font-size:12px;color:#9a8466}
.ai{margin-left:auto;font-size:11px;background:#e8eefa;color:#2d4f8f;border-radius:8px;padding:3px 8px}
#log{flex:1;overflow-y:auto;padding:8px 16px 4px}
.me{margin:8px 0 0 auto;width:max-content;max-width:78%;background:#2d4f8f;color:#fff;border-radius:16px 16px 4px 16px;padding:8px 13px;font-size:15px;line-height:1.5}
.act{text-align:center;font-size:13px;color:#9a8466;font-family:"Noto Serif TC","Songti TC",serif;margin:10px 0 5px}
.bb{max-width:88%;background:#f6e7cf;color:#3e2a18;border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:15px;line-height:1.65}
.lk{display:flex;gap:16px;margin:6px 2px 2px;font-size:13px}.lk b{font-weight:400;color:#2f7a5a;cursor:pointer}
.fact{margin:6px 0 2px;background:#eaf3ea;color:#2f5a44;border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.6}
.dots{display:inline-flex;gap:4px;padding:12px 14px;background:#f6e7cf;border-radius:16px 16px 16px 4px;margin-top:8px}.dots i{width:7px;height:7px;border-radius:50%;background:#b39a78;animation:d 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,100%{opacity:.3}50%{opacity:1}}
.tag{display:inline-block;font-size:11px;color:#9a8466;border:1px dashed #d8c3a0;border-radius:6px;padding:1px 6px;margin-top:4px}
.note{text-align:center;font-size:12px;color:#9a8466;margin:8px 0}
/* 下面兩排按鈕：同一種樣子、固定 3 個，不再有白底藍底混在一起 */
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:5px 16px}
.row button{font:inherit;font-size:13px;line-height:1.3;border:1.5px solid #e2c9a4;border-radius:14px;padding:8px 6px;color:#6b4a2b;background:#fff;cursor:pointer;min-height:40px}
.row.games button{font-weight:600;background:#fdf3de}
.row button:active{background:#f6e7cf}
#bar{display:flex;gap:10px;align-items:center;padding:8px 16px 12px;border-top:1px solid #f0e0c6}
#q{flex:1;height:40px;border-radius:20px;border:0;background:#f6e7cf;color:#3e2a18;font:inherit;font-size:15px;padding:0 14px;outline:none}
#q::placeholder{color:#b39a78}
#send{width:40px;height:40px;border-radius:50%;border:0;background:#2d4f8f;color:#fff;font-size:17px;cursor:pointer}
#closed{display:none;padding:10px 16px 14px;text-align:center;font-size:13px;color:#9a8466;border-top:1px solid #f0e0c6}
#closed button{margin-top:8px;font:inherit;font-size:13px;border:1.5px solid #e2c9a4;border-radius:16px;padding:6px 14px;background:#fff;color:#6b4a2b}
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px;max-width:88%}.opts button{font:inherit;font-size:14px;text-align:left;border:1.5px solid #e2c9a4;border-radius:12px;padding:7px 12px;background:#fff;color:#3e2a18}
.opts button.right{border-color:#3d8a5f;background:#eaf3ea}.opts button.wrong{border-color:#c46a4a;background:#fbeee8}
.art{margin:6px 0 2px;background:#fff;border:1.5px solid #e2c9a4;border-radius:12px;padding:8px;max-width:78%}.art canvas{width:100%;display:block;border-radius:6px}.art div{text-align:center;font-size:12px;color:#9a8466;margin-top:4px}
.pad{margin:6px 0 2px;width:100%;background:#fff;border:1.5px solid #e2c9a4;border-radius:12px;padding:8px;max-width:92%}.pad .tp{font-size:13px;color:#6b4a2b;margin-bottom:6px;text-align:center}.pad canvas{width:100%;aspect-ratio:16/10;display:block;border-radius:8px;background:#fffdf7;border:1px dashed #e2c9a4;touch-action:none}.pad .pal{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}.pad .pal i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #d8c3a0;cursor:pointer}.pad .pal i.on{box-shadow:0 0 0 3px #2d4f8f}.pad .go{display:flex;gap:8px;margin-top:8px}.pad .go button{flex:1;font:inherit;font-size:14px;border:1.5px solid #e2c9a4;border-radius:12px;padding:8px;background:#fdf3de;color:#6b4a2b}.pad .go button.main{background:#2d4f8f;color:#fff;border-color:#2d4f8f}.quit{margin-top:6px;font:inherit;font-size:12px;border:0;background:none;color:#9a8466;text-decoration:underline;cursor:pointer}
.stars{display:flex;gap:6px;margin:8px 0 2px}.stars button{font:inherit;font-size:24px;border:0;background:none;padding:2px;cursor:pointer;filter:grayscale(1);opacity:.55}.stars button.on{filter:none;opacity:1}
.intro .row,.intro #bar,.intro #log{visibility:hidden}
</style></head><body>
<div id="app">
  <div id="bg"></div>
  <div id="figbox"><img id="fig" src="pc-smile.webp" alt="畢卡索"></div>
  <span id="back" onclick="goBack()">‹ 回作品小屋</span>
  <div id="pop"></div>
  <div id="tb"></div>
  <div id="load">畫室準備中…</div>
  <div id="sheet">
    <div class="hd"><div><div class="nm" id="nm"></div><div class="sub" id="sub"></div></div><span class="ai">AI 扮演</span></div>
    <div id="log"></div>
    <div class="row" id="chips"></div>
    <div class="row games" id="games"><button data-k="story">📖 藝術小故事</button><button data-k="draw">🎨 畫畫遊戲</button><button data-k="quiz">💡 藝術小知識</button></div>
    <div id="bar"><input id="q" placeholder="自己打字問…" maxlength="60"><button id="send" aria-label="送出">➤</button></div>
    <div id="closed"></div>
  </div>
</div>
<script>document.body.classList.add('intro')</script>
<script>document.write('<script src="picasso.js?t='+Date.now()+'"><\/script>')</script>
<script>
const D=window.ARTIST,N=D.nodes,NOTIFY='https://otto2-notify-production.up.railway.app',FIXED_MAX=25;
const MOVE={smile:'tilt',laugh:'hop',look:'hop',awkward:'tilt',hesitant:'turn'},POP={smile:'嗯～',laugh:'哈！',look:'喔？',awkward:'嘿嘿',hesitant:'嗯……'};
const $=s=>document.querySelector(s),log=$('#log'),fig=$('#fig'),pop=$('#pop'),tb=$('#tb');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const split=l=>{const k=l.indexOf('）');return{a:l.slice(0,k+1),t:l.slice(k+1)}};
const esc=t=>String(t).replace(/</g,'&lt;');
let used=0,aiUsed=0,aiMax=0,member=false,busy=false,ended=false,seen=new Set(),cur=[],bag={},hist=[];
$('#nm').textContent=D.name;$('#sub').textContent=D.sub;$('#q').placeholder='自己打字問'+D.short+'…';
function goBack(){if(parent!==window)parent.postMessage('closeArtistChat','*');else history.back()}
function draw(k,arr){bag[k]=bag[k]&&bag[k].length?bag[k]:arr.map((_,i)=>i).sort(()=>Math.random()-.5);return bag[k].pop()}
function face(m){fig.src='pc-'+m+'.webp';fig.className='';void fig.offsetWidth;fig.className=MOVE[m];pop.textContent=POP[m];pop.style.opacity=1;clearTimeout(face.t);face.t=setTimeout(()=>pop.style.opacity=0,1800)}
function add(h){const d=document.createElement('div');d.innerHTML=h;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function say(line,mood,tag){const l=split(line);face(mood);return add(`<div class="act">${l.a}</div><div class="bb">${l.t}</div>${tag?`<span class="tag">${tag}</span>`:''}`)}
function think(ms,fn){const t=add('<div class="dots"><i></i><i></i><i></i></div>');setTimeout(()=>{t.remove();fn()},ms)}
function api(body){let tk='';try{tk=parent.token()}catch(e){}if(!tk)return Promise.resolve(null);
  return fetch(NOTIFY+'/island/artist-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({accessToken:tk,artist:'picasso'},body))}).then(r=>r.json()).catch(()=>null)}
/* ---------- 頭上的自言自語（只是氣氛，不能點） ---------- */
let murT=null;
function murmur(delay){clearTimeout(murT);tb.classList.remove('on');murT=setTimeout(()=>{if(ended)return;tb.innerHTML=esc(pick(D.lines.murmur));tb.classList.add('on');murT=setTimeout(()=>murmur(4500+Math.random()*3500),3400)},delay)}
/* ---------- 下面兩排固定按鈕 ---------- */
function chips(ids){cur=ids.filter(i=>N[i]&&!seen.has(i)&&i!=='real');
  Object.keys(N).filter(i=>!seen.has(i)&&!cur.includes(i)&&i!=='real').sort(()=>Math.random()-.5).forEach(i=>{if(cur.length<3)cur.push(i)});
  cur=cur.sort(()=>Math.random()-.5).slice(0,3);const c=$('#chips');c.innerHTML='';
  cur.forEach(i=>{const b=document.createElement('button');b.textContent=N[i].q;b.onclick=()=>ask(N[i].q,i);c.appendChild(b)})}
function match(q){const s=q.toLowerCase().replace(/\s+/g,'');let best=null,score=0;for(const [id,n] of Object.entries(N)){let sc=0;for(const k of n.kw||[])if(s.includes(k.toLowerCase()))sc+=k.length;if(sc>score){score=sc;best=id}}return best}
function reply(r,tag){face(r.m);const d=add(`<div class="act">${r.a}</div><div class="bb">${r.t}</div><div class="lk">${r.f?'<b>📜 真的嗎？</b>':''}</div>${tag?`<span class="tag">${tag}</span>`:''}`);
  if(r.f)d.querySelector('b').onclick=e=>{e.target.remove();d.querySelector('.lk').insertAdjacentHTML('beforeend',`<div class="fact">${r.f}</div>`);log.scrollTop=log.scrollHeight}}
/* ---------- 結束聊天：說累了 → 關掉輸入 → 通知伺服器記 3 天冷卻 ---------- */
function finish(){if(ended)return;ended=true;busy=true;api({act:'end'});
  setTimeout(()=>{say(pick(D.lines.end),'hesitant');lock('畢卡索去忙了，3 天後可以再來聊')},1400)}
function lock(note){ended=true;tb.classList.remove('on');clearTimeout(murT);$('#bar').style.display='none';$('#chips').style.display='none';$('#games').style.display='none';
  const c=$('#closed');c.style.display='block';c.innerHTML=note+'<br><button onclick="goBack()">回作品小屋</button>'}
function after(){busy=false;used++;if(used>=FIXED_MAX&&member)finish();else murmur(2500)}
/* ---------- 問答 ---------- */
function ask(q,id){if(busy||ended||!q.trim())return;busy=true;tb.classList.remove('on');clearTimeout(murT);add(`<div class="me">${esc(q)}</div>`);
  const typed=!id;if(typed)id=match(q);
  if(id){seen.add(id);think(650,()=>{reply(N[id],'');chips(N[id].next||[]);after()});return}
  const stmt=!/[?？嗎呢]|什麼|為什麼|為何|怎麼|哪|誰|幾|可以|能不能|是不是|有沒有|教我|告訴|多少|好不好|要不要/.test(q)&&/^(我|俺|本人)/.test(q.trim());
  const fixedEnd=()=>{say(pick(stmt?D.lines.ack:D.lines.unknown),stmt?pick(['smile','laugh','look']):'awkward','');chips(cur);after()};
  if(member&&aiUsed<aiMax){const t=add('<div class="dots"><i></i><i></i><i></i></div>');
    api({q,hist:hist.slice(-3)}).then(j=>{t.remove();
      if(j&&j.ok&&!j.fixed&&j.t){aiUsed++;hist.push({q,a:j.a+j.t});face(['smile','laugh','look','awkward','hesitant'].includes(j.m)?j.m:'smile');
        add(`<div class="act">${esc(j.a)}</div><div class="bb">${esc(j.t)}</div><span class="tag">AI 回答（${aiUsed}/${aiMax}）</span>`);chips(cur);
        if(aiUsed>=aiMax){busy=false;finish();return}
        if(aiUsed===aiMax-1)setTimeout(()=>say(D.lines.tired,'hesitant',''),700);
        after()}
      else{aiMax=0;fixedEnd()}});return}
  think(650,fixedEnd)}
/* ---------- 三個小遊戲 ---------- */
function game(k){if(busy||ended)return;busy=true;tb.classList.remove('on');clearTimeout(murT);
  const lab={story:'說個藝術小故事給我聽',draw:'我們來玩畫畫遊戲！',quiz:'考考我藝術小知識！'}[k];add(`<div class="me">${lab}</div>`);
  think(600,()=>{if(k==='story')story();else if(k==='draw')drawGame();else{busy=false;quiz(0,++qid)}})}
function story(){say(D.stories[draw('s',D.stories)],'smile','');after()}
/* 畫畫遊戲：他出題，你在畫紙上用手指畫，畫好了按「畫好了」，他看了就稱讚（20 句，依你畫的樣子挑：顏色多／線條多／很簡單／畫很大／一般，每種 4 句隨機） */
function drawGame(){face('look');const topic=pick(D.lines.topics),COL=['#1f1f22','#2d4f8f','#d9534f','#e9a23b','#3d8a5f'];
  const d=add(`<div class="act">（他撕下一張紙遞給你，又塞給你一支炭筆）</div><div class="bb">今天的題目：${topic}。<br>你畫，我來看！</div><div class="pad"><canvas width="480" height="300"></canvas><div class="pal">${COL.map((c,i)=>`<i data-c="${c}" style="background:${c}" class="${i?'':'on'}"></i>`).join('')}</div><div class="go"><button data-a="clr">清掉重畫</button><button class="main" data-a="ok">畫好了</button></div></div>`);
  const cv=d.querySelector('canvas'),x=cv.getContext('2d');x.lineWidth=7;x.lineCap='round';x.lineJoin='round';let col=COL[0],strokes=0,on=false,colors=new Set(),ink=0,lx=0,ly=0;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{if(d.dataset.done)return;on=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}const[px,py]=pos(e);lx=px;ly=py;x.strokeStyle=col;x.beginPath();x.moveTo(px,py);x.lineTo(px+.1,py+.1);x.stroke();strokes++;colors.add(col)};
  cv.onpointermove=e=>{if(!on)return;const[px,py]=pos(e);x.beginPath();x.moveTo(lx,ly);x.lineTo(px,py);x.stroke();ink+=Math.hypot(px-lx,py-ly);lx=px;ly=py};
  cv.onpointerup=cv.onpointercancel=()=>{on=false};
  d.querySelectorAll('.pal i').forEach(i=>i.onclick=()=>{col=i.dataset.c;d.querySelectorAll('.pal i').forEach(o=>o.classList.toggle('on',o===i))});
  d.querySelector('[data-a=clr]').onclick=()=>{if(d.dataset.done)return;x.clearRect(0,0,cv.width,cv.height);strokes=0;colors=new Set();ink=0};
  d.querySelector('[data-a=ok]').onclick=()=>{if(d.dataset.done)return;
    if(strokes<1){face('awkward');add(`<div class="act">（他笑著把紙推回來）</div><div class="bb">紙還是白的喔，隨便畫幾筆就好，我不會笑你。</div>`);return}
    d.dataset.done=1;d.querySelector('.go').style.display='none';d.querySelector('.pal').style.display='none';
    const cat=[];if(colors.size>=3)cat.push('colors');if(strokes>=10||ink>1800)cat.push('busy');if(strokes<=3&&ink<500)cat.push('simple');if(ink>2600)cat.push('big');if(!cat.length)cat.push('normal');
    think(900,()=>{face('laugh');say(pick(D.lines.praise[pick(cat)]),'laugh','');after()})};
  log.scrollTop=log.scrollHeight;busy=false}
/* 藝術小知識：10 題小謎語。猜錯不會結束：他給提示、拿掉一個錯的選項，再猜一次；猜兩次還不對就公佈答案，繼續下一題。隨時可以「先不玩了」，最後算你拿到幾顆星 */
let qz=null,stars=0,qid=0;
function quiz(n,id){if(id!==qid)return;if(n===0){qz=D.quiz.slice().sort(()=>Math.random()-.5).slice(0,10);stars=0}
  if(n>=qz.length){face('laugh');add(`<div class="act">（他用力鼓掌，白鴿也飛起來繞了一圈）</div><div class="bb">十題都玩完了！你拿到 ${stars} 顆星 ${'⭐'.repeat(stars)}${stars>=8?'<br>你是真正的小小藝術家！':'<br>很棒，下次再來拿更多星星！'}</div>`);after();return}
  const z=qz[n];face('look');let tries=0;
  const d=add(`<div class="act">（第 ${n+1} / ${qz.length} 題・目前 ${stars} 顆星）</div><div class="bb">${z.q}</div><div class="opts">${z.o.map((o,i)=>`<button data-i="${i}">${o}</button>`).join('')}</div><button class="quit">先不玩了</button>`);
  const bs=d.querySelectorAll('.opts button');
  d.querySelector('.quit').onclick=()=>{if(d.dataset.done)return;d.dataset.done=1;qid++;add(`<div class="act">（他點點頭）</div><div class="bb">好，休息一下也很好！這一輪你拿到 ${stars} 顆星。</div>`);after()};
  bs.forEach(b=>b.onclick=()=>{if(d.dataset.done||b.disabled)return;const ok=+b.dataset.i===z.ans;
    if(ok){d.dataset.done=1;if(tries===0)stars++;b.classList.add('right');d.querySelector('.quit').remove();face('laugh');add(`<div class="act">（他拍拍手）</div><div class="bb">${z.ok}${tries===0?'<br>⭐ +1':''}</div>`);setTimeout(()=>quiz(n+1,id),1600);return}
    tries++;b.classList.add('wrong');b.disabled=true;
    if(tries>=2){d.dataset.done=1;bs[z.ans].classList.add('right');d.querySelector('.quit').remove();face('awkward');add(`<div class="act">（他笑著說）</div><div class="bb">${z.no}</div>`);setTimeout(()=>quiz(n+1,id),1800);return}
    face('hesitant');add(`<div class="act">（他眨眨眼）</div><div class="bb">不是那個喔，再猜一次，我偷偷告訴你：不是${b.textContent}。</div>`);log.scrollTop=log.scrollHeight});
  log.scrollTop=log.scrollHeight}
/* ---------- 事件 ---------- */
$('#send').onclick=()=>{const v=$('#q').value;$('#q').value='';ask(v)};
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();$('#send').click()}});
$('#q').addEventListener('input',()=>{tb.classList.remove('on');clearTimeout(murT)});
document.querySelectorAll('#games button').forEach(b=>b.onclick=()=>game(b.dataset.k));
/* ---------- 開場 ---------- */
function loadImgs(){const u=['picasso-studio.webp','pc-smile.webp'];return Promise.all(u.map(s=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=s})))}
function intro(){document.body.classList.remove('intro');chips(D.root);
  face('look');tb.innerHTML=esc(pick(D.lines.murmur));tb.classList.add('on');
  setTimeout(()=>{tb.classList.remove('on');if(used>0||ended)return;face('laugh');add(`<div class="act">（他突然回過神，發現你站在門口）</div><div class="bb">你來啦！想問我啥事？</div>`);murmur(3000)},1500)}
function applyStatus(st){if(!st||!st.ok)return;
  if(st.cool>0){clearTimeout(murT);tb.classList.remove('on');say(pick(D.lines.cool),'hesitant','');lock('還要等 '+Math.max(1,Math.ceil(st.cool/86400000))+' 天才能再聊');return}
  member=!!st.member;aiMax=member?(st.aiLeft||0):0;
  if(!member)add('<div class="note">這間畫室的 AI 聊天只給會員朋友，你可以用下面的按鈕和他玩。</div>')}
(async()=>{
  const stP=api({act:'status'});
  await Promise.race([loadImgs(),new Promise(r=>setTimeout(r,5000))]);
  document.getElementById('app').classList.add('ready');
  ['laugh','look','awkward','hesitant'].forEach(n=>{new Image().src='pc-'+n+'.webp'});
  const st=await Promise.race([stP,new Promise(r=>setTimeout(()=>r(null),1200))]);
  if(st&&st.ok&&st.cool>0){document.body.classList.remove('intro');applyStatus(st);return}
  intro();
  if(st)applyStatus(st);else stP.then(applyStatus);
})();
</script>
