<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>在家自己做系列｜Otto2 ARTCLUB</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
/* 2026-11-24 我的線上課程：影片在 Cloudflare Stream（要簽章才能播），身分一律用 LINE 登入驗。
   有開通的課程發光可點、沒開通的灰掉；影片上飄名字＋電話末三碼。後台在薪資系統「🎬 線上課程」。 */
:root{--ink:#2b2118;--soft:#7a6553;--cream:#fbf6ec;--line:#e8dcc6;--gold:#c99a3c;--gold2:#a77a22;--green:#1f5a4a;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#f3ead9;color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.hero{background:linear-gradient(135deg,#2f5658,#1f3d40);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px}
.hero h1{margin:0;font-size:21px;letter-spacing:.04em}
.hero p{margin:6px 0 0;font-size:13.5px;color:#cfe0dc;line-height:1.6}
.back{display:inline-block;color:#e9cf8c;font-size:14px;margin-bottom:10px;text-decoration:none}
.box{background:var(--cream);margin:12px;border-radius:16px;padding:16px;box-shadow:0 1px 0 var(--line)}
.box h2{margin:0 0 6px;font-size:16px}
.muted{color:var(--soft);font-size:13px;line-height:1.6}
input[type=tel]{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:10px 0 8px}
input:focus{outline:none;border-color:var(--gold)}
.btn{display:block;width:100%;font:inherit;font-size:16px;font-weight:800;border:0;border-radius:12px;padding:13px;background:var(--gold);color:#2b2410;cursor:pointer}
.btn:disabled{opacity:.6}
.err{color:#b23a3a;font-size:13.5px;margin-top:8px;min-height:1em;line-height:1.5}
.course{margin:12px;border-radius:18px;overflow:hidden;background:#fff;border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(201,154,60,.18),0 8px 22px rgba(120,80,20,.16)}
.course .hd{padding:14px 16px;background:linear-gradient(135deg,#fff6df,#fbecc4)}
.course .hd b{font-size:17px}.course .hd .tag{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:800;background:var(--green);color:#fff;padding:2px 8px;border-radius:9px;vertical-align:2px}
.course .hd small{display:block;margin-top:4px;color:var(--soft);font-size:13px}
.ep{display:flex;align-items:center;gap:12px;width:100%;font:inherit;text-align:left;background:#fff;border:0;border-top:1px solid #f1e8d6;padding:13px 16px;cursor:pointer;color:var(--ink)}
.ep .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.ep .t{flex:1;font-size:15px;font-weight:700}.ep .seen{font-size:12px;color:var(--green)}
.ep:active{background:#fbf3e1}
.course.off{border-color:#ddd;box-shadow:none;filter:grayscale(1);opacity:.62}
.course.off .hd{background:#f2f2f2}.course.off .ep{cursor:default}.course.off .ep .n{background:#bbb}
.lock{padding:10px 16px 14px;font-size:13px;color:#777;border-top:1px solid #eee}
.me{text-align:center;font-size:12.5px;color:var(--soft);margin:4px 12px}
/* 播放器：自己的全螢幕（直接用影片的全螢幕會蓋掉浮水印） */
.pl{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.pl[hidden]{display:none}
.pl .bar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;color:#fff;background:#111}
.pl .bar b{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .bar button{font:inherit;font-size:14px;color:#fff;background:#333;border:0;border-radius:9px;padding:7px 12px}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vbox{position:relative;width:100%;aspect-ratio:16/9;max-height:100%}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wm{position:absolute;z-index:2;pointer-events:none;color:rgba(255,255,255,.42);font-size:15px;font-weight:700;text-shadow:0 0 3px rgba(0,0,0,.6);white-space:nowrap;transition:top 1.2s,left 1.2s}
.pl.land .stage{padding:0}
.hint{color:#aaa;font-size:12.5px;text-align:center;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.load{padding:40px 16px;text-align:center;color:var(--soft)}
</style>
<script>/* 鎖整頁縮放（iPhone 不理 user-scalable=no） */
(function(){const no=e=>e.preventDefault();['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,no,{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false})})();</script>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <a class="back" href="index.html">‹ 回預約頁</a>
    <h1>🎬 在家自己做系列</h1>
    <p>買了材料包就能在家跟著影片做。影片只有開通的人看得到。</p>
  </div>
  <div id="main"><div class="load">載入中…</div></div>
</div>
<div class="pl" id="pl" hidden>
  <div class="bar"><b id="plT"></b><button id="plRot">⤢ 放大</button><button id="plX">✕ 關閉</button></div>
  <div class="stage"><div class="vbox" id="vbox"><div class="wm" id="wm"></div></div></div>
  <div class="hint">影片僅供購買者本人觀看，請勿錄影分享</div>
</div>
<script>
const NOTIFY_URL='https://otto2-notify-production.up.railway.app',LIFF_ID='2010906803-FMDYktUN';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TK='',DATA=null,wmT=null;
const SEEN_KEY='otto2-oc-seen';
const seen=()=>{try{return JSON.parse(localStorage.getItem(SEEN_KEY)||'{}')}catch(e){return{}}};

async function getTok(force){
  if(!force){try{const t=sessionStorage.getItem('otto2-liff-tk');if(t&&t!=='kiosk')return t}catch(e){}}
  await liff.init({liffId:LIFF_ID});
  if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return new Promise(()=>{})}
  const t=liff.getAccessToken()||'';try{sessionStorage.setItem('otto2-liff-tk',t)}catch(e){}
  return t;
}
async function api(path,body,retried){
  const r=await fetch(NOTIFY_URL+path,{method:'POST',body:JSON.stringify(Object.assign({accessToken:TK},body||{}))});
  const j=await r.json().catch(()=>({ok:false,error:'連線不穩，請再試一次'}));
  if(!j.ok&&(j.code==='BAD_TOKEN'||j.code==='NO_LINE')&&!retried){
    try{sessionStorage.removeItem('otto2-liff-tk')}catch(e){}
    TK=await getTok(true);return api(path,body,true);
  }
  return j;
}
function render(){
  const m=$('main'),d=DATA;let h='';
  if(!d.bound){
    h+=`<div class="box"><h2>第一次使用，先開通</h2>
      <div class="muted">請輸入購買材料包時留的手機號碼。開通後這個 LINE 就認得你，下次打開直接看。</div>
      <input id="ph" type="tel" inputmode="numeric" maxlength="12" placeholder="09xxxxxxxx">
      <button class="btn" id="phGo">開通我的課程</button><div class="err" id="phErr"></div></div>`;
  }
  const cs=d.courses||[];
  if(!cs.length)h+=`<div class="box"><div class="muted">線上課程準備中，敬請期待。</div></div>`;
  const sn=seen();
  cs.sort((a,b)=>(b.owned?1:0)-(a.owned?1:0)).forEach(c=>{
    h+=`<div class="course${c.owned?'':' off'}"><div class="hd"><b>${esc(c.title)}</b>${c.owned?'<span class="tag">已開通</span>':''}${c.desc?`<small>${esc(c.desc)}</small>`:''}</div>`+
      c.eps.map(e=>`<button class="ep" data-c="${esc(c.id)}" data-e="${e.n}"${c.owned?'':' disabled'}><span class="n">${e.n}</span><span class="t">${esc(e.title)}</span>${sn[c.id+'/'+e.n]?'<span class="seen">看過 ✓</span>':''}${c.owned?'<span>▶</span>':''}</button>`).join('')+
      (c.owned?'':`<div class="lock">🔒 購買材料包就能看。想買請私訊官方 LINE 小編。</div>`)+`</div>`;
  });
  if(d.bound)h+=`<div class="me">已用電話末三碼 ${esc(d.phoneTail)} 開通</div>`;
  m.innerHTML=h;
  m.querySelectorAll('.ep:not([disabled])').forEach(b=>b.onclick=()=>play(b.dataset.c,+b.dataset.e));
  if($('phGo')){
    const go=async()=>{const e=$('phErr'),b=$('phGo');e.textContent='';b.disabled=true;b.textContent='開通中…';
      const j=await api('/oc/claim',{phone:$('ph').value});
      b.disabled=false;b.textContent='開通我的課程';
      if(!j.ok){e.textContent=j.error||'開通沒有成功，請再試一次';return}
      DATA={bound:true,phoneTail:j.phoneTail,courses:j.courses};render()};
    $('phGo').onclick=go;$('ph').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  }
}
async function play(cid,ep){
  const c=(DATA.courses||[]).find(x=>x.id===cid);
  $('plT').textContent=(c?c.title+'・':'')+'第 '+ep+' 集';
  $('pl').hidden=false;document.body.style.overflow='hidden';
  const vb=$('vbox');vb.querySelectorAll('iframe,.load').forEach(x=>x.remove());
  vb.insertAdjacentHTML('afterbegin','<div class="load" style="color:#aaa">影片準備中…</div>');
  const j=await api('/oc/play',{cid,ep});
  vb.querySelectorAll('.load').forEach(x=>x.remove());
  if(!j.ok){vb.insertAdjacentHTML('afterbegin',`<div class="load" style="color:#f0b0b0">${esc(j.error||'影片打不開，請稍後再試')}</div>`);return}
  $('plT').textContent=(c?c.title+'・':'')+j.title;
  /* 不給 allowfullscreen：影片自己的全螢幕會把浮水印蓋掉，用上面「放大」 */
  vb.insertAdjacentHTML('afterbegin',`<iframe src="https://iframe.videodelivery.net/${encodeURIComponent(j.token)}?preload=true&autoplay=true" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="origin"></iframe>`);
  const w=$('wm');w.textContent=j.wm||'';
  const mv=()=>{w.style.top=(8+Math.random()*72)+'%';w.style.left=(4+Math.random()*58)+'%'};mv();
  clearInterval(wmT);wmT=setInterval(mv,7000);
  const s=seen();s[cid+'/'+ep]=1;try{localStorage.setItem(SEEN_KEY,JSON.stringify(s))}catch(e){}
}
function closePl(){$('pl').hidden=true;document.body.style.overflow='';$('vbox').querySelectorAll('iframe').forEach(x=>x.remove());clearInterval(wmT);
  $('pl').classList.remove('land');$('vbox').style.cssText='';render()}
$('plX').onclick=closePl;
/* 放大：手機直拿時把影片轉 90 度鋪滿整個畫面（浮水印跟著轉） */
$('plRot').onclick=()=>{const p=$('pl'),v=$('vbox');const on=!p.classList.contains('land');p.classList.toggle('land',on);
  if(on&&innerHeight>innerWidth){const W=innerHeight-110,H=innerWidth,vw=Math.min(W,H*16/9);v.style.cssText=`width:${vw}px;height:${vw*9/16}px;aspect-ratio:auto;transform:rotate(90deg);max-height:none;flex:none`}
  else v.style.cssText='';
  $('plRot').textContent=on?'⤡ 縮小':'⤢ 放大'};
(async()=>{
  try{
    TK=await getTok(false);
    const j=await api('/oc/me',{});
    if(!j.ok){$('main').innerHTML=`<div class="box"><div class="err">${esc(j.error||'讀不到課程，請關掉頁面重新打開')}</div></div>`;return}
    DATA=j;render();
  }catch(e){$('main').innerHTML=`<div class="box"><div class="err">請從官方 LINE 的預約頁打開這一頁。</div></div>`}
})();
</script>
</body>
</html>
