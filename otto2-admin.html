<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Otto2 預約後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1E2B4F;--gold:#E3B34C;--paper:#F7F5F0;--ink:#2A2E38;--ink-soft:#6B7180;--line:#E4E1D9;--ok:#2E7D4F;--warn:#C0392B;--warnbg:#FBECEA}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--paper);color:var(--ink);padding-bottom:90px}
.hero{background:var(--navy);color:#fff;padding:16px 18px 0;position:sticky;top:0;z-index:10}
.hero h1{font-size:16px;font-weight:900}
.hero .sub{font-size:11.5px;opacity:.7;margin-top:2px}
.tabbar{display:flex;gap:22px;margin-top:14px}
.tabbtn{background:none;border:none;color:rgba(255,255,255,.6);font-family:inherit;font-size:14.5px;font-weight:500;padding:0 0 10px;border-bottom:2.5px solid transparent}
.tabbtn.on{color:#fff;font-weight:700;border-bottom-color:var(--gold)}
.datebar{display:flex;align-items:center;gap:9px;padding:12px 18px;background:var(--navy)}
.datebar button{width:36px;height:36px;border:none;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:16px}
.datebar .d{flex:1;text-align:center;font-size:15.5px;font-weight:700;color:#fff}
.datebar .today{font-size:12px;background:none;border:1px solid rgba(255,255,255,.4);width:auto;padding:0 12px;height:30px;border-radius:99px}
.wrap{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.kpi{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
.kpi .n{font-size:23px;font-weight:900;color:var(--navy)}
.kpi .l{font-size:11px;color:var(--ink-soft);margin-top:2px}
.kpi.alert{border-color:var(--warn);background:var(--warnbg)}
.kpi.alert .n{color:var(--warn)}
.kpi.tset{padding:8px 6px 11px}
.trow{display:flex;align-items:center;justify-content:center;gap:5px}
.tbtn{width:26px;height:26px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font-size:15px;color:var(--navy);font-weight:700;font-family:inherit;line-height:1}
.slotcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.slotcard.over{border-color:var(--warn)}
.slothead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.slothead h2{font-size:16px;color:var(--navy)}
.badge{font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:99px;background:#E8F3EC;color:var(--ok)}
.badge.over{background:var(--warnbg);color:var(--warn)}
.meter{height:7px;border-radius:99px;background:var(--paper);overflow:hidden;margin:9px 0 6px}
.meter i{display:block;height:100%;background:var(--navy)}
.meter i.over{background:var(--warn)}
.dishes{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px}
.bk{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.bk .who b{color:var(--navy)}
.bk .who .tel{color:var(--ink-soft);font-size:12.5px}
.bk .items{text-align:right;color:var(--ink-soft);font-size:12.5px;max-width:55%}
.bk .items b{color:var(--ink)}
.note{font-size:12px;color:var(--gold)}
.src{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft);margin-left:6px;vertical-align:1px}
.dep{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;margin-top:4px;border:none;font-family:inherit}
.dep.pending{background:#FDF3DC;color:#9A6B00}
.dep.paid{background:#E8F3EC;color:var(--ok)}
.flag{font-size:11.5px;color:var(--warn);background:var(--warnbg);border-radius:7px;padding:5px 8px;margin-top:5px;line-height:1.5}
.atrow{display:flex;gap:6px;justify-content:flex-end;margin-top:7px}
.at{font-size:11.5px;padding:5px 11px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-family:inherit}
.at.on{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.at.no{background:var(--warnbg);border-color:var(--warn);color:var(--warn);font-weight:700}
.newtag{display:inline-block;font-size:10.5px;padding:1px 8px;border-radius:99px;background:#E8F3EC;color:var(--ok);margin-top:4px}
/* ── 班表月曆 ── */
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mhead h2{font-size:17px;color:var(--navy)}
.mhead button{border:1.5px solid var(--line);background:#fff;border-radius:9px;width:36px;height:34px;font-size:16px;color:var(--navy)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mgrid .wd{text-align:center;font-size:11.5px;color:var(--ink-soft);padding:5px 0}
.mday{aspect-ratio:.82;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:2px}
.mday .dd{font-size:12.5px;color:var(--ink-soft)}
.mday .tn{font-size:17px;font-weight:900;color:var(--navy);line-height:1}
.mday .cap{font-size:9.5px;color:var(--ink-soft)}
.mday.set{border-color:var(--navy);background:#EEF1FA}
.mday.set .dd{color:var(--navy);font-weight:700}
.mday.zero .tn{color:var(--warn)}
.mday.rest{background:var(--paper);border-style:dashed}
.mday.rest .tn{color:#C5C8D0;font-size:13px}
.mday.pastday{opacity:.42}
.legend{margin-top:14px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.75}
.legend b{color:var(--navy)}
/* ── 彈窗 ── */
.mask{position:fixed;inset:0;background:rgba(20,30,58,.45);z-index:50;display:none;align-items:flex-end}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet h3{font-size:16px;color:var(--navy);margin-bottom:4px}
.sheet .sh{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
.nopts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.nopt{padding:13px 0;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:16px;font-weight:700;color:var(--navy);font-family:inherit}
.nopt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.nopt small{display:block;font-size:10px;font-weight:400;opacity:.7;margin-top:2px}
.reset{width:100%;padding:12px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:14px;color:var(--ink-soft);font-family:inherit;margin-bottom:9px}
.f{margin-bottom:11px}
.f label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
.frow{display:flex;gap:9px}
.frow .f{flex:1}
.sbtns{display:flex;gap:9px;margin-top:6px}
.sbtns .cancel{flex:0 0 90px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:15px;font-family:inherit;color:var(--ink-soft)}
.sbtns .save{flex:1;padding:13px;border:none;border-radius:11px;background:var(--navy);color:#fff;font-size:15.5px;font-weight:700;font-family:inherit}
.hint{font-size:11.5px;color:var(--ink-soft);margin-top:8px;line-height:1.6}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;background:var(--navy);color:#fff;border:none;border-radius:99px;padding:14px 20px;font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 4px 14px rgba(20,30,58,.35)}
.foot{padding:4px 16px 10px;font-size:11.5px;color:var(--ink-soft);text-align:center}
.bk.unpaid{background:#FFFBF0;border-left:3px solid #E3B34C}
.waittag{display:inline-block;background:#FDF3DC;color:#8A6400;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.at.cx{border-color:#C9453B;color:#C9453B}
</style>
</head>
<body>
<header class="hero">
  <h1>★ Otto2 預約後台</h1>
  <div class="sub" id="mode">示範模式</div>
  <div class="tabbar">
    <button class="tabbtn on" data-tab="today">今日排課</button>
    <button class="tabbtn" data-tab="sched">班表設定</button>
  </div>
</header>
<div id="topbar"></div>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>
<button class="fab" id="fabAdd">＋ 手動登記</button>

<div class="mask" id="mask"><div class="sheet" id="sheetBody"></div></div>

<script>
/* ════════ 設定區：與 index.html 一致 ════════ */
const SHEET_ID     = "1QjiDwmPcwbmdhmNv9cz1A6veC_BbC75m1VJG85P3Q6M";
const FIREBASE_URL = "https://otto2-booking-f9ef7-default-rtdb.asia-southeast1.firebasedatabase.app";
const SEAT_CAP     = 13;
const CAP_PER_TEACHER = 5;
const BASE_WEEK = {0:0,1:2,2:2,3:2,4:2,5:2,6:3};
const SLOTS = ["10:00-12:00","14:00-16:00","16:00-18:00"];
const NOTIFY_URL   = "https://otto2-notify-production.up.railway.app";

let tab="today", cur=new Date(), calY, calM, schedule={}, bookings=[];
const pad=n=>String(n).padStart(2,"0");
const ds_=d=>`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`;
const mk=(y,m,d)=>`${y}/${pad(m)}/${pad(d)}`;
const wn=["日","一","二","三","四","五","六"];
const fb=p=>FIREBASE_URL.replace(/\/$/,"")+p;

async function gviz(sheet){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheet)}&tqx=out:json`;
  const t=await (await fetch(url)).text();
  const j=JSON.parse(t.substring(t.indexOf("{"),t.lastIndexOf("}")+1));
  return j.table.rows.map(r=>r.c.map(c=>c?(c.f??c.v):""));
}
async function loadSchedule(){
  schedule={};
  if(SHEET_ID){
    try{
      let rows=await gviz("班表");
      if(rows.length&&String(rows[0][0]).trim()==="日期")rows.shift();
      for(const r of rows){
        const d=String(r[0]||"").trim().replace(/-/g,"/");
        const v=String(r[2]??"").trim();
        if(d&&v!=="")schedule[d]=Math.max(0,+v||0);
      }
    }catch(e){}
  }
  if(FIREBASE_URL){
    try{
      const j=await (await fetch(fb("/schedule.json"))).json();
      if(j)for(const k in j){
        const v=j[k];
        if(v!==null&&v!==undefined&&v!=="")schedule[k.replace(/-/g,"/")]=Math.max(0,+v||0);
      }
    }catch(e){}
  }
}
async function loadBookings(){
  if(FIREBASE_URL){
    try{
      const j=await (await fetch(fb("/bookings.json"))).json();
      bookings=j?Object.entries(j).map(([k,v])=>({id:k,...v})):[];
    }catch(e){bookings=[]}
    document.getElementById("mode").textContent="即時資料";
  }else bookings=[];
}
function teachersOn(d){
  if(schedule[d]!==undefined)return schedule[d];
  const [y,m,dd]=d.split("/").map(Number);
  return BASE_WEEK[new Date(y,m-1,dd).getDay()]??1;
}
const baseOn=d=>{const [y,m,dd]=d.split("/").map(Number);return BASE_WEEK[new Date(y,m-1,dd).getDay()]??1};
const capOf=d=>Math.min(teachersOn(d)*CAP_PER_TEACHER,SEAT_CAP);

async function setTeachers(dateStr,val){
  if(val===null){delete schedule[dateStr]}else{schedule[dateStr]=val}
  render();
  if(!FIREBASE_URL)return;
  const path=fb("/schedule/"+dateStr.replace(/\//g,"-")+".json");
  try{
    if(val===null)await fetch(path,{method:"DELETE"});
    else await fetch(path,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)});
  }catch(e){alert("儲存失敗，請檢查網路連線")}
}

/* ══ 今日排課 ══ */
function renderToday(){
  const ds=ds_(cur);
  document.getElementById("topbar").innerHTML=`<div class="datebar">
    <button id="pd">‹</button><div class="d">${ds}（${wn[cur.getDay()]}）</div>
    <button id="nd">›</button><button class="today" id="todayBtn">今天</button></div>`;
  document.getElementById("pd").onclick=()=>{cur.setDate(cur.getDate()-1);render()};
  document.getElementById("nd").onclick=()=>{cur.setDate(cur.getDate()+1);render()};
  document.getElementById("todayBtn").onclick=()=>{cur=new Date();render()};

  const todays=bookings.filter(b=>b.date===ds&&b.status!=="cancelled"&&b.status!=="expired");
  const tN=teachersOn(ds),cap=capOf(ds);
  const ppl=todays.reduce((s,b)=>s+(+b.people||0),0);
  const dish=new Set();todays.forEach(b=>(b.items||[]).forEach(i=>dish.add(i.name+(i.spec?'('+i.spec+')':''))));
  const anyOver=SLOTS.some(s=>todays.filter(b=>b.slot===s).reduce((x,b)=>x+(+b.people||0),0)>cap);

  let html=`<div class="kpis">
    <div class="kpi tset"><div class="trow">
      <button class="tbtn" id="tM">−</button><div class="n">${tN}</div><button class="tbtn" id="tP">＋</button>
    </div><div class="l">可開課老師${schedule[ds]!==undefined?'・已指定':'・預設'}</div></div>
    <div class="kpi ${anyOver?'alert':''}"><div class="n">${ppl}</div><div class="l">今日總人次</div></div>
    <div class="kpi"><div class="n">${todays.filter(b=>b.attend==="in").reduce((x,b)=>x+(+b.people||0),0)}<span style="font-size:14px;color:var(--ink-soft)">/${ppl}</span></div><div class="l">已報到人次</div></div>
  </div>`;

  const extra=[...new Set(todays.map(b=>b.slot).filter(s=>!SLOTS.includes(s)))];
  for(const s of [...SLOTS,...extra]){
    const list=todays.filter(b=>b.slot===s||b.slot2===s);
    const n=list.reduce((x,b)=>x+(+b.people||0),0);
    const over=n>cap,pct=Math.min(100,cap?n/cap*100:100);
    const ds2=[...new Set(list.flatMap(b=>(b.items||[]).map(i=>i.name+(i.spec?'('+i.spec+')':''))))];
    html+=`<div class="slotcard ${over?'over':''}">
      <div class="slothead"><h2>${s}</h2><span class="badge ${over?'over':''}">${n}／${cap} 位${over?'・超載！':''}</span></div>
      <div class="meter"><i class="${over?'over':''}" style="width:${pct}%"></i></div>
      ${ds2.length?`<div class="dishes">品項：${ds2.join("、")}${ds2.length>2?'　⚠ 品項偏多，注意備料':''}</div>`:''}
      ${list.map(b=>{
        const unpaid=b.deposit&&b.deposit.status!=="paid"&&b.status!=="new";
        return `<div class="bk ${unpaid?'unpaid':''}">
        <div class="who"><b>${b.customer?.name||"—"}</b> ${b.people}位${unpaid?'<span class="waittag">待付訂金</span>':''}${b.slot2?'<span class="src">連堂 '+b.slot+'＋'+b.slot2+'</span>':''}${b.source==="manual"?'<span class="src">現場登記</span>':''}
          <div class="tel">${b.customer?.phone||""}${b.party?.label?'　·　'+b.party.label:''}</div>
          ${b.customer?.note?`<div class="note">備註：${b.customer.note}</div>`:''}
          ${b.visitCount>0&&(b.items||[]).some(i=>/體驗/.test(i.spec||""))?'<div class="flag">⚠ 已來過 '+b.visitCount+' 次卻選體驗價，請現場核對</div>':''}
          ${b.visitCount===0&&b.deposit?.method==="points"?'<div class="flag">⚠ 首次來卻選儲值金扣點，請確認是否真有點數</div>':''}
          ${b.visitCount===0?'<span class="newtag">首次</span>':''}
          ${b.deposit?`<button class="dep ${b.deposit.status==='paid'?'paid':'pending'}" data-dep-id="${b.id||''}" data-dep-st="${b.deposit.status}">${b.deposit.method==='points'?'點數'+b.deposit.amount:'LINE Pay '+b.deposit.amount}・${b.deposit.status==='paid'?'已收 ✓':'待確認（點我標記）'}</button>`:''}
        </div>
        <div class="items">${(b.items||[]).map(i=>`${i.name}${i.spec?'('+i.spec+')':''}<b>×${i.qty||''}</b>${(i.addons||[]).map(a=>'<br>＋'+a.name).join("")}`).join("<br>")}
          <div class="atrow">
            <button class="at ${b.attend==='in'?'on':''}" data-at="${b.id}" data-v="in">已報到</button>
            <button class="at ${b.attend==='no'?'no':''}" data-at="${b.id}" data-v="no">未到</button>
            <button class="at cx" data-cx="${b.id}">取消預約</button>
          </div>
        </div>
      </div>`}).join("")||`<div style="font-size:13px;color:var(--ink-soft);padding-top:6px">尚無預約</div>`}
    </div>`;
  }
  document.getElementById("wrap").innerHTML=html;
  document.getElementById("foot").textContent="每 60 秒自動更新・全店看到的是同一份即時資料";
  document.getElementById("fabAdd").style.display="block";

  document.getElementById("tM").onclick=()=>setTeachers(ds,Math.max(0,tN-1));
  document.getElementById("tP").onclick=()=>setTeachers(ds,Math.min(6,tN+1));
  document.querySelectorAll("[data-at]").forEach(btn=>btn.onclick=async()=>{
    const id=btn.dataset.at, v=btn.dataset.v;
    if(!id||!FIREBASE_URL)return;
    const bk=bookings.find(x=>x.id===id);
    const next=(bk&&bk.attend===v)?null:v;   // 再點一次取消
    await fetch(fb("/bookings/"+id+".json"),{method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({attend:next, attendAt:next?new Date().toISOString():null})});
    refresh();
  });
  document.querySelectorAll("[data-dep-id]").forEach(btn=>btn.onclick=async()=>{
    const id=btn.dataset.depId;if(!id||!FIREBASE_URL)return;
    const next=btn.dataset.depSt==="paid"?"pending":"paid";
    await fetch(fb("/bookings/"+id+"/deposit.json"),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:next})});
    /* 訂金收到 → 預約才算確認；退回待確認 → 回到 unpaid */
    await fetch(fb("/bookings/"+id+".json"),{method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({status:next==="paid"?"confirmed":"unpaid"})});
    refresh();
  });
  document.querySelectorAll("[data-cx]").forEach(btn=>btn.onclick=async()=>{
    const id=btn.dataset.cx;if(!id||!FIREBASE_URL)return;
    const bk=bookings.find(x=>x.id===id);
    const who=bk?.customer?.name||"這筆";
    if(!confirm(`確定取消 ${who} 的預約？\n名額會立刻釋出，客人會收到 LINE 取消通知。`))return;
    const reason=prompt("取消原因（可留空，會顯示在客人的通知裡）","")||"";
    btn.disabled=true;btn.textContent="取消中…";
    try{
      await fetch(fb("/bookings/"+id+".json"),{method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({status:"cancelled",cancelledAt:new Date().toISOString(),cancelReason:reason})});
      if(NOTIFY_URL&&bk?.line?.userId){
        await fetch(NOTIFY_URL.replace(/\/$/,"")+"/notify/cancel",{method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({...bk,reason:reason||undefined})}).catch(()=>{});
      }
    }catch(e){alert("取消失敗："+e.message)}
    refresh();
  });
}

/* ══ 班表設定（月曆） ══ */
function renderSched(){
  const now=new Date();
  if(!calY){calY=now.getFullYear();calM=now.getMonth()+1}
  document.getElementById("topbar").innerHTML="";
  document.getElementById("fabAdd").style.display="none";

  const days=new Date(calY,calM,0).getDate();
  const startW=(new Date(calY,calM-1,1).getDay()+6)%7;
  const today=ds_(now);
  let cells=["一","二","三","四","五","六","日"].map(w=>`<div class="wd">${w}</div>`).join("");
  for(let i=0;i<startW;i++)cells+="<div></div>";
  let monthPpl=0;
  for(let d=1;d<=days;d++){
    const k=mk(calY,calM,d);
    const t=teachersOn(k),cap=Math.min(t*CAP_PER_TEACHER,SEAT_CAP);
    const set=schedule[k]!==undefined&&schedule[k]!==baseOn(k);
    const cls=[t===0?"rest":"",set?"set":"",t===0?"":"",k<today?"pastday":""].join(" ");
    monthPpl+=cap*SLOTS.length;
    cells+=`<button class="mday ${cls}" data-k="${k}">
      <span class="dd">${d}</span>
      <span class="tn">${t===0?"休":t}</span>
      <span class="cap">${t===0?"":cap+"位"}</span></button>`;
  }
  document.getElementById("wrap").innerHTML=`
    <div class="mhead"><button id="pm">‹</button><h2>${calY} 年 ${calM} 月</h2><button id="nm">›</button></div>
    <div class="mgrid">${cells}</div>
    <div class="legend">
      每格上方是日期、中間大字是<b>可開課老師數</b>、下方是該時段名額。<br>
      名額 = 老師數 × ${CAP_PER_TEACHER}，最多 ${SEAT_CAP} 位（座位上限）。<br>
      深色外框代表<b>你手動指定過</b>；其餘套用預設（一～五 2 位、六 3 位、日休）。<br>
      點任一天即可調整，客人端立刻同步。
    </div>`;
  document.getElementById("foot").textContent="先把整個月排好，客人就約不進沒人力的時段";
  document.getElementById("pm").onclick=()=>{calM--;if(calM<1){calM=12;calY--}render()};
  document.getElementById("nm").onclick=()=>{calM++;if(calM>12){calM=1;calY++}render()};
  document.querySelectorAll(".mday").forEach(b=>b.onclick=()=>openDayEditor(b.dataset.k));
}

function openDayEditor(k){
  const [y,m,d]=k.split("/").map(Number);
  const w=wn[new Date(y,m-1,d).getDay()];
  const curT=teachersOn(k),base=baseOn(k),isSet=schedule[k]!==undefined;
  let opts="";
  for(let i=0;i<=6;i++){
    const cap=Math.min(i*CAP_PER_TEACHER,SEAT_CAP);
    opts+=`<button class="nopt ${i===curT?'on':''}" data-n="${i}">${i===0?'休':i}<small>${i===0?'不開課':cap+'位'}</small></button>`;
  }
  document.getElementById("sheetBody").innerHTML=`
    <h3>${k}（${w}）</h3>
    <div class="sh">目前 ${curT===0?'不開課':curT+' 位老師・每時段 '+Math.min(curT*CAP_PER_TEACHER,SEAT_CAP)+' 位'}${isSet?'（手動指定）':'（預設值）'}</div>
    <div class="nopts">${opts}</div>
    ${isSet?`<button class="reset" id="rst">恢復預設（${base===0?'休':base+' 位'}）</button>`:''}
    <div class="sbtns"><button class="cancel" id="cls">關閉</button></div>
    <div class="hint">改完立即生效，客人端該日名額同步更新。已經約進來的預約不會被取消，若因此超載，今日排課頁會顯示紅色警示。</div>`;
  document.getElementById("mask").classList.add("on");
  document.querySelectorAll(".nopt").forEach(b=>b.onclick=async()=>{
    await setTeachers(k,+b.dataset.n);
    document.getElementById("mask").classList.remove("on");
  });
  const r=document.getElementById("rst");
  if(r)r.onclick=async()=>{await setTeachers(k,null);document.getElementById("mask").classList.remove("on")};
  document.getElementById("cls").onclick=()=>document.getElementById("mask").classList.remove("on");
}

/* ══ 手動登記 ══ */
document.getElementById("fabAdd").onclick=()=>{
  document.getElementById("sheetBody").innerHTML=`
    <h3>手動登記預約</h3><div class="sh">現場／電話／超收加開，不受 ${SEAT_CAP} 席上限限制</div>
    <div class="frow">
      <div class="f"><label>日期</label><input id="mDate" value="${ds_(cur)}"></div>
      <div class="f"><label>時段</label><select id="mSlot">${SLOTS.map(s=>`<option>${s}</option>`).join("")}<option>其他（備註填時間）</option></select></div>
    </div>
    <div class="frow">
      <div class="f"><label>姓名 *</label><input id="mName"></div>
      <div class="f"><label>人數 *</label><input id="mPeople" inputmode="numeric" value="1"></div>
    </div>
    <div class="f"><label>電話</label><input id="mPhone" inputmode="tel"></div>
    <div class="f"><label>課程／品項</label><input id="mCourse" placeholder="例：流動畫30cm×2"></div>
    <div class="f"><label>備註</label><textarea id="mNote" rows="2" placeholder="例：加開B教室，羊羊協助"></textarea></div>
    <div class="sbtns"><button class="cancel" id="mCancel">取消</button><button class="save" id="mSave">登記</button></div>`;
  document.getElementById("mask").classList.add("on");
  document.getElementById("mCancel").onclick=()=>document.getElementById("mask").classList.remove("on");
  document.getElementById("mSave").onclick=async()=>{
    const g=id=>document.getElementById(id).value.trim();
    if(!g("mName")||!(+g("mPeople"))){alert("姓名和人數必填");return}
    const rec={date:g("mDate").replace(/-/g,"/"),slot:g("mSlot"),people:+g("mPeople"),
      items:g("mCourse")?[{name:g("mCourse"),spec:"",qty:+g("mPeople")}]:[],
      customer:{name:g("mName"),phone:g("mPhone"),note:g("mNote")},
      status:"new",source:"manual",ts:new Date().toISOString()};
    if(FIREBASE_URL)await fetch(fb("/bookings.json"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)});
    document.getElementById("mask").classList.remove("on");
    refresh();
  };
};
document.getElementById("mask").onclick=e=>{if(e.target.id==="mask")document.getElementById("mask").classList.remove("on")};

function render(){tab==="today"?renderToday():renderSched()}
async function refresh(){await loadSchedule();await loadBookings();render()}
document.querySelectorAll(".tabbtn").forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab;
  document.querySelectorAll(".tabbtn").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
refresh();
setInterval(()=>{if(tab==="today")refresh()},60000);
</script>
</body>
