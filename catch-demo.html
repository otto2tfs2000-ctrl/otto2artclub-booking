<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>感恩節接火雞</title>
<meta name="robots" content="noindex,nofollow">
<style>
/* 版面：一個畫面一件事 —— 畫角色（紙＋工具列）→ 全螢幕側視跑酷 → 結算卡。單一秋天農場配色，不分深淺色。 */
:root{
  --sky:#f7cf8a; --paper:#fffaf0; --ink:#3b2416; --soft:#7a5a41;
  --pumpkin:#e2711d; --leaf:#b5451b; --field:#c8974a; --line:#e3cfa8;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;overscroll-behavior:none}
[hidden]{display:none!important}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#app{position:relative;height:100%;overflow:hidden}

/* 畫角色 */
#scrDraw{gap:8px;justify-content:flex-start;background:linear-gradient(var(--sky),#fbe6c0)}
#scrDraw h1{margin:0;font-size:20px;letter-spacing:.04em}
#scrDraw p{margin:0;font-size:12px;color:var(--soft);text-align:center;line-height:1.5}
.sheet{position:relative;width:100%;max-width:560px;flex:1;min-height:0}
.plate{position:absolute;left:50%;top:8px;width:34%;height:16px;pointer-events:none;opacity:.8;transform:translateX(-50%);
  background:#fff;border:2px solid #b9a98f;border-radius:50%;box-shadow:0 3px 0 #d8c8a8}
.plate span{position:absolute;left:50%;top:18px;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--soft)}
#pad{display:block;width:100%;height:100%;box-sizing:border-box;background:var(--paper);border:2px solid var(--ink);border-radius:14px;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;width:min(100%,420px)}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0;box-sizing:border-box}
.sw.more{position:relative;background:conic-gradient(#e74c3c,#f1c40f,#2ecc71,#1abc9c,#3498db,#9b59b6,#e74c3c);display:inline-block;cursor:pointer}
.sw.more::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--pick,#fff);border:2px solid #fff}
.sw.more input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.tool{min-width:40px;height:36px;padding:0 8px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-size:14px}
.tool.on{border-color:var(--ink);background:#ffe9b8}
.tool i{display:inline-block;background:var(--ink);border-radius:50%;vertical-align:middle}
.go{flex:none;height:48px;padding:0 44px;border-radius:26px;border:0;background:var(--pumpkin);color:#fff;font-size:20px;font-weight:700;
  letter-spacing:.1em;box-shadow:0 4px 0 var(--leaf)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf)}
#msg{min-height:0;font-size:14px;color:var(--leaf);font-weight:600}

/* 遊戲 */
#scrPlay{padding:0}
#cv{display:block;width:100%;height:100%;touch-action:none}

/* 結算 */
#scrEnd{justify-content:center;background:rgba(59,36,22,.55)}
.card{width:min(100%,340px);background:var(--paper);border-radius:20px;padding:22px 20px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;gap:12px;border:2px solid var(--ink)}
.card h2{margin:0;font-size:22px}
#endImg{height:90px;max-width:60%;object-fit:contain}
.big{font-size:54px;font-weight:800;line-height:1;color:var(--pumpkin);font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--soft);font-weight:600;margin-left:4px}
.stats{display:flex;gap:10px;width:100%}
.stats div{flex:1;background:#fbeed2;border-radius:12px;padding:10px 4px;text-align:center;font-size:13px;color:var(--soft)}
.stats b{display:block;font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
#endNote{font-size:13px;color:var(--soft);text-align:center;min-height:18px}
.btns{display:flex;gap:10px;width:100%}
.btns button{flex:1;height:48px;border-radius:24px;font-size:16px;font-weight:700}
.btns .again{border:0;background:var(--pumpkin);color:#fff;box-shadow:0 4px 0 var(--leaf)}
.btns .redo{border:2px solid var(--ink);background:var(--paper)}

/* 開場故事 */
#scrStory{justify-content:center;gap:14px;background:#211a12;color:#f3e6c8}
.tag{display:flex;flex-direction:column;align-items:center;gap:2px;background:#ffcf6b;color:#211a12;border-radius:10px;padding:8px 16px;transform:rotate(-2deg);box-shadow:0 4px 0 #a8742a;flex:none}
.tag b{font-size:19px;font-weight:900;letter-spacing:.04em}.tag span{font-size:14px;font-weight:700}
.mis{display:block;font-size:22px;color:#ffcf6b;letter-spacing:.1em;margin-bottom:4px}#stTxt small{display:block;font-size:14px;color:#c9b38a;margin-top:6px}
#stCv{width:100%;max-width:560px;border-radius:6px;border:3px solid #6b5432;box-shadow:0 8px 24px rgba(0,0,0,.5);flex:none;box-sizing:border-box}
#stTxt{font-size:18px;line-height:1.65;text-align:center;max-width:30em;min-height:5em;text-wrap:balance}
#stDots{display:flex;gap:6px}#stDots i{width:8px;height:8px;border-radius:50%;background:#5a4630}#stDots i.on{background:#e8c27a}
.stBtns{display:flex;gap:10px;width:100%;max-width:360px}
.stBtns button{flex:1;height:48px;border-radius:24px;font-size:16px;font-weight:700}
#stSkip{background:transparent;border:2px solid #6b5432;color:#d9b77a}
#stNext{border:0;background:var(--pumpkin);color:#fff;box-shadow:0 4px 0 var(--leaf)}
.voice{font-size:12px;color:#9c8460}
/* 結局 */
#scrEnd{justify-content:flex-start;overflow-y:auto;background:#211a12;color:#f3e6c8;gap:12px;padding-block:16px}
#endCv{width:100%;max-width:560px;border-radius:6px;border:3px solid #6b5432;flex:none}
#endStory{font-size:15px;line-height:1.6;text-align:center;max-width:30em;color:#e6d3ac}
#endBig{font-size:30px;font-weight:800;color:#ffcf6b;text-align:center}
#endBig b{font-size:46px;font-variant-numeric:tabular-nums}
.estats{display:flex;gap:8px;width:100%;max-width:400px}
.estats div{flex:1;background:#33281b;border-radius:12px;padding:8px 2px;text-align:center;font-size:12px;color:#b9a27a}
.estats b{display:block;font-size:22px;color:#f3e6c8;font-variant-numeric:tabular-nums}
#endNote{font-size:13px;color:#b9a27a;text-align:center}
.btns{display:flex;gap:10px;width:100%;max-width:400px}
.btns .redo{border:2px solid #6b5432;background:transparent;color:#f3e6c8}
#btnEp{width:100%;max-width:400px;height:46px;border-radius:23px;border:2px solid #c9a35a;background:#2b4a4d;color:#f3e6c8;font-size:15px;font-weight:700;flex:none}
#epNote{font-size:12px;color:#9c8460;text-align:center;min-height:16px}

/* 開場影片（直式）＋字幕疊在影片下方 */
#scrStory{justify-content:flex-start;gap:10px}
#stBox{position:relative;width:100%;max-width:440px;flex:1;min-height:0;border-radius:10px;overflow:hidden;border:3px solid #6b5432;background:#000;box-sizing:border-box}
#stVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stBox #stCv{position:absolute;left:0;top:0;border:0;border-radius:0;box-shadow:none}
#stSnd{position:absolute;top:8px;right:8px;border:0;border-radius:16px;padding:6px 12px;background:rgba(20,15,8,.7);color:#f3e6c8;font-size:13px;font-weight:700}
#stBox #stTxt{position:absolute;left:0;right:0;bottom:0;min-height:0;max-width:none;margin:0;padding:48px 14px 14px;font-size:17px;line-height:1.6;
  background:linear-gradient(rgba(15,10,5,0),rgba(15,10,5,.88) 32%);text-shadow:0 1px 3px #000}
#stBar{position:absolute;left:0;top:0;height:4px;width:0;background:#ffcf6b;z-index:2}
#stGo{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3;color:#fff;padding:0}
#stGo .ic{position:relative;width:96px;height:96px;border-radius:50%;background:var(--pumpkin);display:grid;place-items:center;box-shadow:0 5px 0 var(--leaf)}
#stGo .ic::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid #ffcf6b;animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
#stGo b{font-size:20px;font-weight:900;background:rgba(20,15,8,.8);padding:7px 18px;border-radius:20px;white-space:nowrap}
#stGo small{font-size:13px;color:#f3e6c8;text-shadow:0 1px 3px #000;white-space:nowrap}
#stBox.pre #stVid{filter:brightness(.5)}
#stSnd svg{vertical-align:-3px;margin-right:4px}
@keyframes stbar{from{width:0}to{width:100%}}

/* 結局影片＋拍照 */
#scrOutro{padding:0;background:#000;z-index:5}
#outBox{position:relative;width:100%;height:100%}
#outSkip{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));border:0;border-radius:18px;padding:8px 16px;background:rgba(20,15,8,.7);color:#f3e6c8;font-size:14px;font-weight:700}
.photo{margin:6px 0 4px;background:#fbf6ea;padding:10px 10px 0;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.6);transform:rotate(-2deg);width:calc(100% - 12px);max-width:540px;box-sizing:border-box;flex:none;animation:photoIn .8s ease-out}
.photo #endCv{border:0;border-radius:0;max-width:none;display:block}
.photo figcaption{color:#3b2416;text-align:center;padding:10px 4px 12px;font-size:15px;font-weight:700;letter-spacing:.04em}
@keyframes photoIn{from{transform:rotate(-9deg) scale(.82);opacity:0}to{transform:rotate(-2deg) scale(1);opacity:1}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

/* 拍合照（臉洞看板） */
#btnBooth{width:100%;max-width:400px;height:52px;border-radius:26px;border:0;background:#ffcf6b;color:#211a12;font-size:17px;font-weight:900;box-shadow:0 4px 0 #a8742a;flex:none}
#scrBooth,#scrShot{justify-content:flex-start;overflow-y:auto;background:#211a12;color:#f3e6c8;gap:10px;padding-block:14px}
.bTop{display:flex;flex-direction:column;align-items:center;gap:2px}.bTop b{font-size:18px;color:#ffcf6b}.bTop span{font-size:13px;color:#c9b38a}
#bWrap{width:min(100%,460px,58vh);flex:none}
.bErr{margin:0;min-height:0;font-size:14px;font-weight:700;color:#ffb38a;text-align:center}
#bCv{display:block;width:100%;aspect-ratio:4/5;border-radius:6px;border:3px solid #6b5432;box-sizing:border-box;touch-action:none;background:#111}
.bZoom{display:flex;align-items:center;gap:10px;width:100%;max-width:400px;font-size:13px;color:#c9b38a}.bZoom input{flex:1}
.bHint{margin:0;font-size:13px;color:#c9b38a;text-align:center}
.bCam{position:relative;display:flex;align-items:center;justify-content:center;width:100%;max-width:400px;height:52px;border-radius:26px;background:var(--pumpkin);color:#fff;font-size:18px;font-weight:900;box-shadow:0 4px 0 var(--leaf);flex:none;cursor:pointer}
.bCam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#bMsg{width:100%;max-width:400px;height:46px;border-radius:12px;border:2px solid #6b5432;background:#2b2116;color:#f3e6c8;font-size:16px;padding:0 14px;box-sizing:border-box;font-family:inherit;flex:none}
#shotImg{width:100%;max-width:420px;border-radius:4px;box-shadow:0 12px 28px rgba(0,0,0,.6);flex:none}
.bWide{width:100%;max-width:400px;height:46px;border-radius:23px;border:2px solid #c9a35a;background:#2b4a4d;color:#f3e6c8;font-size:15px;font-weight:700;flex:none}
.bWide:disabled{opacity:.5}
#bVid{position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0}
.bAlt{position:relative;font-size:13px;color:#c9b38a;text-decoration:underline;cursor:pointer;flex:none}
.bAlt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.bCam.shoot{background:#e5383b;box-shadow:0 4px 0 #8f1f22}
.bZoom input[type=range]{touch-action:pan-x;height:28px}
#scrEnd,#scrBooth,#scrShot{touch-action:pan-y}
#outBox{touch-action:none}
#outPan{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(20,15,8,.7);color:#f3e6c8;font-size:13px;font-weight:700;padding:6px 14px;border-radius:16px;white-space:nowrap;pointer-events:none}
</style>

<div id="app">
  <div id="flash"></div>
  <section class="scr" id="scrStory">
    <div class="tag"><b>感恩節亂編的胡說八道小故事</b><span>不是真的歷史，請勿當真！</span></div>
    <div id="stBox" class="pre">
      <canvas id="stCv" aria-label="梵谷《吃馬鈴薯的人》"></canvas>
      <video id="stVid" playsinline webkit-playsinline preload="auto" src="catch-video/intro.mp4"></video>
      <button id="stSnd" hidden>🔊 聲音開</button>
      <div id="stBar"></div>
      <button id="stGo" aria-label="開聲音，開始看故事"><span class="ic"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="#fff"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span><b>點我開聲音</b><small>故事有旁白，記得開聲音</small></button>
      <div id="stTxt"></div>
    </div>
    <div id="stDots"></div>
    <div class="stBtns"><button id="stSkip">略過，直接玩</button></div>
  </section>

  <section class="scr" id="scrDraw" hidden>
    <h1>畫你的角色</h1>
    <p>畫火雞、畫人、畫農夫都可以，盤子會自動加在頭上。</p>
    <div class="sheet">
      <canvas id="pad" aria-label="畫角色的畫布"></canvas>
      <div class="plate"><span>盤子在這</span></div>
    </div>
    <div class="row" id="cols"></div>
    <div class="row">
      <button class="tool" id="sz0" aria-label="細筆"><i style="width:6px;height:6px"></i></button>
      <button class="tool on" id="sz1" aria-label="中筆"><i style="width:12px;height:12px"></i></button>
      <button class="tool" id="sz2" aria-label="粗筆"><i style="width:20px;height:20px"></i></button>
      <button class="tool" id="btnEr">橡皮擦</button>
      <button class="tool" id="btnUn">上一步</button>
      <button class="tool" id="btnCl">清空</button>
    </div>
    <div id="msg" role="status"></div>
    <button class="go" id="btnGo">出發</button>
  </section>

  <section class="scr" id="scrPlay" hidden>
    <canvas id="cv"></canvas>
  </section>

  <section class="scr" id="scrOutro" hidden>
    <div id="outBox"></div>
    <div id="outPan" hidden>◀ 手指左右拖，看看整個畫面 ▶</div>
    <button id="outSkip">略過 ▶</button>
  </section>

  <section class="scr" id="scrEnd" hidden>
    <figure class="photo" id="photo"><canvas id="endCv" aria-label="你的版本的吃馬鈴薯的人"></canvas><figcaption id="photoCap"></figcaption></figure>
    <div id="endStory"></div>
    <div id="endBig"></div>
    <div class="estats">
      <div><b id="eTotal">0</b>飛出來（隻）</div>
      <div><b id="eServed">0</b>帶回小屋（隻）</div>
      <div><b id="eBest">0</b>最高疊（隻）</div>
    </div>
    <div id="endNote"></div>
    <button id="btnBooth">📸 換你入鏡：跟馬鈴薯一家拍合照</button>
    <div class="btns">
      <button class="redo" id="btnRedo">重畫角色</button>
      <button class="again" id="btnAgain">再玩一次</button>
    </div>
    <button id="btnEp">🎧 聽這幅畫真正的故事</button>
    <div id="epNote"></div>
  </section>
  <section class="scr" id="scrBooth" hidden>
    <div class="bTop"><b>跟馬鈴薯一家拍合照</b><span>自拍一張，把你的臉放進空的位置</span></div>
    <div id="bWrap"><canvas id="bCv" aria-label="合照預覽"></canvas></div>
    <div class="bZoom" id="bZoomRow" hidden><span>小</span><input type="range" id="bZoom" min="0.3" max="3" step="0.01" value="1" aria-label="照片大小"><span>大</span></div>
    <p class="bHint" id="bHint">先按下面的按鈕自拍</p>
    <button class="bCam" id="bLiveBtn" type="button">📷 開相機，把臉對進洞裡</button>
    <label class="bAlt" id="bCamBtn"><input type="file" accept="image/*" capture="user" id="bFile">相機打不開？改用手機相機拍／選照片</label>
    <video id="bVid" playsinline webkit-playsinline muted autoplay></video>
    <input id="bMsg" maxlength="30" placeholder="寫一句感恩的話（最多 30 字）" autocomplete="off">
    <p class="bErr" id="bErr" role="status"></p>
    <div class="btns"><button class="redo" id="bBack">回上一頁</button><button class="again" id="bDone">完成合照</button></div>
  </section>

  <section class="scr" id="scrShot" hidden>
    <img id="shotImg" alt="你的感恩節合照">
    <p class="bHint">長按照片就可以存到手機</p>
    <button class="bWide" id="shotShare" hidden>分享給朋友</button>
    <button class="bWide" id="shotUp" disabled>上傳到作品島大樹（即將開放）</button>
    <div class="btns"><button class="redo" id="shotRe">重拍一張</button><button class="again" id="shotBack">回到成績</button></div>
  </section>
</div>

<script>
(()=>{
'use strict';

/* 開場故事（假的感恩節小故事，正式版換成語音） */
const STORY=['這是梵谷 1885 年畫的《吃馬鈴薯的人》（只有這句是真的！）。這一家人在畫裡連吃了 140 年馬鈴薯，早餐、午餐、晚餐……全是馬鈴薯。',
  '今年感恩節，馬鈴薯罷工了：「我們也要放假！」戴上墨鏡，一顆一顆滾去海邊度假。全家人都傻眼了。',
  '隔壁農場也大亂：幽浮要抓火雞去參加宇宙歌唱大賽，烏鴉想搶火雞回家當寵物，脾氣超差的老公雞一直丟爆炸蛋！',
  '爸爸吞了吞口水：「今晚……要不要換換口味？」全家人慢慢轉頭——看著你。',
  '<b class="mis">你的任務</b>頭頂盤子接火雞、疊高高，送回馬鈴薯一家的小屋。<br>幽浮、烏鴉、爆炸蛋，通通閃開！<small>火雞進了小屋會變成晚餐……還是別的什麼？玩到最後就知道！</small>'];
$('#stDots').innerHTML=STORY.map(()=>'<i></i>').join('');
/* 故事頁的動畫：鏡頭在名畫上推近到那一頁講的地方，再疊一點小特效 */
const stCv=$('#stCv'),sx=stCv.getContext('2d');
/* 每頁的鏡頭時間軸：[第幾秒, 中心x, 中心y, 放大倍數]（一頁對一段 10 秒影片） */
const TL=[[[0,.5,.5,1],[2.6,.37,.72,2.3]],[[0,.38,.68,1.9],[4.6,.445,.25,2.6]],[[0,.5,.5,1]],[[0,.2,.4,2.3],[2.2,.5,.45,1.25]],[[0,.5,.5,1]]];
let stI=0,stT=0,stLast=0,stRaf=0,cam=[.5,.5,1],camFrom=[.5,.5,1],SW=340,SH=240,crop=[0,0,1,1];
const ease=k=>{k=clamp(k,0,1);return k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2},lerp=(a,b,k)=>a+(b-a)*k;
function stFit(){const r=stCv.getBoundingClientRect();if(r.width<10)return;SW=r.width-6;SH=SW*537/760;const dp=Math.min(2,window.devicePixelRatio||1);
  stCv.width=SW*dp;stCv.height=SH*dp;stCv.style.height=(SH+6)+'px';sx.setTransform(dp,0,0,dp,0,0)}
window.addEventListener('resize',()=>{if(!scrStory.hidden)stFit()});
/* 大熊用 deevid.ai 做的 5 支直式影片，一頁一支；載不到就退回名畫動畫 */
/* 2026-11-13 大熊：開場不要一頁一頁，5 支影片接成一支、配上他錄的旁白（影片原音壓小當背景），一路播完自動進畫角色，只留「略過」 */
const CUTS=[0,10.7,23.0,35.3,47.0];   // 旁白五段的開始秒數，字幕照這個換
const stVid=$('#stVid'),stSnd=$('#stSnd');let vidOK=true,fbTimer=0;
stVid.poster=PE;
stVid.addEventListener('error',()=>{vidOK=false;stVid.hidden=true;stSnd.hidden=true;stFit()});
stVid.addEventListener('timeupdate',()=>{if(scrStory.hidden)return;const t=stVid.currentTime;let k=0;CUTS.forEach((c,j)=>{if(t>=c)k=j});if(k!==stI){stI=k;stShow()}
  if(stVid.duration)$('#stBar').style.width=(t/stVid.duration*100)+'%'});
stVid.addEventListener('ended',()=>{if(!scrStory.hidden)stDone()});
function audioInit(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}loadBgm()}
$('#stGo').onclick=()=>{audioInit();$('#stGo').hidden=true;$('#stBox').classList.remove('pre');sndUI();
  if(!vidOK){fbTimer=setInterval(()=>{if(stI<STORY.length-1){stI++;stShow()}else{clearInterval(fbTimer);stDone()}},8000);return}   // 影片載不到：名畫動畫每 8 秒換一段
  stVid.muted=false;stVid.currentTime=0;stVid.play().catch(()=>{stVid.muted=true;stVid.play().catch(()=>{})});stSnd.hidden=false};
function sndUI(){stSnd.innerHTML=(stVid.muted?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f3e6c8" stroke-width="2.4" stroke-linecap="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="#f3e6c8"/><path d="m16 9 6 6M22 9l-6 6"/></svg>聲音關':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f3e6c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="#f3e6c8"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>聲音開')}
stSnd.onclick=()=>{stVid.muted=!stVid.muted;sndUI()};
/* 背景音樂：第 5 支影片的奔跑音樂，開場播完後一路循環到遊戲結束 */
let bgmBuf=null,bgmSrc=null,bgmWant=false,bgmBusy=false;
function loadBgm(){if(bgmBuf||bgmBusy||!AC)return;bgmBusy=true;
  fetch('catch-video/bgm.mp4').then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no))).then(buf=>{bgmBuf=buf;if(bgmWant)bgmStart()}).catch(()=>{bgmBusy=false})}
let bgmGain=null;

  im.onerror=()=>{$('#bHint').textContent='這張照片讀不出來，請再拍一次'};im.src=url;e.target.value=''});

bCv.addEventListener('pointerdown',e=>{if(!bSelf)return;e.preventDefault();try{bCv.setPointerCapture(e.pointerId)}catch(_){}bPtr.set(e.pointerId,[e.clientX,e.clientY]);
  if(bPtr.size===2){const[a,b]=[...bPtr.values()];bPinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:bZ}}});

  boothRender()});
const bUp=e=>{bPtr.delete(e.pointerId);if(bPtr.size<2)bPinch=null};bCv.addEventListener('pointerup',bUp);bCv.addEventListener('pointercancel',bUp);

function wrapText(ctx,t,maxW){const out=[];let line='';for(const ch of t){if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out}

/* ───────── 畫面 ───────── */
function ell(cx,cy,rx,ry,c){x.fillStyle=c;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,7);x.fill()}
function turkey(cx,cy,s,rot,flap){x.save();x.translate(cx,cy);x.rotate(rot||0);x.scale(s,s);
  const fc=['#c0392b','#e67e22','#f1c40f','#e67e22','#c0392b'];
  for(let i=0;i<5;i++){const a=Math.PI*(1.05+i*.16);ell(Math.cos(a)*13-3,Math.sin(a)*13+2,6,6,fc[i])}
  ell(0,3,13,10,'#8a4b22');ell(-2,5,7,5,'#a9632f');
  ell(11,-6,6,6,'#8a4b22');ell(13,-7,2,2,'#fff');ell(13.6,-7,1,1,'#000');
  x.fillStyle='#f1c40f';x.beginPath();x.moveTo(16,-6);x.lineTo(22,-4);x.lineTo(16,-2);x.fill();
  ell(15,0,2,3.5,'#d62828');
  if(flap!=null){x.strokeStyle='#e67e22';x.lineWidth=2;x.beginPath();const k=Math.sin(flap)*4;
    x.moveTo(-3,12);x.lineTo(-3-k,18);x.moveTo(4,12);x.lineTo(4+k,18);x.stroke()}
  x.restore()}
function crow(c){x.save();x.translate(c.x,c.y);x.scale(c.d,1);
  ell(0,0,16,9,'#1d1b22');ell(13,-5,7,6,'#1d1b22');ell(15,-6,1.8,1.8,'#fff');
  x.fillStyle='#f0a500';x.beginPath();x.moveTo(19,-5);x.lineTo(28,-2);x.lineTo(19,-1);x.fill();
  x.fillStyle='#2e2b36';x.beginPath();const w=Math.sin(c.f)*14;x.moveTo(-8,-2);x.lineTo(2,-6-w);x.lineTo(8,-1);x.fill();
  x.fillStyle='#1d1b22';x.beginPath();x.moveTo(-14,-2);x.lineTo(-26,-6);x.lineTo(-24,4);x.fill();
  x.restore();if(c.has)turkey(c.x,c.y+18,.8,.3)}
function artist(a,cx,by){ // 站在桌子後面的半身
  const coat=['#2f5d9b','#22222a','#6d6f78'][a];x.fillStyle=coat;x.beginPath();x.roundRect(cx-16,by-46,32,46,8);x.fill();
  if(a===1){ell(cx,by-62,11,15,'#efe3c2');ell(cx,by-56,3.5,6,'#22222a');ell(cx-4,by-66,2,2.5,'#22222a');ell(cx+4,by-66,2,2.5,'#22222a');
    ell(cx-12,by-56,3.5,7,'#efe3c2');ell(cx+12,by-56,3.5,7,'#efe3c2')}
  else{ell(cx,by-60,12,12,'#f2c9a0');ell(cx-4,by-62,1.6,1.6,'#22222a');ell(cx+4,by-62,1.6,1.6,'#22222a');
    if(a===0){ell(cx,by-52,11,7,'#d9641e');ell(cx,by-70,20,4,'#e8c547');ell(cx,by-74,11,7,'#e8c547')}
    else{ell(cx,by-48,13,12,'#f4f1ea');ell(cx,by-71,17,3.5,'#22222a');ell(cx,by-76,10,7,'#22222a')}}}
function cottage(t){const by=G.gy,cx=t.x,sc=1+t.pop*.08;x.save();x.translate(cx,by);x.scale(sc,sc);
  x.fillStyle='#6e5a3e';x.fillRect(-58,-78,116,78);
  x.fillStyle='#5b4a33';for(let r=0;r<5;r++)for(let c=0;c<6;c++)if((r+c)%2)x.fillRect(-58+c*19.3+(r%2?6:0),-76+r*15,12,6);
  x.fillStyle='#8f7a3c';x.beginPath();x.moveTo(-70,-74);x.lineTo(0,-122);x.lineTo(70,-74);x.fill();
  x.strokeStyle='#6f5d2a';x.lineWidth=2;for(let i=-60;i<=60;i+=12){x.beginPath();x.moveTo(i,-76);x.lineTo(i*.4,-112);x.stroke()}
  x.fillStyle='#ffcf6b';x.fillRect(-46,-62,34,26);x.fillStyle='#3a2a18';x.fillRect(-30,-62,3,26);x.fillRect(-46,-50,34,3);
  ell(-38,-42,5,6,'#3a2a18');ell(-20,-42,5,6,'#3a2a18');
  x.fillStyle='#2a1d10';x.beginPath();x.roundRect(10,-58,30,58,[12,12,0,0]);x.fill();x.fillStyle='#ffcf6b';x.globalAlpha=.6;x.fillRect(14,-54,22,54);x.globalAlpha=1;
  const k=Math.min(4,t.got);for(let i=0;i<k;i++)turkey(-48+i*20,-8,.65,0);
  x.restore();
  x.fillStyle='#fffaf0';x.strokeStyle='#3b2416';x.lineWidth=2;x.beginPath();x.roundRect(cx-52,by-170,104,26,6);x.fill();x.stroke();
  x.fillStyle='#3b2416';x.font='700 14px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText('馬鈴薯一家',cx,by-157);
  x.beginPath();x.moveTo(cx,by-144);x.lineTo(cx,by-124);x.stroke()}
function cage(c){const by=G.gy,cx=c.x;x.fillStyle='#6b3f1d';x.fillRect(cx-28,by-8,56,8);
  if(!c.open){turkey(cx-8,by-22,.8,0);turkey(cx+10,by-20,.8,0)}
  x.strokeStyle='#4a3a2a';x.lineWidth=3;x.beginPath();
  if(c.open){x.moveTo(cx-28,by-8);x.lineTo(cx-28,by-50);x.moveTo(cx-28,by-50);x.lineTo(cx-70,by-62)}
  else{for(let i=0;i<=4;i++){x.moveTo(cx-28+i*14,by-8);x.lineTo(cx-28+i*14,by-50)}x.moveTo(cx-30,by-50);x.lineTo(cx+30,by-50)}
  x.stroke()}
function bomb(it){x.save();x.translate(it.x,it.y);x.rotate(Math.sin(it.w)*.2);
  ell(0,2,14,13,'#22222a');ell(-5,-3,4,3,'#55556a');x.strokeStyle='#8a6a3a';x.lineWidth=3;x.beginPath();x.moveTo(6,-10);x.quadraticCurveTo(14,-20,10,-24);x.stroke();
  ell(10,-25,Math.floor(it.w)%2?5:3,Math.floor(it.w)%2?5:3,'#ffb000');ell(4,0,2.2,2.2,'#fff');ell(-4,0,2.2,2.2,'#fff');
  x.strokeStyle='#fff';x.lineWidth=1.5;x.beginPath();x.arc(0,9,4,1.15*Math.PI,1.85*Math.PI);x.stroke();x.restore()}
function ufo(u){if(u.t<=6){x.globalAlpha=u.on?.32:(Math.floor(u.t*8)%2?.14:.05);x.fillStyle='#7dffb0';x.beginPath();x.moveTo(u.x-14,u.y+8);x.lineTo(u.x+14,u.y+8);x.lineTo(u.x+34,G.gy);x.lineTo(u.x-34,G.gy);x.fill();x.globalAlpha=1}
  ell(u.x,u.y-8,16,13,'#9be8c0');ell(u.x,u.y,36,11,'#8d93a6');ell(u.x,u.y-3,36,8,'#b9bfd0');
  for(let i=-2;i<=2;i++)ell(u.x+i*13,u.y+2,2.5,2.5,Math.floor(u.t*6+i)%2?'#ffe14d':'#d62828')}
const FONT='"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
const TREE=['#d9542b','#e8932c','#c23b22','#e6b93a'];

function bg(){const gy=G.gy,d=G.dist;
  const g=x.createLinearGradient(0,0,0,gy);g.addColorStop(0,'#f3b765');g.addColorStop(1,'#fbe6c0');x.fillStyle=g;x.fillRect(0,0,W,gy);
  ell(W*.78,H*.16,34,34,'#fff3c4');
  // 遠山
  x.fillStyle='#dba45c';x.beginPath();x.moveTo(0,gy);for(let i=0;i<=W;i+=12){const u=(i+d*.08)*.008;x.lineTo(i,gy-90-Math.sin(u)*26-Math.sin(u*2.3)*12)}x.lineTo(W,gy);x.fill();
  // 樹和穀倉
  const o=d*.35,P=150;for(let i=Math.floor(o/P)-1;i<(o+W)/P+1;i++){const tx=i*P-o+40,h=((i*37)%5+5)%5;
    if(((i%6)+6)%6===3){x.fillStyle='#a63a2a';x.fillRect(tx-34,gy-78,68,58);x.beginPath();x.moveTo(tx-40,gy-78);x.lineTo(tx,gy-108);x.lineTo(tx+40,gy-78);x.fill();
      x.fillStyle='#fffaf0';x.fillRect(tx-10,gy-52,20,32);continue}
    x.fillStyle='#6b3f1d';x.fillRect(tx-4,gy-60,8,44);ell(tx,gy-70-h*3,26+h*2,24+h*2,TREE[((i%4)+4)%4])}
  // 田和柵欄
  x.fillStyle='#b98838';x.fillRect(0,gy-22,W,22);
  const f=d*.7%36;x.fillStyle='#f4e3bd';x.fillRect(0,gy-22,W,3);x.fillRect(0,gy-12,W,3);for(let i=-f;i<W;i+=36)x.fillRect(i,gy-28,5,26);
  // 地面
  x.fillStyle='#c8974a';x.fillRect(0,gy,W,H-gy);x.fillStyle='#a87a35';x.fillRect(0,gy,W,4);
  const q=d%120;for(let i=-q;i<W+60;i+=120){const id=Math.round((i+d)/120);
    if(((id%3)+3)%3===0){ell(i+50,gy+34,16,12,'#e2711d');x.fillStyle='#4f7a2a';x.fillRect(i+48,gy+18,4,6)}
    else{x.fillStyle='#a87a35';x.fillRect(i+20,gy+50,26,3);x.fillRect(i+70,gy+22,18,3)}}
  // 下方手指區：深一點的泥土＋提示
  const ty=gy+70;x.fillStyle='rgba(90,60,25,.28)';x.fillRect(0,ty,W,H-ty);
  x.fillStyle='rgba(255,243,210,.55)';x.font='700 15px '+FONT;x.textAlign='center';x.textBaseline='middle';
  x.fillText('◀　手指在這裡左右滑　▶',W/2,ty+(H-ty)*.45)}

function draw(){if(!G)return;x.clearRect(0,0,W,H);x.save();if(G.shake>0)x.translate(rnd(-6,6),rnd(-6,6));bg();
  for(const l of G.leaves){x.save();x.translate(l.x,l.y);x.rotate(Math.sin(l.p));ell(0,0,5*l.s,2.5*l.s,'#c8521f');x.restore()}
  for(const c of G.cages)cage(c);
  for(const t of G.tables)cottage(t);
  // 掉下來的火雞＋地上的影子
  for(const it of G.items){const k=clamp(it.y/G.gy,0,1);x.globalAlpha=.12+.2*k;ell(it.x,G.gy+6,6+10*k,3+3*k,'#3b2416');x.globalAlpha=1;if(it.bomb)bomb(it);else turkey(it.x,it.y,1,Math.sin(it.w)*.25,it.w)}
  // 角色
  const run=G.dist*.09,bob=(G.jy>0?0:Math.abs(Math.sin(run))*-5)-G.jy,tilt=clamp(G.vx/2600,-.22,.22)+Math.sin(run)*.05,PY=G.plateY-G.jy;
  x.globalAlpha=.22;ell(G.cx,G.gy+6,G.cw*.42,6,'#3b2416');x.globalAlpha=(G.inv>0&&Math.floor(G.inv*12)%2)?.4:1;
  x.save();x.translate(G.cx,G.gy+bob);x.rotate(tilt);x.drawImage(sprite,-G.cw/2,-G.ch,G.cw,G.ch);x.restore();x.globalAlpha=1;
  // 盤子
  x.strokeStyle='#8a7a66';x.lineWidth=3;x.beginPath();x.moveTo(G.cx,PY+16);x.lineTo(G.cx,PY+2);x.stroke();
  ell(G.cx,PY,38,7,'#b9a98f');ell(G.cx,PY-2,38,7,'#fff');
  for(let i=0;i<G.n;i++){const q=pos(i);turkey(q.x,q.y,1,G.lean*.12*(i+1)/Math.max(1,G.n)*3)}
  for(const u of G.ufos)ufo(u);
  // 烏鴉
  for(const c of G.crows){
    if(c.warn>0){if(Math.floor(c.warn*10)%2){const wx=c.d>0?24:W-24;ell(wx,H*.3,16,16,'#d62828');x.fillStyle='#fff';x.font='800 22px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillText('!',wx,H*.3+1)}
      x.globalAlpha=.35;ell(c.tx,G.gy+6,22,6,'#1d1b22');x.globalAlpha=1}
    else crow(c)}
  // 特效
  for(const f of G.fx){
    if(f.k==='tk')turkey(f.x,f.y,1,f.r);
    else if(f.k==='run')turkey(f.x,f.y,-1,0,f.r);
    else if(f.k==='up'){const u=f.life;turkey(f.x+(f.u.x-f.x)*u,f.y+(f.u.y-f.y)*u,1-.5*u,u*8)}
    else if(f.k==='boom'){x.globalAlpha=clamp(f.life*3,0,1);ell(f.x,f.y,60-f.life*90,60-f.life*90,'#ffb000');ell(f.x,f.y,34-f.life*50,34-f.life*50,'#fff3c4');x.globalAlpha=1}
    else if(f.k==='fly'){if(f.life<0){turkey(f.x,f.y,1,0);continue}const u=f.life,tx=f.t.x+25,ty=G.gy-30;turkey(f.x+(tx-f.x)*u,f.y+(ty-f.y)*u-Math.sin(u*Math.PI)*50,1-.3*u,u*6)}}
  for(const f of G.fx)if(f.k==='txt'){x.globalAlpha=clamp(f.life*2,0,1);x.font=(f.big?'800 30px ':'700 16px ')+FONT;x.textAlign='center';x.textBaseline='middle';
    x.lineWidth=4;x.strokeStyle='#3b2416';x.strokeText(f.s,clamp(f.x,50,W-50),f.y);x.fillStyle=f.c;x.fillText(f.s,clamp(f.x,50,W-50),f.y);x.globalAlpha=1}
  x.restore();hud()}

function hud(){
  x.textBaseline='top';x.fillStyle='#3b2416';x.textAlign='left';x.font='800 24px '+FONT;x.fillText('客人 '+G.served+' 位',16,14);
  x.font='600 13px '+FONT;x.fillText('飛出來 '+G.total+' 隻',16,46);
  x.textAlign='right';x.font='800 24px '+FONT;for(let i=0;i<3;i++){x.fillStyle=i<G.hp?'#d62828':'rgba(59,36,22,.25)';x.fillText('♥',W-16-i*26,14)}
  x.fillStyle='#3b2416';x.font='600 13px '+FONT;x.fillText('盤子上 '+G.n+' 隻',W-16,46);
  if(G.cd>0){x.fillStyle='rgba(59,36,22,.5)';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
    x.font='800 96px '+FONT;x.fillText(Math.ceil(G.cd),W/2,H*.3);
    x.font='700 18px '+FONT;x.fillText('手指左右滑，用盤子接火雞，送回小屋',W/2,H*.46);
    x.fillStyle='#fff';x.font='600 14px '+FONT;
    x.fillText('經過小屋會自動把盤子上的火雞送進去',W/2,H*.46+38);
    x.fillText('老公雞的爆炸蛋不要接，幽浮綠光和烏鴉要閃開',W/2,H*.46+62);
    x.fillText('沒有時間限制，接到爆炸蛋扣一顆心，三顆用完結束',W/2,H*.46+86)}}

window.__catch={get G(){return G},step(dt){update(dt)},draw,pos,pad,px,jump};
