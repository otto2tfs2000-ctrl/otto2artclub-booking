<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>畫框背後｜大師開講</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 2026-10-31 藝術殿堂的展間：從 3D 大廳點雕像進來（art.html hall3d.js 用 iframe 蓋一層），按「回大廳」postMessage('closeHall')

:root{--wall:#284a4d;--wall2:rgba(22,48,54,.5);--ink:#fdfaf3;--ink2:#e2ebe9;--gold:#c9a24f;--gold2:#ffe2a0;--label:#f4eedf;--labelInk:#2f2a22;--accent:#c07a45;

*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--wall) repeat;background-size:512px 512px;color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(30,58,61,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,162,79,.18)}
.bar button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid rgba(201,162,79,.45);background:transparent;color:var(--ink);cursor:pointer}
.bar b{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.14em}
.bar i{width:92px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
/* 清單（直接開這頁、沒帶 room 時） */
.hero{margin:26px 0 18px;text-align:center}
.hero small{font-size:12px;letter-spacing:.24em;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.2em;margin:6px 0 8px}
.hero p{font-size:14px;color:var(--ink2);line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.art{position:relative;border-radius:16px;background:var(--wall2);border:1px solid rgba(201,162,79,.2);padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end}
.art b{font-family:var(--serif);font-size:20px;letter-spacing:.08em}.art span{font-size:12.5px;color:var(--ink2);margin-top:3px}
.art em{position:absolute;top:12px;right:12px;font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink2)}
.art.open{border-color:var(--gold)}.art.open em{background:var(--gold);color:#2a2112}.art:disabled{opacity:.5;cursor:default}
/* 展間入口 */
.entry{padding:34px 0 26px;text-align:center}
.entry small{font-size:12px;letter-spacing:.3em;color:var(--gold2)}
.entry,.period,.txt{text-shadow:0 1px 3px rgba(20,45,50,.55)}
.entry h1{font-family:var(--serif);font-weight:600;font-size:38px;letter-spacing:.24em;margin:8px 0 4px}
.entry .en{font-size:13px;letter-spacing:.12em;color:var(--ink2)}
.entry p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:16px auto 0;max-width:30em}
.playall{margin:20px auto 0;display:inline-flex;align-items:center;gap:10px;font:500 15px var(--sans);padding:12px 22px;border-radius:999px;border:0;background:var(--gold);color:#2a2112;cursor:pointer}

.period{display:flex;align-items:center;gap:12px;margin:34px 0 18px}
.period::before,.period::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,226,160,.7),transparent)}
.period div{text-align:center}.period span{display:block;font-size:12px;letter-spacing:.2em;color:var(--gold2)}
.period b{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.12em}
/* 展牆：畫打燈、下面小標籤 */
.wallp{position:relative;padding:28px 0 22px;margin:0 -16px;background:radial-gradient(ellipse 70% 55% at 50% 38%,rgba(255,236,190,.22),transparent 70%)}
.frame{display:block;margin:0 auto;width:calc(100% - 40px);max-width:560px;padding:10px;background:linear-gradient(135deg,#b48c45,#e2c27a 40%,#9c7432 70%,#d9b768);border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4) inset;cursor:zoom-in;border:0}
.frame img{display:block;width:100%;height:auto;background:#3a332b;box-shadow:0 0 0 2px #2b2116 inset}
.lab{margin:18px auto 0;width:calc(100% - 40px);max-width:400px;background:var(--label);color:var(--labelInk);border-radius:4px;padding:12px 16px;box-shadow:0 6px 16px rgba(0,0,0,.35)}

.ep .pb{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#2a2112;display:grid;place-items:center;font-size:16px}

.ep.soon{cursor:default;opacity:.6}.ep.soon .pb{background:rgba(255,255,255,.12);color:var(--ink2)}
.ep.on{border-color:var(--gold);background:rgba(40,36,24,.7)}
.txt{font-size:15px;line-height:1.9;margin-top:14px}
.tip{margin-top:14px;padding:12px 14px;border-left:3px solid var(--gold);background:rgba(22,48,54,.45);border-radius:0 10px 10px 0;font-size:14px;line-height:1.75}
.tip b{color:var(--gold2);font-weight:500}

.ghost b{display:block;color:var(--ink);font-family:var(--serif);font-size:16px;margin-bottom:4px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(24,48,51,.97);border-top:1px solid rgba(201,162,79,.3);transform:translateY(110%);transition:transform .3s ease}
.dock.show{transform:none}
.dock .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px}
.dock button{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#2a2112;font-size:16px;cursor:pointer}
.dock .st{flex:1;min-width:0}.dock .st b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .pg{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin:9px 0 6px;cursor:pointer;touch-action:none}
/* 2026-10-31 大熊：不能拖、不能快轉 → 進度條上下各多 14px 好按、加圓點可以拖，加倒退／快轉 15 秒 */
.dock .pg::before{content:"";position:absolute;left:-6px;right:-6px;top:-14px;bottom:-14px}
.dock .pg u{position:absolute;top:50%;left:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.dock button.sk{width:38px;height:38px;background:transparent;color:var(--ink);border:1px solid rgba(201,162,79,.45);font-size:11.5px;font-weight:600;letter-spacing:-.3px}
.dock .pg i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--gold)}
.dock .tm{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
/* 全螢幕看畫 */
.zoom{position:fixed;inset:0;z-index:20;background:#0d0c0b;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%}
.zoom.big{display:block}.zoom.big img{max-width:none;max-height:none;width:260%}
.zoom p{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));text-align:center;font-size:12.5px;color:#9b917f;pointer-events:none}
.credit{margin:30px 0 10px;font-size:11.5px;color:#d6e3e1;text-align:center;line-height:1.7}
[hidden]{display:none!important}
</style></head><body>

<script>
const ARTISTS=[
  {id:'vangogh',n:'梵谷',sub:'後印象派・荷蘭',open:true},

   audio 還沒做好的集數顯示「即將推出」；img 還沒放的畫顯示「展牆準備中」。guide＝最早那段 8 分鐘總導覽 */
const ROOMS={vangogh:{n:'梵谷',en:'Vincent van Gogh・1853–1890',
  intro:'27 歲才拿起畫筆，只畫了十年，卻留下兩千多件作品。沿著這面牆，從荷蘭灰暗的農舍，一路走到南法的陽光、療養院窗外的星空。',
  guide:{src:'../artist-audio/vangogh.m4a',t:'總導覽：重塑梵谷，天才非瘋狂',dur:'8:05'},
  periods:[
   {yr:'1880–1885',n:'荷蘭・從灰暗開始',works:[

      txt:'油燈下，五個農民圍著桌子吃馬鈴薯。梵谷刻意用沾著泥土般的顏色、不美化任何一張臉，他想畫的是用挖土的那雙手，誠實賺來的一餐。這是他 27 歲當畫家後，第一幅真正有野心的作品。',
      tip:'看看油燈的光落在誰的臉上。整幅畫唯一明亮的地方，就在燈下。'}]},
   {yr:'1886–1888',n:'巴黎・顏色亮起來',works:[

      txt:'在巴黎的兩年，他畫了二十多幅自畫像。請不起模特兒，鏡子裡的自己最便宜，也最適合拿來做實驗。看到印象派和點描派之後，灰暗的顏色不見了，換成一條一條並排的藍、橘、綠。',
      tip:'看看他臉旁邊的背景，筆觸像放射線一樣圍著頭轉。跟《吃馬鈴薯的人》比，只隔了兩年。'}]},
   {yr:'1888–1889',n:'阿爾・南法的陽光',works:[

      txt:'自願住進療養院後，他常在天亮前看著窗外的星空。療養院不讓他在臥室作畫，這幅畫是白天憑記憶和想像畫的。畫裡的小村莊和教堂尖塔，從他的窗戶其實看不到，是他加進去的。',

      txt:'在奧維的七十天裡，他畫了大約七十幅畫。很多人說這是他的「最後一幅畫」，其實沒有確切證據，之後他還畫了其他作品。他在信裡說，想用陰沉天空下的麥田表達悲傷和孤獨，但也想畫出鄉間讓人重新有力量的那一面。',

/* 大熊：背景不要黑，要藍綠色、有筆觸 → 畫一張梵谷式短筆觸的貼圖鋪滿（顏色只差一點點，字才看得清楚） */
(function(){const S=512,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');x.fillStyle='#284a4d';x.fillRect(0,0,S,S);   // 大熊：亮色卡那版太亂 → 回到偏暗的藍綠，只比第一版亮一點；筆觸顏色貼近底色，不搶畫
  const C=['#2c5054','#244549','#2f5458','#264a50','#2a4d50','#305659'];x.lineCap='round';let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<1700;i++){const px=r()*S,py=r()*S,a=Math.sin(px*.012+py*.004)*1.6+Math.cos(py*.011)*1.1,L=14+r()*18;   // 筆觸方向跟著一個緩緩旋轉的流場，像星夜的天空
    for(const [dx,dy] of [[0,0],[S,0],[-S,0],[0,S],[0,-S]]){x.strokeStyle=C[i%C.length];x.globalAlpha=.45+r()*.3;x.lineWidth=4+r()*4;x.beginPath();
      x.moveTo(px+dx,py+dy);x.quadraticCurveTo(px+dx+Math.cos(a)*L*.5+Math.cos(a+1.57)*3,py+dy+Math.sin(a)*L*.5+Math.sin(a+1.57)*3,px+dx+Math.cos(a)*L,py+dy+Math.sin(a)*L);x.stroke()}}
  x.globalAlpha=1;try{document.documentElement.style.backgroundImage=document.body.style.backgroundImage='url('+c.toDataURL('image/jpeg',.82)+')'}catch(e){}})();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const mmss=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
/* 播放：全頁共用一個 Audio；底部播放條常駐；播完自動接下一集（只接有音檔的）。鎖定畫面顯示集數＋畫（Media Session） */
const au=new Audio();au.preload='none';let list=[],cur=-1;
function playIdx(i){const it=list[i];if(!it)return;cur=i;if(au.dataset.src!==it.src){au.src=it.src;au.dataset.src=it.src}
  const p=au.play();if(p&&p.catch)p.catch(()=>{});$('dock').classList.add('show');$('dT').textContent=it.label;
  document.querySelectorAll('.ep').forEach(b=>b.classList.toggle('on',b.dataset.i==String(i)));
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:it.label,artist:'畫框背後・大師開講',album:'梵谷',artwork:it.img?[{src:new URL(it.img,location.href).href,sizes:'512x512',type:'image/jpeg'}]:[]});
    navigator.mediaSession.setActionHandler('nexttrack',()=>playIdx(cur+1<list.length?cur+1:cur));navigator.mediaSession.setActionHandler('previoustrack',()=>playIdx(Math.max(0,cur-1)))}catch(e){}}}
function lookDock(){const d=au.duration||0;$('dB').textContent=au.paused?'▶':'❚❚';const pc=d?(au.currentTime/d*100)+'%':'0';$('dFill').style.width=pc;$('dKnob').style.left=pc;$('dTm').textContent=d?mmss(au.currentTime)+' / '+mmss(d):'載入中…';
  $('dN').disabled=cur>=list.length-1;$('dN').style.opacity=cur>=list.length-1?.35:1;
  document.querySelectorAll('.ep').forEach(b=>{const on=b.dataset.i==String(cur)&&!au.paused;const pb=b.querySelector('.pb');if(pb&&!b.classList.contains('soon'))pb.textContent=on?'❚❚':'▶'})}
au.ontimeupdate=au.onloadedmetadata=lookDock;au.onplay=()=>{post({hallAudio:1});lookDock()};au.onpause=()=>{post({hallAudio:0});lookDock()};
au.onended=()=>{if(cur+1<list.length)playIdx(cur+1);else{post({hallAudio:0});lookDock()}};au.onerror=()=>{$('dTm').textContent='語音載入失敗，請稍後再試'};
$('dB').onclick=()=>{if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{})}else au.pause()};$('dN').onclick=()=>playIdx(cur+1);
let seeking=false;const seekX=x=>{const d=au.duration;if(!d)return;const r=$('dPg').getBoundingClientRect();au.currentTime=Math.min(1,Math.max(0,(x-r.left)/r.width))*d;lookDock()};
$('dPg').onpointerdown=e=>{seeking=true;try{$('dPg').setPointerCapture(e.pointerId)}catch(_){}seekX(e.clientX)};
$('dPg').onpointermove=e=>{if(seeking)seekX(e.clientX)};$('dPg').onpointerup=$('dPg').onpointercancel=()=>{seeking=false};
const skip=t=>{const d=au.duration;if(!d)return;au.currentTime=Math.min(d-.5,Math.max(0,au.currentTime+t));lookDock()};
$('dRw').onclick=()=>skip(-15);$('dFf').onclick=()=>skip(15);
if('mediaSession' in navigator){try{navigator.mediaSession.setActionHandler('seekbackward',()=>skip(-15));navigator.mediaSession.setActionHandler('seekforward',()=>skip(15));navigator.mediaSession.setActionHandler('seekto',e=>{if(au.duration)au.currentTime=e.seekTime})}catch(e){}}
function stopAudio(){au.pause();post({hallAudio:0})}
/* 全螢幕看畫：點一下開、點兩下放大、再點一下關 */
let zt=0;$('zoom').onclick=()=>{const now=Date.now();if(now-zt<300){$('zoom').classList.toggle('big');zt=0;return}zt=now;setTimeout(()=>{if(zt&&Date.now()-zt>=290){$('zoom').hidden=true;$('zoom').classList.remove('big')}},300)};
function openZoom(src,alt){$('zImg').src=src;$('zImg').alt=alt;$('zoom').hidden=false}
function home(){stopAudio();$('room').hidden=true;$('home').hidden=false;$('barT').textContent='畫框背後';scrollTo(0,0)}
$('grid').innerHTML=ARTISTS.map(a=>`<button type="button" class="art${a.open?' open':''}" data-id="${a.id}"${a.open?'':' disabled'}><em>${a.open?'開放中':'籌備中'}</em><b>${esc(a.n)}</b><span>${esc(a.sub)}</span></button>`).join('');
$('grid').querySelectorAll('.art.open').forEach(b=>b.onclick=()=>openRoom(b.dataset.id));
function openRoom(id){const R=ROOMS[id];if(!R)return;$('home').hidden=true;$('barT').textContent=R.n;list=[];
  if(R.guide)list.push({src:R.guide.src,label:R.guide.t,img:null});
  const ep=w=>{if(!w.audio)return`<div class="ep soon"><div class="pb">🎧</div><div><b>${esc(w.ep)}　${esc(w.t)}</b><span>語音即將推出</span></div></div>`;
    const i=list.push({src:w.audio,label:`${w.ep} ${w.et||w.t}`,img:w.img})-1;return`<button type="button" class="ep" data-i="${i}"><div class="pb">▶</div><div><b>${esc(w.ep)}　${esc(w.et||w.t)}</b><span>🎧 聽這一集${w.dur?'・'+esc(w.dur):''}</span></div></button>`};   // et＝筆記本那一集的標題
  const wall=w=>w.img?`<div class="wallp"><button type="button" class="frame" data-z="${esc(w.img)}" aria-label="放大看《${esc(w.t)}》"><img src="${esc(w.img)}" alt="《${esc(w.t)}》" loading="lazy"></button>
      <div class="lab"><b>《${esc(w.t)}》</b><div class="o">${esc(w.o||'')}</div><div class="m">${w.meta||''}</div></div></div>
      ${ep(w)}${w.txt?`<p class="txt">${esc(w.txt)}</p>`:''}${w.tip?`<div class="tip"><b>👀 觀察小提示</b>　${esc(w.tip)}</div>`:''}`
    :`<div class="ghost"><b>《${esc(w.t)}》</b>展牆準備中・真跡與語音即將推出</div>`;
  $('room').innerHTML=`<div class="entry"><small>畫框背後 ・ 大師開講</small><h1>${esc(R.n)}</h1><div class="en">${esc(R.en)}</div><p>${esc(R.intro)}</p>
      ${R.guide?`<button type="button" class="playall" id="pAll">▶ 先聽總導覽・${esc(R.guide.dur)}</button>`:''}
</div>
    ${R.periods.map(p=>`<div class="period"><div><span>${esc(p.yr)}</span><b>${esc(p.n)}</b></div></div>${p.works.map(wall).join('')}`).join('')}
    <p class="credit">${esc(R.credit)}<br>語音由 OTTO2 以 Google Gemini Notebook 製作</p>`;
  $('room').hidden=false;scrollTo(0,0);
  if($('pAll'))$('pAll').onclick=()=>playIdx(0);
  $('room').querySelectorAll('.ep[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(cur===i&&!au.paused)au.pause();else if(cur===i)au.play();else playIdx(i)});
  $('room').querySelectorAll('.frame').forEach(b=>b.onclick=()=>openZoom(b.dataset.z,b.querySelector('img').alt))}
/* 從 3D 大廳點藝術家進來（網址帶 room）：返回就直接回大廳，不經過清單 */
const q=new URLSearchParams(location.search).get('room');
$('back').onclick=()=>{if(!$('room').hidden&&!q)return home();stopAudio();if(window===top){location.href='../art.html?hall=1';return}post('closeHall')};   // 在手機瀏覽器單獨打開時，回到大廳
if(q){openRoom(q);$('back').textContent='← 回大廳'}
</script></body></html>
