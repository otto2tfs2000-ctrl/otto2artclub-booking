<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>藝術殿堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* 2026-10-31 藝術殿堂裡面：從作品小屋的萬神殿進來（art.html openHallPage 用 iframe 蓋一層），按「回作品小屋」postMessage('closeHall') */
:root{--ink:#2f3a34;--ink2:#5d6a62;--line:rgba(47,58,52,.14);--accent:#b06f42;--bg:#efe7d8;--card:#fbf7ef;
  --serif:"Noto Serif TC","Songti TC",serif;--sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(239,231,216,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1.5px solid #d6c7a9;background:var(--card);color:var(--ink);cursor:pointer}
.bar b{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.12em}
.bar i{width:92px}
.hero{margin:22px 0 18px;text-align:center}
.hero small{font-size:12px;letter-spacing:.24em;color:var(--accent)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.2em;margin:6px 0 8px}
.hero p{font-size:14px;color:var(--ink2);line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.art{position:relative;border-radius:18px;background:var(--card);border:1px solid var(--line);padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:flex-end}
.art b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.08em}
.art span{font-size:12.5px;color:var(--ink2);margin-top:3px}
.art em{position:absolute;top:12px;right:12px;font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:999px;background:#ece3d2;color:var(--ink2)}
.art.open{background:linear-gradient(160deg,#25365e 0%,#2f4a86 55%,#c9a24a 140%);color:#fff;border:0}
.art.open span{color:rgba(255,255,255,.85)}.art.open em{background:#f2c14e;color:#3a2c10}
.art:disabled{cursor:default;opacity:.62}
/* 藝術家展間 */
.room-hero{margin:18px 0 14px;border-radius:22px;padding:22px 18px;color:#fff;background:radial-gradient(circle at 78% 22%,#f6d76b 0 5%,transparent 6%),radial-gradient(circle at 30% 30%,rgba(246,215,107,.6) 0 3%,transparent 4%),linear-gradient(160deg,#1f2f57,#2f4a86 60%,#3d5a8f)}
.room-hero h2{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:.12em}
.room-hero p{font-size:13.5px;opacity:.9;margin-top:4px;line-height:1.6}
.player{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.player button{flex:none;width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:18px;cursor:pointer}
.player .st{flex:1;min-width:0}.player b{display:block;font-size:14.5px;font-weight:500}
.player .bar2{position:relative;height:6px;border-radius:3px;background:rgba(47,58,52,.14);margin:8px 0 5px;cursor:pointer;touch-action:none}
.player .bar2 i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--accent)}
.player .tm{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
h3{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.1em;margin:26px 0 10px}
.tl{list-style:none;padding:0;border-left:2px solid #d9c9a8;margin-left:8px}
.tl li{position:relative;padding:0 0 18px 18px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl .yr{font-size:12px;color:var(--accent);letter-spacing:.06em}
.tl b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:600;margin:2px 0 4px}
.tl p{font-size:14px;line-height:1.75;color:var(--ink)}
.tl .w{font-size:12.5px;color:var(--ink2);margin-top:4px}
.soon{margin-top:8px;padding:14px;border-radius:16px;border:1.5px dashed #cdbb98;color:var(--ink2);font-size:13.5px;line-height:1.7;text-align:center}
[hidden]{display:none!important}
</style></head><body>
<div class="bar"><button type="button" id="back">← 回作品小屋</button><b id="barT">藝術殿堂</b><i></i></div>
<div class="wrap">
  <section id="home">
    <div class="hero"><small>OTTO2 ・ 15 週年</small><h1>藝術殿堂</h1><p>聽藝術家的故事、走過他們的一生。<br>從梵谷開始，之後一位一位開放。</p></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="room" hidden></section>
</div>
<script>
const ARTISTS=[
  {id:'vangogh',n:'梵谷',sub:'後印象派・荷蘭',open:true},
  {id:'picasso',n:'畢卡索',sub:'立體派・西班牙'},{id:'monet',n:'莫內',sub:'印象派・法國'},
  {id:'klimt',n:'克林姆',sub:'維也納分離派・奧地利'},{id:'dali',n:'達利',sub:'超現實主義・西班牙'},{id:'kahlo',n:'卡蘿',sub:'墨西哥'}];
/* 展間內容：語音是大熊 Gemini Notebook「重塑梵谷：天才非瘋狂」的語音摘要（壓成單聲道放 ../artist-audio/） */
const ROOMS={vangogh:{n:'梵谷',full:'文森・梵谷 Vincent van Gogh',life:'1853–1890・荷蘭',
  audio:{src:'../artist-audio/vangogh.m4a',t:'重塑梵谷：天才非瘋狂'},
  tl:[
   {yr:'1880–1885',n:'荷蘭：從灰暗開始',p:'27 歲才決定當畫家，畫農民、礦工和織布工人，顏色又暗又沉，想畫出勞動者真實的生活。',w:'代表作《吃馬鈴薯的人》'},
   {yr:'1886–1888',n:'巴黎：顏色亮起來',p:'搬去跟弟弟西奧住，看到印象派和點描派，也迷上日本浮世繪，調色盤一下子變得明亮。',w:'代表作 自畫像系列、《唐基老爹》'},
   {yr:'1888–1889',n:'阿爾：南法的陽光',p:'為了陽光搬到南法，畫向日葵、黃色房子、夜間咖啡館；高更來同住兩個月，最後以割耳事件收場。',w:'代表作《向日葵》《夜間咖啡館》'},
   {yr:'1889–1890',n:'聖雷米：療養院的窗',p:'自願住進療養院，一年裡畫了大約一百五十件作品，旋轉的夜空就是在這裡畫的。',w:'代表作《星夜》《鳶尾花》'},
   {yr:'1890',n:'奧維：最後的七十天',p:'搬到巴黎近郊，七十天裡畫了大約七十幅畫。7 月過世，只有 37 歲。',w:'代表作《麥田群鴉》《奧維的教堂》'}]}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=m=>{try{parent.postMessage(m,'*')}catch(e){}};
let au=null;
function stopAudio(){if(au){au.pause()}post({hallAudio:0})}
function home(){stopAudio();$('room').hidden=true;$('home').hidden=false;$('barT').textContent='藝術殿堂';scrollTo(0,0)}
$('grid').innerHTML=ARTISTS.map(a=>`<button type="button" class="art${a.open?' open':''}" data-id="${a.id}"${a.open?'':' disabled'}><em>${a.open?'開放中':'籌備中'}</em><b>${esc(a.n)}</b><span>${esc(a.sub)}</span></button>`).join('');
$('grid').querySelectorAll('.art.open').forEach(b=>b.onclick=()=>openRoom(b.dataset.id));
const mmss=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function openRoom(id){const R=ROOMS[id];if(!R)return;$('home').hidden=true;$('barT').textContent=R.n;
  $('room').innerHTML=`<div class="room-hero"><h2>${esc(R.n)}</h2><p>${esc(R.full)}<br>${esc(R.life)}</p></div>
    ${R.audio?`<div class="player"><button type="button" id="pB" aria-label="播放">▶</button><div class="st"><b>🎧 ${esc(R.audio.t)}</b><div class="bar2" id="pBar"><i id="pFill"></i></div><div class="tm" id="pTm">語音導覽・約 8 分鐘</div></div></div>`:''}
    <h3>五個展間・他的一生</h3><ol class="tl">${R.tl.map(t=>`<li><div class="yr">${esc(t.yr)}</div><b>${esc(t.n)}</b><p>${esc(t.p)}</p><div class="w">${esc(t.w)}</div></li>`).join('')}</ol>
    <div class="soon">每個展間的影片、真跡大圖、迷思破解，陸續加入中</div>`;
  $('room').hidden=false;scrollTo(0,0);
  if(R.audio){if(!au||au.dataset.id!==id){if(au)au.pause();au=new Audio(R.audio.src);au.preload='none';au.dataset.id=id}
    const btn=$('pB'),fill=$('pFill'),tm=$('pTm');
    const look=()=>{const d=au.duration||0;btn.textContent=au.paused?'▶':'❚❚';btn.setAttribute('aria-label',au.paused?'播放':'暫停');fill.style.width=d?(au.currentTime/d*100)+'%':'0';if(d&&(au.currentTime>0||!au.paused))tm.textContent=mmss(au.currentTime)+' / '+mmss(d)};
    au.ontimeupdate=au.onloadedmetadata=look;au.onplay=()=>{post({hallAudio:1});look()};au.onpause=()=>{post({hallAudio:0});look()};
    au.onended=()=>{post({hallAudio:0});au.currentTime=0;look()};au.onerror=()=>{post({hallAudio:0});tm.textContent='語音載入失敗，請稍後再試'};
    btn.onclick=()=>{if(au.paused){const p=au.play();if(p&&p.catch)p.catch(()=>{})}else au.pause()};
    $('pBar').onpointerdown=e=>{const d=au.duration;if(!d)return;const r=$('pBar').getBoundingClientRect();au.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*d;look()};look()}}
/* 從 3D 大廳點藝術家進來（網址帶 room）：返回就直接回大廳，不經過清單 */
const q=new URLSearchParams(location.search).get('room');
$('back').onclick=()=>{if(!$('room').hidden&&!q)return home();stopAudio();post('closeHall')};
if(q){openRoom(q);$('back').textContent='← 回大廳'}
</script></body></html>
