<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>畫框背後｜大師開講</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* 2026-10-31 藝術殿堂的展間：從 3D 大廳點雕像進來（art.html hall3d.js 用 iframe 蓋一層），按「回大廳」postMessage('closeHall')
   第二版（大熊選「展牆式」）：深色展牆＋真跡大圖（打燈）＋美術館小標籤＋每幅畫一集語音＋觀察小提示；底部常駐播放條，往下滑聲音不斷 */
:root{--wall:#284a4d;--pn:22,48,54;--sh:14,26,28;--bar:30,58,61;--wall2:rgba(var(--pn),.5);--ink:#fdfaf3;--ink2:#e2ebe9;--gold:#c9a24f;--gold2:#ffe2a0;--label:#f4eedf;--labelInk:#2f2a22;--accent:#c07a45;
  --serif:"Noto Serif TC","Songti TC",serif;--sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--wall) repeat;background-size:512px 512px;color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(var(--bar),.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(201,162,79,.18)}
.bar button{font:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid rgba(201,162,79,.45);background:transparent;color:var(--ink);cursor:pointer}
.bar b{flex:1;text-align:center;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.14em}
.bar i{width:92px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
/* 清單（直接開這頁、沒帶 room 時） */
.hero{margin:26px 0 18px;text-align:center}
.hero small{font-size:12px;letter-spacing:.24em;color:var(--gold)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.2em;margin:6px 0 8px}
.hero p{font-size:14px;color:var(--ink2);line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.art{position:relative;border-radius:16px;background:var(--wall2);border:1px solid rgba(201,162,79,.2);padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end}
.art b{font-family:var(--serif);font-size:20px;letter-spacing:.08em}.art span{font-size:12.5px;color:var(--ink2);margin-top:3px}
.art em{position:absolute;top:12px;right:12px;font-style:normal;font-size:11.5px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink2)}
.art.open{border-color:var(--gold)}.art.open em{background:var(--gold);color:#2a2112}.art:disabled{opacity:.5;cursor:default}
/* 展間入口 */
.entry{padding:34px 0 26px;text-align:center}
.entry small{font-size:12px;letter-spacing:.3em;color:var(--gold2)}
.entry,.period,.txt{text-shadow:0 1px 3px rgba(var(--sh),.55)}
.entry h1{font-family:var(--serif);font-weight:600;font-size:38px;letter-spacing:.24em;margin:8px 0 4px}
.entry .en{font-size:13px;letter-spacing:.12em;color:var(--ink2)}
.entry p{font-size:14.5px;line-height:1.85;color:var(--ink);margin:16px auto 0;max-width:30em}
/* 2026-11-01 大熊：展間先看卡片總覽（一面牆一幅畫），點卡片翻到那一站，左右滑換站；舊的收合「講堂大綱」拿掉 */
.ovh{padding:30px 2px 18px;text-shadow:0 1px 3px rgba(var(--sh),.55)}
.ovh small{font-size:12.5px;letter-spacing:.32em;color:var(--gold2)}
.ovh h1{font-family:var(--serif);font-weight:600;font-size:31px;line-height:1.35;letter-spacing:.04em;margin:10px 0 8px}.ovh h1 span{color:#e3c27a}
.ovh p{font-size:13px;color:var(--ink2)}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;width:100%;border:0;padding:12px 13px;border-radius:12px;overflow:hidden;background:rgb(var(--bar)) center/cover no-repeat;color:#fff;font:inherit;text-align:left;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28)}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--sh),0) 25%,rgba(var(--sh),.82))}
.card>*{position:relative}
.card em{font-style:normal;font-size:11px;letter-spacing:.08em;color:var(--gold2)}
.card b{font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.35;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.card i{position:absolute;top:9px;right:9px;font-style:normal;font-size:10.5px;padding:2px 7px;border-radius:999px;background:rgba(var(--sh),.6);color:var(--ink2)}
.card.on{box-shadow:0 0 0 2px var(--gold2),0 6px 16px rgba(0,0,0,.28)}
.gcard{aspect-ratio:2.1/1;margin-bottom:12px;padding:16px;background-position:50% 30%}
.gcard em{font-size:12px}.gcard b{font-size:21px}.gcard span{font-size:12.5px;color:var(--ink2);margin-top:4px}
.gcard u{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#2a2112;display:grid;place-items:center;font-size:19px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cards .card{aspect-ratio:3/2}
.sph{margin:22px 0 10px;font-size:13px;letter-spacing:.14em;color:var(--gold2)}
.cards.sp{grid-template-columns:repeat(3,1fr);gap:8px}.cards.sp .card{aspect-ratio:auto;min-height:92px;padding:10px;background:rgba(var(--pn),.6);border:1px solid rgba(201,162,79,.35);box-shadow:none}
.cards.sp .card::before{display:none}.cards.sp .card b{font-size:13.5px}
.card.lock{filter:grayscale(.75) brightness(.62)}.card.lock i{background:none;font-size:14px;padding:0}
.lockt{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;padding:10px 18px;border-radius:999px;background:rgba(var(--sh),.92);border:1px solid rgba(201,162,79,.5);color:var(--ink);font-size:14px;white-space:nowrap}
/* 一站一頁 */
.pgr{display:flex;align-items:center;gap:8px;padding:14px 0 0}
.pgr button{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(201,162,79,.45);background:rgba(var(--pn),.5);color:var(--ink);font-size:17px;cursor:pointer}.pgr button:disabled{opacity:.3}
.pgr div{flex:1;text-align:center}.pgr b{display:block;font-size:12.5px;font-weight:500;color:var(--gold2);letter-spacing:.06em}
.dots{display:flex;justify-content:center;gap:5px;margin-top:6px}.dots s{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)}.dots s.on{background:var(--gold2);width:16px;border-radius:3px}
.stp.in-l{animation:inL .32s ease}.stp.in-r{animation:inR .32s ease}
@keyframes inL{from{opacity:0;transform:translateX(36px)}}@keyframes inR{from{opacity:0;transform:translateX(-36px)}}
.nxt{display:flex;align-items:center;gap:12px;width:100%;margin:26px 0 6px;padding:12px;border-radius:14px;border:1px solid rgba(201,162,79,.45);background:rgba(var(--pn),.55);color:inherit;font:inherit;text-align:left;cursor:pointer}
.nxt img{flex:none;width:64px;height:48px;object-fit:cover;border-radius:8px}.nxt div{flex:1}.nxt small{font-size:11.5px;color:var(--gold2)}.nxt b{display:block;font-family:var(--serif);font-size:16px}.nxt i{font-style:normal;font-size:20px;color:var(--gold2)}
.bar .ovb{width:92px;padding:8px 0}
.goon{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:9;max-width:588px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:0;background:var(--gold);color:#2a2112;font:500 14.5px var(--sans);text-align:left;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.45);animation:inR .3s ease}
.goon span{flex:1}
/* 時期分隔 */
.period{display:flex;align-items:center;gap:12px;margin:34px 0 18px}
.period::before,.period::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,226,160,.7),transparent)}
.period div{text-align:center}.period span{display:block;font-size:12px;letter-spacing:.2em;color:var(--gold2)}
.period b{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.12em}
/* 展牆：畫打燈、下面小標籤 */
.wallp{position:relative;padding:28px 0 22px;margin:0 -16px;background:radial-gradient(ellipse 70% 55% at 50% 38%,rgba(255,236,190,.22),transparent 70%)}
.frame{display:block;margin:0 auto;width:calc(100% - 40px);max-width:560px;padding:10px;background:linear-gradient(135deg,#b48c45,#e2c27a 40%,#9c7432 70%,#d9b768);border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4) inset;cursor:zoom-in;border:0}
.frame img{display:block;width:100%;height:auto;background:#3a332b;box-shadow:0 0 0 2px #2b2116 inset}
.lab{margin:18px auto 0;width:calc(100% - 40px);max-width:400px;background:var(--label);color:var(--labelInk);border-radius:4px;padding:12px 16px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.lab b{display:block;font-family:var(--serif);font-size:18px;font-weight:600}
.lab .o{font-size:12.5px;font-style:italic;color:#6d6252;margin-top:1px}
.lab .m{font-size:12.5px;color:#4d4436;margin-top:6px;line-height:1.6}
.ep{display:flex;align-items:center;gap:12px;margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--wall2);border:1px solid rgba(201,162,79,.25);width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ep .pb{flex:none;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#2a2112;display:grid;place-items:center;font-size:16px}
.ep b{display:block;font-size:14.5px;font-weight:500}.ep span{font-size:12.5px;color:var(--ink2)}
.ep.soon{cursor:default;opacity:.6}.ep.soon .pb{background:rgba(255,255,255,.12);color:var(--ink2)}
.ep.on{border-color:var(--gold);background:rgba(40,36,24,.7)}
.txt{font-size:15px;line-height:1.9;margin-top:14px}
.tip{margin-top:14px;padding:12px 14px;border-left:3px solid var(--gold);background:rgba(var(--pn),.45);border-radius:0 10px 10px 0;font-size:14px;line-height:1.75}
.tip b{color:var(--gold2);font-weight:500}
.pair{display:flex;gap:10px;align-items:flex-start;padding:24px 0 6px;margin:0 -6px}
.pair figure{flex:1;min-width:0;margin:0}
.pair .frame{width:100%;padding:6px}
.pair figcaption{margin-top:9px;font-size:12px;line-height:1.55;color:var(--ink2);text-align:center}
.pair figcaption b{display:block;color:var(--ink);font-family:var(--serif);font-size:14px;font-weight:600}
.pair figcaption em{display:inline-block;font-style:normal;font-size:10.5px;letter-spacing:1px;color:#2a2112;background:var(--gold2);border-radius:8px;padding:0 7px;margin-bottom:4px}
.pairh{font-family:var(--serif);font-size:17px;text-align:center;margin-top:26px;color:var(--gold2)}
.spc{margin:14px 0 0;padding:16px;border:1px solid rgba(201,162,79,.3);border-radius:14px;background:rgba(var(--pn),.35)}
.spc>b{display:block;font-family:var(--serif);font-size:17px}
.spc .txt{font-size:14px;line-height:1.8;margin-top:8px}
.ghost{margin:6px 0 0;padding:16px;border:1px dashed rgba(201,162,79,.3);border-radius:14px;color:var(--ink2);font-size:13.5px;line-height:1.75;text-align:center}
.ghost b{display:block;color:var(--ink);font-family:var(--serif);font-size:16px;margin-bottom:4px}
/* 底部常駐播放條 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(var(--bar),.97);border-top:1px solid rgba(201,162,79,.3);transform:translateY(110%);transition:transform .3s ease}
.dock.show{transform:none}
.dock .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px}
.dock button{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#2a2112;font-size:16px;cursor:pointer}
.dock .st{flex:1;min-width:0}.dock .st b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .pg{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin:9px 0 6px;cursor:pointer;touch-action:none}
/* 2026-10-31 大熊：不能拖、不能快轉 → 進度條上下各多 14px 好按、加圓點可以拖，加倒退／快轉 15 秒 */
.dock .pg::before{content:"";position:absolute;left:-6px;right:-6px;top:-14px;bottom:-14px}
.dock .pg u{position:absolute;top:50%;left:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.dock button.sk{width:38px;height:38px;background:transparent;color:var(--ink);border:1px solid rgba(201,162,79,.45);font-size:11.5px;font-weight:600;letter-spacing:-.3px}
.dock .pg i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--gold)}
.dock .tm{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
/* 全螢幕看畫 */
.zoom{position:fixed;inset:0;z-index:20;background:#0d0c0b;overflow:auto;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.zoom img{max-width:100%;max-height:100%}
.zoom.big{display:block}.zoom.big img{max-width:none;max-height:none;width:260%}
.zoom .zbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(transparent,#0d0c0b 30%);pointer-events:none}
.zoom .zbar p{font-size:16px;line-height:1.4;color:#e8dfcd;margin-bottom:10px}
.zoom .zbar button{pointer-events:auto;min-height:44px;padding:0 26px;border-radius:999px;border:1px solid #c9a24f;background:#c9a24f;color:#1a1612;font:600 16px/1 inherit;font-family:inherit;cursor:pointer}
.credit{margin:30px 0 10px;font-size:11.5px;color:var(--ink2);text-align:center;line-height:1.7}
[hidden]{display:none!important}
</style></head><body>
<div class="bar"><button type="button" id="back">← 回作品小屋</button><b id="barT">畫框背後</b><i id="barR"></i><button type="button" class="ovb" id="ovB" hidden>☰ 總覽</button></div>
<button type="button" class="goon" id="goon" hidden></button>
<div class="lockt" id="lockT" hidden>🔒 這一集會員才能聽</div>
<div class="wrap">
  <section id="home">
    <div class="hero"><small>OTTO2 ・ 大師開講</small><h1>畫框背後</h1><p>聽藝術家說自己的故事、走過他們的一生。<br>從梵谷開始，之後一位一位開講。</p></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="room" hidden></section>
</div>
<div class="dock" id="dock"><div class="in"><button type="button" class="sk" id="dRw" aria-label="倒退 15 秒">↺15</button><button type="button" id="dB" aria-label="播放">▶</button><button type="button" class="sk" id="dFf" aria-label="快轉 15 秒">15↻</button><div class="st"><b id="dT"></b><div class="pg" id="dPg"><i id="dFill"></i><u id="dKnob"></u></div><div class="tm" id="dTm"></div></div><button type="button" id="dN" aria-label="下一集" style="background:transparent;color:var(--ink);border:1px solid rgba(201,162,79,.45)">⏭</button></div></div>
<div class="zoom" id="zoom" hidden><img id="zImg" alt=""><div class="zbar"><p>點兩下放大看筆觸・點一下關閉</p><button type="button" id="zBack">‹ 回講堂</button></div></div>
<script>
const ARTISTS=[
  {id:'vangogh',n:'梵谷',sub:'後印象派・荷蘭',open:true},
  /* 2026-11-01 大熊：只排畫作已是公有領域、可以放真跡圖片的（過世滿 70 年）；畢卡索、達利、卡蘿等國際上還有版權，先不排 */
  {id:'monet',n:'莫內',sub:'印象派・法國',open:true},{id:'klimt',n:'克林姆',sub:'維也納分離派・奧地利'},
  {id:'rembrandt',n:'林布蘭',sub:'巴洛克・荷蘭'},{id:'davinci',n:'達文西',sub:'文藝復興・義大利'},{id:'hokusai',n:'葛飾北齋',sub:'浮世繪・日本'}];
/* 2026-11-05 大熊定的權限：非會員＝梵谷前三集（總導覽＋EP01、EP02）；會員＝梵谷全部；工作人員＝全部。其他藝術家只有工作人員進得去。
   身分問 art.html 的 hallTier()；單獨打開展間（沒有 parent）一律當非會員 */
function hallTier(){try{if(parent!==window&&parent.hallTier)return parent.hallTier()}catch(e){}return 'guest'}
ARTISTS.forEach(a=>{if(a.id!=='vangogh'&&hallTier()!=='staff')a.open=false});
/* 展間內容：每一面展牆＝一幅畫＋一集語音（大熊用 Gemini Notebook 依「梵谷_NotebookLM素材包」一集一集做，壓成單聲道放 ../artist-audio/）
   audio 還沒做好的集數顯示「即將推出」；img 還沒放的畫顯示「展牆準備中」。guide＝最早那段 8 分鐘總導覽 */
/* 2026-11-03 大熊：所有藝術家都只開放總導覽＋EP01、EP02，後面鎖起來；工作人員全開。之後開放新藝術家不用另外設定 */
const FREE_EPS=2;
const ROOMS={vangogh:{n:'梵谷',en:'Vincent van Gogh・1853–1890',
  intro:'27 歲才拿起畫筆，只畫了十年，卻留下兩千多件作品。沿著這面牆，從荷蘭灰暗的農舍，一路走到南法的陽光、療養院窗外的星空。',
  guide:{src:'../artist-audio/vangogh2-guide.m4a',t:'總導覽：梵谷不是靠發瘋變天才',dur:'5:20',ct:'梵谷不是靠發瘋變天才',bg:'vangogh/card/starry-night.jpg'},
  /* 總覽卡片：上一行小字、下面的短標題（cards[ep]）；卡片圖用 vangogh/card/ 的小張 */
  head:{k:'從荷蘭走到奧維',h:'一面牆一幅畫<br><span>一幅畫一個故事</span>'},
  cards:{EP01:'吃馬鈴薯的人',EP02:'窮到只畫自己',EP03:'浮世繪救了他',EP04:'給高更的向日葵',EP05:'臥室與割耳那晚',EP06:'在白天畫星夜',EP07:'鳶尾花',EP08:'麥田群鴉不是遺書',EP09:'梵谷真的瘋了嗎？',EP10:'西奧與喬',EP11:'一集聽完一生',EP12:'可能是最後一幅',EP13:'不是抄，是翻譯'},   // 2026-11-01 大熊開場稿第二版（修掉站數、割耳「證實」、星夜講法；6:40 舊版 vangogh-guide.m4a 留著備用）
  periods:[
   {yr:'1880–1885',n:'荷蘭・從灰暗開始',works:[
     {ep:'EP01',kp:'想畫用挖土的手吃飯的人｜被朋友批評比例不對，友誼就此結束',t:'吃馬鈴薯的人',et:'梵谷馬鈴薯醜聞',audio:'../artist-audio/vangogh2-ep01.m4a',dur:'16:21',o:'De Aardappeleters',meta:'1885 年 4 月・油彩、畫布<br>荷蘭紐南 ｜ 阿姆斯特丹 梵谷美術館',img:'vangogh/potato-eaters.jpg',
      txt:'油燈下，五個農民圍著桌子吃馬鈴薯。梵谷刻意用沾著泥土般的顏色、不美化任何一張臉，他想畫的是用挖土的那雙手，誠實賺來的一餐。這是他 27 歲當畫家後，第一幅真正有野心的作品。',
      tip:'看看油燈的光落在誰的臉上。整幅畫唯一明亮的地方，就在燈下。'}]},
   {yr:'1886–1888',n:'巴黎・顏色亮起來',works:[
     {ep:'EP02',kp:'請不起模特兒，兩年畫二十多幅自己｜遇見印象派，顏色一下子亮起來',t:'戴灰色毛氈帽的自畫像',et:'梵谷巴黎兩年的自畫像實驗',audio:'../artist-audio/vangogh2-ep02.m4a',dur:'20:37',o:'Zelfportret met grijze vilthoed',meta:'1887 年・油彩、畫布<br>法國巴黎 ｜ 阿姆斯特丹 梵谷美術館',img:'vangogh/self-portrait.jpg',
      txt:'在巴黎的兩年，他畫了二十多幅自畫像。請不起模特兒，鏡子裡的自己最便宜，也最適合拿來做實驗。看到印象派和點描派之後，灰暗的顏色不見了，換成一條一條並排的藍、橘、綠。',
      tip:'看看他臉旁邊的背景，筆觸像放射線一樣圍著頭轉。跟《吃馬鈴薯的人》比，只隔了兩年。'}]},
   {yr:'1886–1888',n:'巴黎・遇見日本',works:[
     {ep:'EP03',kp:'和西奧收了幾百張便宜版畫｜學到粗輪廓、平塗、大膽裁切、亮顏色',t:'唐吉老爹',et:'浮世繪救了梵谷',audio:'../artist-audio/vangogh2-ep03.m4a',dur:'14:17',o:'Portrait du Père Tanguy',meta:'1887 年・油彩、畫布<br>法國巴黎 ｜ 巴黎 羅丹美術館',img:'vangogh/tanguy.jpg',
      txt:'在巴黎，梵谷和西奧在畫商賓的店裡買了好幾百張日本浮世繪，還自己辦過一場版畫展。顏料店老闆唐吉一直支持他，梵谷把他畫在正中間，背後貼滿日本版畫：富士山、花魁、櫻花。這些在日本平民都買得起的便宜版畫，教會了他清楚的輪廓線、平塗的顏色、大膽的構圖和明亮的色彩。',
      tip:'數數看唐吉背後有幾張日本版畫？找得到富士山嗎？'},
     {t:'梅樹：把畫面切成兩半',pair:[{img:'vangogh/jp-plum-hiroshige.jpg',t:'〈龜戶梅屋舖〉',by:'歌川廣重・1857'},{img:'vangogh/jp-plum-vangogh.jpg',t:'《盛開的梅樹》',by:'梵谷・1887'}],
      txt:'前景一根粗大的梅樹枝幹，霸道地把畫面切成兩半，這在當時的西方畫裡幾乎看不到。梵谷把顏色調得更濃，天空從黃到紅，還在兩邊加上自己照著抄的日文字。',
      tip:'比比看兩張的天空，梵谷把顏色換成了什麼？'},
     {t:'雨：一條一條畫出來',pair:[{img:'vangogh/jp-rain-hiroshige.jpg',t:'〈大橋安宅驟雨〉',by:'歌川廣重・1857'},{img:'vangogh/jp-rain-vangogh.jpg',t:'《雨中的橋》',by:'梵谷・1887'}],
      txt:'西方畫雨通常是灰濛濛的一片，木刻版畫卻是用刀刻出一根一根的雨絲。梵谷就用油畫筆，把雨一條一條清楚地畫出來，外面再框上一圈綠色的邊框。',
      tip:'橋上的人都低著頭在趕路，數數看有幾個人？'},
     {t:'花魁：從雜誌封面來的',pair:[{img:'vangogh/jp-courtesan-eisen.jpg',t:'《巴黎畫報》日本特刊封面',tag:'來源',by:'溪齋英泉的花魁・1886'},{img:'vangogh/jp-courtesan-vangogh.jpg',t:'《花魁》',by:'梵谷・1887'}],
      txt:'這張花魁來自 1886 年《巴黎畫報》日本特刊的封面。梵谷把她放大，四周加上一個有竹子、青蛙和鶴的池塘。他不是在重現真正的日本，而是在拼出一個屬於自己的日本。',
      tip:'找找看梵谷在四周的池塘裡，加了哪些動物和植物？'}]},
   {yr:'1888–1889',n:'阿爾・南法的陽光',works:[
     {ep:'EP04',kp:'為了迎接高更布置黃色房子｜只用黃色撐起一幅畫，一瓶花裡有花的一生',t:'向日葵',et:'給高更的向日葵',audio:'../artist-audio/vangogh2-ep04.m4a',dur:'13:46',o:'Sunflowers',meta:'1888 年 8 月・油彩、畫布<br>法國阿爾 ｜ 倫敦 國家美術館',img:'vangogh/sunflowers.jpg',
      txt:'為了迎接高更來同住，梵谷在南法的黃色房子裡一口氣畫了好幾幅向日葵，想用一整面牆的黃色歡迎朋友。花、桌面、背景幾乎全是黃色，他想試試只靠同一個顏色的深淺，能不能撐起一幅畫。',
      tip:'找找看哪一朵已經枯萎垂下了。同一個花瓶裡，有含苞、有盛開，也有凋謝。'},
     {ep:'EP05',kp:'第一個屬於自己的家｜跟高更吵了九週，割耳那晚南方畫室夢碎',t:'臥室',et:'紫色的梵谷臥室',audio:'../artist-audio/vangogh2-ep05.m4a',dur:'13:22',o:'De slaapkamer',meta:'1888 年 10 月・油彩、畫布<br>法國阿爾 ｜ 阿姆斯特丹 梵谷美術館',img:'vangogh/bedroom.jpg',
      txt:'黃色房子裡他自己的房間。他說這幅畫要讓人看了覺得「休息」，用一塊一塊平平的顏色讓腦袋安靜下來。對一直搬家的梵谷來說，這是第一個屬於自己的家。高更來了九週之後，兩人起了衝突，夢想中的「南方畫室」就此結束。',
      tip:'房間裡很多東西都是兩個一組：兩張椅子、兩個枕頭、兩扇門。'}]},
   {yr:'1889–1890',n:'聖雷米・療養院的窗',works:[
     {ep:'EP06',kp:'臥室不能畫，白天憑記憶畫夜空｜村莊和教堂是他加上去的',t:'星夜',et:'梵谷畫砸的星夜',audio:'../artist-audio/vangogh2-ep06.m4a',dur:'18:09',o:'De sterrennacht',meta:'1889 年 6 月・油彩、畫布<br>法國聖雷米 ｜ 紐約 現代藝術博物館',img:'vangogh/starry-night.jpg',
      txt:'自願住進療養院後，他常在天亮前看著窗外的星空。療養院不讓他在臥室作畫，這幅畫是白天憑記憶和想像畫的。畫裡的小村莊和教堂尖塔，從他的窗戶其實看不到，是他加進去的。',
      tip:'看筆觸的方向：天空一圈一圈旋轉、絲柏往上竄、村莊是平靜的短線。同一幅畫裡有三種情緒。'},
     {ep:'EP07',kp:'住進療養院最早的畫｜畫畫是讓自己穩定下來的方法',t:'鳶尾花',et:'梵谷鳶尾花的避雷針',audio:'../artist-audio/vangogh2-ep07.m4a',dur:'18:14',o:'Irises',meta:'1889 年 5 月・油彩、畫布<br>法國聖雷米 ｜ 洛杉磯 蓋蒂美術館',img:'vangogh/irises.jpg',
      txt:'剛住進療養院時，他還不能離開院區，就在花園裡畫眼前盛開的鳶尾花。專心畫畫的時候，比較不會被病困擾。清楚的輪廓線、平塗的顏色、被畫面邊緣切掉的構圖，都看得出日本浮世繪的影響。',
      tip:'一大片紫色裡，左邊只有一朵白色的鳶尾花。'}]},
   {yr:'1890',n:'奧維・最後的七十天',works:[
     {ep:'EP08',kp:'七十天畫了約七十幅｜「最後一幅畫」「遺書」都是迷思',t:'麥田群鴉',et:'麥田群鴉非遺書',audio:'../artist-audio/vangogh2-ep08.m4a',dur:'10:54',o:'Korenveld met kraaien',meta:'1890 年 7 月・油彩、畫布<br>法國奧維 ｜ 阿姆斯特丹 梵谷美術館',img:'vangogh/wheatfield-crows.jpg',
      txt:'在奧維的七十天裡，他畫了大約七十幅畫。很多人說這是他的「最後一幅畫」，其實沒有確切證據，之後他還畫了其他作品。他在信裡說，想用陰沉天空下的麥田表達悲傷和孤獨，但也想畫出鄉間讓人重新有力量的那一面。',
      tip:'看看三條小路，再看看烏鴉飛的方向：是飛過來，還是飛走？'}]},
   {yr:'特別展牆',n:'畫背後的故事',works:[
     {ep:'EP09',kp:'發作時其實不能畫｜割耳、只賣一幅畫、死因之謎一次聽懂',t:'梵谷真的瘋狂嗎？',et:'梵谷其實極度理性',audio:'../artist-audio/vangogh2-ep09.m4a',dur:'13:58',txt:'兩位主持人辯論：他是因為瘋才偉大，還是生了病、但非常努力的畫家？割耳的新證據、只賣出一幅畫、死因之謎，一次聽懂。',tip:'割耳一直有兩種說法：以前大多說只割了耳垂；2016 年發現當年醫生畫的草圖，顯示可能是幾乎整隻耳朵。'},
     {ep:'EP10',kp:'西奧每月寄錢、八百多封信｜喬帶著嬰兒把梵谷推向全世界',t:'西奧與喬：沒有他們就沒有梵谷',et:'捧紅梵谷的弟媳喬',audio:'../artist-audio/vangogh2-ep10.m4a',dur:'12:10',txt:'弟弟西奧每個月寄來的錢，是給他自由，還是壓力？西奧過世後，年輕的喬帶著嬰兒、幾百幅賣不出去的畫和八百多封信，把梵谷推向全世界。'},
     {ep:'EP11',kp:'一集聽完一生｜出身中產、會三種語言，是自己選了這條路',t:'梵谷不窮也沒瘋',et:'梵谷其實沒發瘋',audio:'../artist-audio/vangogh2-ep11.m4a',dur:'19:52',txt:'一集聽完梵谷的一生：他其實出身中產家庭、會三種語言，是自己選了這條路。從灰暗的荷蘭、浮世繪、南法的陽光，一路講到喬怎麼保存他的畫。',tip:'割耳一直有兩種說法：以前大多說只割了耳垂；2016 年發現當年醫生畫的草圖，顯示可能是幾乎整隻耳朵。'}]},
   {yr:'加映',n:'最後一幅・樹根',works:[
     {ep:'EP12',kp:'沒畫完的畫怎麼翻案｜一張舊明信片找到作畫地點',t:'樹根',et:'梵谷最後一幅畫樹根',audio:'../artist-audio/vangogh2-ep12.m4a',dur:'16:46',o:'Boomwortels',meta:'1890 年 7 月・油彩、畫布<br>法國奧維 ｜ 阿姆斯特丹 梵谷美術館',img:'vangogh/tree-roots.jpg',
      txt:'沒有天空、沒有地平線，只有擠在一起的樹幹和樹根。它可能是梵谷最後一幅畫。2020 年，一張舊明信片找到了很可能的作畫地點，離他住的旅館只有大約 150 公尺。',
      tip:'先別找樹根，瞇起眼睛只看顏色塊，再慢慢找出哪裡是樹幹、哪裡是根。你花了多久才看出來？'}]},
   {yr:'加映',n:'一輩子的老師・米勒',works:[
     {ep:'EP13',kp:'彈貝多芬的比喻｜把黑白版畫翻譯成顏色',t:'午休（仿米勒）',et:'梵谷臨摹米勒',audio:'../artist-audio/vangogh2-ep13.m4a',dur:'10:39',o:'La Méridienne',meta:'1889–90 年冬・油彩、畫布<br>法國聖雷米 ｜ 巴黎 奧塞美術館',img:'vangogh/siesta.jpg',
      txt:'他一生都在學米勒。療養院的那個冬天，他對著黑白版畫和照片畫了大約二十幅油畫，自己說這不是臨摹，是翻譯成顏色這種語言。《午休》的構圖幾乎照著米勒，顏色完全是他的。',
      tip:'如果把《午休》換成黑白，它會更像米勒嗎？少了顏色之後，梵谷還剩下什麼？'}]}],
  credit:'畫作圖片皆為公有領域：梵谷美術館（阿姆斯特丹）、奧塞美術館、倫敦國家美術館、紐約現代藝術博物館、洛杉磯蓋蒂美術館、羅丹美術館、荷蘭國家博物館，取自維基共享資源'},
monet:{n:'莫內',en:'Claude Monet・1840–1926',
  guide:{src:'../artist-audio/monet-guide.m4a',t:'總導覽：莫內不畫像只追光',dur:'3:54',ct:'莫內不畫像只追光',bg:'monet/card/impression.jpg'},
  head:{k:'從勒阿弗爾走到吉維尼',h:'一面牆一幅畫<br><span>一幅畫一個故事</span>'},
  cards:{EP01:'消失的太陽',EP02:'撐陽傘的卡蜜兒',EP03:'聖拉札爾車站',EP04:'乾草堆的光影革命',EP05:'融化的石頭',EP06:'打造睡蓮池',EP07:'橘園睡蓮',EP08:'寫生神話',EP09:'挨餓畫青蛙塘',EP10:'倫敦毒霧',EP11:'親手切開的巨作',EP12:'快問快答'},
  periods:[
   {yr:'1872',n:'勒阿弗爾・被嘲笑的名字',works:[
     {ep:'EP01',t:'印象・日出',et:'消失的莫內太陽',audio:'../artist-audio/monet-ep01.m4a',dur:'18:11',o:'Impression, soleil levant',meta:'1872 年・油彩、畫布<br>法國勒阿弗爾 ｜ 巴黎 瑪摩丹莫內美術館',img:'monet/impression.jpg',
      txt:'勒阿弗爾港口清晨的霧，一顆橘紅色的太陽，筆觸快得像沒畫完。1874 年展出時，評論家借畫名嘲笑這群人只是「印象派」，沒想到這個嘲笑，變成整個畫派的名字。',
      tip:'太陽看起來很亮，可是轉成黑白，它的明暗幾乎跟天空一樣。莫內靠的是顏色，不是明暗。'}]},
   {yr:'1875',n:'阿讓特伊・卡蜜兒',works:[
     {ep:'EP02',t:'撐陽傘的女人',et:'莫內撐陽傘的女人與妻子遺容',audio:'../artist-audio/monet-ep02.m4a',dur:'14:53',o:'Woman with a Parasol – Madame Monet and Her Son',meta:'1875 年・油彩、畫布<br>法國阿讓特伊 ｜ 華盛頓 國家藝廊',img:'monet/parasol.jpg',
      txt:'妻子卡蜜兒和兒子尚站在阿讓特伊的草地上，風吹動裙擺和面紗，一般認為是在戶外幾個小時內畫成。卡蜜兒 1879 年過世，才 32 歲，莫內後來說，當時連悲傷的時候，都不由自主在看她臉上的顏色。',
      tip:'找找看陰影是什麼顏色。莫內筆下的陰影不是黑的，是藍的、紫的、綠的。'}]},
   {yr:'1877',n:'巴黎・火車的蒸汽',works:[
     {ep:'EP03',t:'聖拉札爾車站',et:'莫內用蒸氣畫光',audio:'../artist-audio/monet-ep03.m4a',dur:'21:54',o:'La Gare Saint-Lazare',meta:'1877 年・油彩、畫布<br>法國巴黎 ｜ 巴黎 奧塞美術館',img:'monet/saint-lazare.jpg',
      txt:'別人畫神話、畫歷史，他畫當時最新的東西：火車、鐵架玻璃屋頂、白色蒸汽。三個月畫了十幾幅，這是他第一次對同一個地方畫好幾幅，後來的系列畫就從這裡開始。',
      tip:'蒸汽是透明的，莫內怎麼用不透明的油彩，畫出看得穿的煙？'}]},
   {yr:'1890–1891',n:'吉維尼田野・主角是光',works:[
     {ep:'EP04',t:'乾草堆（夏末）',et:'莫內靠乾草堆翻身',audio:'../artist-audio/monet-ep04.m4a',dur:'13:36',o:'Stacks of Wheat (End of Summer)',meta:'1890–91 年・油彩、畫布<br>法國吉維尼 ｜ 芝加哥藝術博物館',img:'monet/haystacks.jpg',
      txt:'同一堆穀物，早上、中午、傍晚、下雪、起霧各畫一幅，光一變就換一張畫布。1891 年展出十五幅，很快就賣掉大半，五十歲的莫內從此不再缺錢。',
      tip:'主角其實不是乾草堆，是光。看看影子落在哪個方向，猜猜這是一天裡的什麼時候。'}]},
   {yr:'1892–1894',n:'盧昂・融化的石頭',works:[
     {ep:'EP05',t:'盧昂大教堂（藍色和諧）',et:'莫內畫出融化的石頭',audio:'../artist-audio/monet-ep05.m4a',dur:'13:23',o:'La Cathédrale de Rouen. Le portail, soleil matinal',meta:'1893 年・油彩、畫布<br>法國盧昂 ｜ 巴黎 奧塞美術館',img:'monet/rouen.jpg',
      txt:'他在教堂對面租了地方，排著一整排畫布，太陽走到哪個位置就拿出哪一張。為什麼挑教堂？因為石頭不會動，畫面上每一點變化，都只可能來自光。',
      tip:'瞇起眼睛看，教堂的線條幾乎不見了，只剩一片一片的顏色。'}]},

$('zBack').onclick=e=>{e.stopPropagation();zt=0;$('zoom').hidden=true;$('zoom').classList.remove('big')};
function openZoom(src,alt){$('zImg').src=src;$('zImg').alt=alt;$('zoom').hidden=false}
function home(){stopAudio();$('room').hidden=true;$('ovB').hidden=true;$('barR').hidden=false;$('goon').hidden=true;$('home').hidden=false;$('barT').textContent='畫框背後';scrollTo(0,0)}
$('grid').innerHTML=ARTISTS.map(a=>`<button type="button" class="art${a.open?' open':''}" data-id="${a.id}"${a.open?'':' disabled'}><em>${a.open?'開放中':'籌備中'}</em><b>${esc(a.n)}</b><span>${esc(a.sub)}</span></button>`).join('');
$('grid').querySelectorAll('.art.open').forEach(b=>b.onclick=()=>openRoom(b.dataset.id));
function openRoom(id){const tier=hallTier();if(id!=='vangogh'&&tier!=='staff')id='vangogh';const R=ROOMS[id];if(!R)return;paintWall(id);const free=tier==='guest'?FREE_EPS:null;   // 會員、工作人員不受上鎖限制
  $('home').hidden=true;$('barT').textContent=R.n;list=[];stops=[];curStop=-1;
  hlRoom=id;hlLog('enter',0);if(R.guide)list.push({src:R.guide.src,label:R.guide.t,img:null,guide:1,ep:'guide'});
  /* 一站＝一集（有 ep 的那面牆）＋後面跟著的對照牆（例如浮世繪三組）；list 照站的順序排，播完自動接 */
  R.periods.forEach(p=>p.works.forEach(w=>{if(w.ep||!stops.length)stops.push({p,pl:p.n.split('・')[0],w,ws:[w]});else stops[stops.length-1].ws.push(w)}));
  openN=free==null?stops.length:Math.min(free,stops.length);   // 前 openN 站開放，後面的只在總覽露出上鎖卡片，音檔不進播放清單
  stops.forEach((s,k)=>{const w=s.w;delete w._i;s.lock=k>=openN;if(w.audio&&!s.lock)w._i=list.push({src:w.audio,label:`${w.ep} ${w.et||w.t}`,img:w.img,k,ep:w.ep.toLowerCase()})-1});
  const ep=w=>{if(!w.audio)return`<div class="ep soon"><div class="pb">🎧</div><div><b>${esc(w.ep)}　${esc(w.t)}</b><span>語音即將推出</span></div></div>`;
    const i=w._i;return`<button type="button" class="ep" data-i="${i}"><div class="pb">▶</div><div><b>${esc(w.ep)}　${esc(w.et||w.t)}</b><span>🎧 聽這一集${w.dur?'・'+esc(w.dur):''}</span></div></button>`};   // et＝筆記本那一集的標題
  const fig=(f,tag)=>`<figure><button type="button" class="frame" data-z="${esc(f.img)}" aria-label="放大看${esc(f.t)}"><img src="${esc(f.img)}" alt="${esc(f.t)}" loading="lazy"></button><figcaption><em>${f.tag||tag}</em><b>${esc(f.t)}</b>${esc(f.by)}</figcaption></figure>`;
  const wall=w=>w.pair?`<div class="pairh">${esc(w.t)}</div><div class="pair">${fig(w.pair[0],'日本原作')}${fig(w.pair[1],'梵谷臨摹')}</div>${w.txt?`<p class="txt">${esc(w.txt)}</p>`:''}${w.tip?`<div class="tip"><b>👀 觀察小提示</b>　${esc(w.tip)}</div>`:''}`
    :!w.img&&w.audio?`<div class="spc"><b>${esc(w.t)}</b>${w.txt?`<p class="txt">${esc(w.txt)}</p>`:''}${w.tip?`<div class="tip"><b>📝 小註</b>　${esc(w.tip)}</div>`:''}${ep(w)}</div>`
    :w.img?`<div class="wallp"><button type="button" class="frame" data-z="${esc(w.img)}" aria-label="放大看《${esc(w.t)}》"><img src="${esc(w.img)}" alt="《${esc(w.t)}》" loading="lazy"></button>
      <div class="lab"><b>《${esc(w.t)}》</b><div class="o">${esc(w.o||'')}</div><div class="m">${w.meta||''}</div></div></div>
      ${ep(w)}${w.txt?`<p class="txt">${esc(w.txt)}</p>`:''}${w.tip?`<div class="tip"><b>👀 觀察小提示</b>　${esc(w.tip)}</div>`:''}`
    :`<div class="ghost"><b>《${esc(w.t)}》</b>展牆準備中・真跡與語音即將推出</div>`;
  const eps=stops.filter(s=>s.w.audio&&!s.lock),gs=R.guide?[{w:R.guide}]:[],secs=eps.concat(gs).reduce((a,s)=>{const [m,x]=(s.w.dur||'0:0').split(':');return a+(+m)*60+(+x)},0);
  const thumb=w=>w.img?cardImg(w.img):'';
  const card=(s,k)=>`<button type="button" class="card${s.lock?' lock':''}" data-k="${k}"${s.w._i!=null?` data-i="${s.w._i}"`:''}${s.w.img?` style="background-image:url('${esc(thumb(s.w))}')"`:''}><i>${s.lock?'🔒':esc(s.w.dur||'')}</i><em>${esc(s.w.ep||'')}${s.w.img?'・'+esc(s.pl):''}</em><b>${esc((R.cards||{})[s.w.ep]||s.w.t)}</b></button>`;
  const G=R.guide,main=stops.map((s,k)=>[s,k]).filter(([s])=>s.w.img),sp=stops.map((s,k)=>[s,k]).filter(([s])=>!s.w.img);
  $('room').innerHTML=`<section id="ov"><div class="ovh"><small>${esc(R.head.k)}</small><h1>${R.head.h}</h1><p>${esc(R.n)}・${free!=null?'開放 ':''}${eps.length+gs.length} 集・約 ${Math.floor(secs/3600)?Math.floor(secs/3600)+' 小時 ':''}${Math.round(secs%3600/60)} 分</p></div>
      ${G?`<button type="button" class="card gcard" id="gCard" style="background-image:url('${esc(G.bg)}')"><em>大熊開場・先聽這個</em><b>${esc(G.ct)}</b><span>🎧 ${esc(G.dur)}・${free!=null?'帶你先認識他':'帶你走一遍'}</span><u>▶</u></button>`:''}
      <div class="cards">${main.map(([s,k])=>card(s,k)).join('')}</div>
      ${sp.length?`<div class="sph">＋ 特別篇</div><div class="cards sp">${sp.map(([s,k])=>card(s,k)).join('')}</div>`:''}
      <p class="credit">${esc(R.credit)}<br>語音由 OTTO2 以 Google Gemini Notebook 製作</p></section>
    <section id="st" hidden></section>`;
  ROOM=R;$('room').hidden=false;scrollTo(0,0);showOv();
  if($('gCard'))$('gCard').onclick=()=>{if(cur===0&&!au.paused)au.pause();else if(cur===0&&au.dataset.src)au.play();else playIdx(0)};
  $('ov').querySelectorAll('.card[data-k]').forEach(b=>b.onclick=()=>stops[+b.dataset.k].lock?lockToast():showStop(+b.dataset.k,1));
  /* 左右滑換站（橫向位移夠大、而且比上下多才算） */
  let sx=0,sy=0;$('st').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  $('st').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&curStop<openN-1)showStop(curStop+1,1);else if(dx>0&&curStop>0)showStop(curStop-1,-1)}},{passive:true});
  ROOM.wall=wall}
let ROOM=null;
const cardImg=src=>src.replace(/^(\w+)\//,'$1/card/');   // 總覽卡片和下一站用小張：vangogh/x.jpg → vangogh/card/x.jpg
function showOv(){if(!$('ov'))return;$('st').hidden=true;$('ov').hidden=false;$('ovB').hidden=true;$('barR').hidden=false;
  const c=curStop>=0&&$('ov').querySelector(`.card[data-k="${curStop}"]`);if(c)c.scrollIntoView({block:'center'});else scrollTo(0,0);lookDock()}
function lockToast(){const t=$('lockT');let can=false;try{can=parent!==window&&parent.hallCanTicket&&parent.hallCanTicket()}catch(e){}
  t.innerHTML='🔒 這一集會員才能聽'+(can?'<button type="button" id="lockTk" style="display:block;margin:8px auto 0;padding:7px 14px;border:0;border-radius:99px;background:#e9cf8c;color:#3a2a10;font:700 14px inherit;pointer-events:auto;cursor:pointer">我是會員，輸入電話</button>':'');if(can)$('lockTk').onclick=()=>{stopAudio();parent.hallReticket()};
  t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,can?6000:2200)}
function showStop(k,dir){const s=stops[k];if(!s||s.lock)return;curStop=k;$('ov').hidden=true;$('ovB').hidden=false;$('barR').hidden=true;
  const n=k+1<openN?stops[k+1]:null,dots=stops.slice(0,openN).map((_,j)=>`<s class="${j===k?'on':''}"></s>`).join('');
  $('st').hidden=false;$('st').innerHTML=`<div class="stp ${dir<0?'in-r':'in-l'}"><div class="pgr"><button type="button" id="pv" aria-label="上一站"${k?'':' disabled'}>‹</button><div><b>第 ${k+1} 站 / ${openN}</b><div class="dots">${dots}</div></div><button type="button" id="nx" aria-label="下一站"${n?'':' disabled'}>›</button></div>
    <div class="period"><div><span>${esc(s.p.yr)}</span><b>${esc(s.p.n)}</b></div></div>${s.ws.map(ROOM.wall).join('')}
    ${n?`<button type="button" class="nxt" id="nx2">${n.w.img?`<img src="${esc(cardImg(n.w.img))}" alt="">`:''}<div><small>下一站・${esc(n.w.ep||'')}</small><b>${esc((ROOM.cards||{})[n.w.ep]||n.w.t)}</b></div><i>→</i></button>`
       :`<button type="button" class="nxt" id="nx2"><div><small>${openN<stops.length?'後面的展牆會員才能聽':'走完了'}</small><b>回到總覽</b></div><i>☰</i></button>`}</div>`;
  $('pv').onclick=()=>showStop(k-1,-1);$('nx').onclick=()=>showStop(k+1,1);$('nx2').onclick=()=>n?showStop(k+1,1):showOv();
  $('st').querySelectorAll('.ep[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(cur===i&&!au.paused)au.pause();else if(cur===i&&au.dataset.src)au.play();else playIdx(i)});
  $('st').querySelectorAll('.frame').forEach(b=>b.onclick=()=>openZoom(b.dataset.z,b.querySelector('img').alt));
  document.querySelectorAll('.ep,.card[data-i]').forEach(b=>b.classList.toggle('on',b.dataset.i==String(cur)));scrollTo(0,0);lookDock()}
$('ovB').onclick=showOv;
/* 從 3D 大廳點藝術家進來（網址帶 room）：返回就直接回大廳，不經過清單 */
const q=new URLSearchParams(location.search).get('room');
$('back').onclick=()=>{if(!$('room').hidden&&!q)return home();stopAudio();if(window===top){location.href='../art.html?hall=1';return}post('closeHall')};   // 在手機瀏覽器單獨打開時，回到大廳
if(q){openRoom(q);$('back').textContent='← 回大廳'}
</script></body></html>
