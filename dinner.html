<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>大家的晚餐</title>
<style>
/* 2026-11-14 感恩節「大家的晚餐」長桌大圖：玩接火雞拍了合照的人，一個一個坐到桌子後面。
   一段桌子 10 個位子，坐滿就往右接一段；左右滑看整桌，點人看他的感恩的話。 */
:root{--bg:#2a1d12;--ink:#fbf1dc;--soft:#e6cfa3;--gold:#ffcf6b;--card:#fbf6ea;--cardInk:#3b2416;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{flex:none;padding:12px max(16px,env(safe-area-inset-left,0px)) 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:.05em}
#cnt{font-size:14px;font-weight:700}
#hint{font-size:12px;color:var(--soft);width:100%}
#wrap{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;position:relative;display:flex;align-items:center}
#cv{display:block;height:min(100%,440px);flex:none;border-block:3px solid #6b4a24}   /* 直拿手機一次看得到 3～4 個人 */
#empty{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);background:rgba(42,29,18,.82);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:700;text-align:center;line-height:1.6;max-width:80vw}
#pop{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--cardInk);border-radius:14px;padding:12px 16px;
  box-shadow:0 10px 26px rgba(0,0,0,.5);width:min(86vw,360px);box-sizing:border-box;display:flex;gap:12px;align-items:center}
#pop[hidden],#empty[hidden]{display:none}
#pop img{width:64px;height:88px;object-fit:contain;flex:none}
#pop .q{font-size:15px;font-weight:800;line-height:1.5}
#pop .w{font-size:12px;color:#8a6a4a;margin-top:4px}
#pop button{position:absolute;top:4px;right:8px;border:0;background:none;font-size:20px;color:#8a6a4a;cursor:pointer}
#nav{flex:none;display:flex;gap:10px;padding:8px 16px 0;justify-content:center}
#nav a{flex:1;max-width:200px;text-align:center;text-decoration:none;border-radius:22px;padding:10px 0;font-size:15px;font-weight:800}
#nav .g{background:#e2711d;color:#fff;box-shadow:0 3px 0 #9c4510}#nav .p{border:1.5px solid var(--gold);color:var(--gold)}
/* 11/16 大熊：進長桌前先播「有人開門」的動畫；影片還沒放上去（載不到）就直接跳過 */
#door{position:fixed;inset:0;z-index:9;background:#000;display:flex;align-items:center;justify-content:center}
#door{transition:opacity .7s}#door.out{opacity:0;pointer-events:none}#door[hidden]{display:none}
/* 影片還沒好之前的開門動畫：兩扇木門往內打開，裡面暖光透出來 */
#dcss{position:absolute;inset:0;perspective:900px;background:radial-gradient(ellipse at 50% 55%,#fff1c2 0%,#ffcf6b 30%,#c9792a 62%,#2a1608 100%);overflow:hidden}
#dcss[hidden]{display:none}
#dcss .dd{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#6b4220 0 34px,#5a361a 34px 37px,#74482a 37px 70px,#4e2f16 70px 73px);box-shadow:inset 0 0 40px rgba(0,0,0,.55);transition:transform 1.5s cubic-bezier(.5,0,.2,1)}
#dcss .dd::before{content:"";position:absolute;left:10%;right:10%;top:18%;height:5%;background:#3a230f;border-radius:3px;box-shadow:0 52vh 0 #3a230f}
#dcss .l{left:0;transform-origin:left center}#dcss .r{right:0;transform-origin:right center}
#dcss .l::after,#dcss .r::after{content:"";position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#d8a640;box-shadow:0 0 0 4px #7a5420}
#dcss .l::after{right:16px}#dcss .r::after{left:16px}
#dcss.open .l{transform:rotateY(-100deg)}#dcss.open .r{transform:rotateY(100deg)}
#dcss b{position:absolute;left:0;right:0;top:44%;text-align:center;color:#3b2416;font-size:clamp(20px,6vw,30px);font-weight:900;opacity:0;transition:opacity .8s .9s;text-shadow:0 1px 0 #fff3c4}
#dcss.open b{opacity:1}#door video{width:100%;height:100%;object-fit:cover}
#door button{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.4);color:#fff;border-radius:16px;padding:6px 14px;font:inherit;font-size:14px}
footer{flex:none;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--soft);text-align:center}
</style>
</head>
<body>
<header><h1>🍽 大家的晚餐</h1><span id="cnt">載入中…</span><span id="hint">左右滑動看整桌，點一個人看他的感恩的話（手機橫過來看更大）</span></header>
<div id="wrap"><canvas id="cv" aria-label="長桌晚餐"></canvas><div id="empty" hidden>還沒有人入座<br>玩「感恩節接火雞」拍完合照，就能當第一位客人！</div></div>
<div id="pop" hidden><img id="pImg" alt=""><div><div class="q" id="pQ"></div><div class="w" id="pW"></div></div><button type="button" id="pX" aria-label="關閉">×</button></div>
<nav id="nav"><a class="g" href="catch-demo.html">🦃 回接火雞遊戲</a><a class="p" href="park.html">🎡 回遊樂島</a></nav>
<div id="door" hidden><video id="doorV" playsinline webkit-playsinline muted preload="auto"></video><div id="dcss" hidden><b>歡迎來到梵谷村的長桌晚餐</b><i class="dd l"></i><i class="dd r"></i></div><button type="button" id="doorX">略過 ›</button></div>
<footer>OTTO2 ARTCLUB・2026 感恩節　梵谷村的長桌晚餐</footer>
<script>
(()=>{
'use strict';
const NOTIFY_URL='https://otto2-notify-production.up.railway.app';
const DEMO=/[?&]demo=1/.test(location.search);
const SEG_W=2000,SEG_H=667,FORE_TOP=207;
/* 11/16 大熊：不要一桌一桌開，要一張連續的長桌，一開始就有 40 個位子，人多了往右一直接長。
   做法：原圖左端 0～400、右端 1600～2000 保留，中間 400～1600 那段一直複製接起來（接縫淡入淡出 OV px）。 */
const SEAT_BOTTOM=462,PERSON_H=232,L_END=400,R_END=1600,TW=R_END-L_END,OV=110,GAP=165,MIN_SEATS=40;
function tableW(n){return L_END+n*TW+(SEG_W-R_END)}
function seatsFor(n){const W=tableW(n),out=[],flowers=[];for(let k=0;k<n;k++)flowers.push(L_END+k*TW+(900-L_END));   // 每段中間的向日葵前面不坐人
  for(let x=175;x<=W-175;x+=GAP)if(flowers.every(f=>Math.abs(f-x)>105))out.push(x);return out}
function piece(img,sx,sw,h,feather){const c=document.createElement('canvas');c.width=sw;c.height=h;const x=c.getContext('2d');x.drawImage(img,sx,0,sw,h,0,0,sw,h);
  if(feather){const m=document.createElement('canvas');m.width=sw;m.height=h;const mx=m.getContext('2d');const g=mx.createLinearGradient(0,0,OV,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');mx.fillStyle=g;mx.fillRect(0,0,OV,h);mx.fillStyle='#000';mx.fillRect(OV,0,sw-OV,h);
    x.globalCompositeOperation='destination-in';x.drawImage(m,0,0)}return c}   // 遮罩要一次蓋上去，分兩次 fillRect 會把另一邊清掉
function drawLong(ctx,img,n,y0,h){if(!img)return;const left=piece(img,0,L_END,h,false),mid=piece(img,L_END-OV,TW+OV,h,true),right=piece(img,R_END-OV,SEG_W-R_END+OV,h,true);
  ctx.drawImage(left,0,y0);for(let k=0;k<n;k++)ctx.drawImage(mid,L_END+k*TW-OV,y0);ctx.drawImage(right,L_END+n*TW-OV,y0)}
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const load=(src,cors)=>new Promise(ok=>{const im=new Image();if(cors)im.crossOrigin='anonymous';im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src});
let people=[],hits=[];
/* 上傳的人比較暗，調亮一點、偏暖，才搭這張明亮的桌子 */
function warm(im){try{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){p[i]=Math.min(255,p[i]*1.3*.87+255*.13);p[i+1]=Math.min(255,p[i+1]*1.3*.87+205*.13);p[i+2]=Math.min(255,p[i+2]*1.3*.87+150*.13)}
  x.putImageData(d,0,0);return c}catch(e){return im}}
async function main(){
  let list=[];
  if(DEMO){list=Array.from({length:13},(_,i)=>({id:'demo'+i,n:['林○○','陳○○','王○○','張○○','李○○'][i%5],ch:'村民',msg:['感恩有你們一起吃飯！','謝謝老師陪我畫完第一幅畫','今年最開心的一天','謝謝家人一直支持我','感恩每一堂課'][i%5],cut:'catch-video/dinner/demo/p'+String(i%15+1).padStart(2,'0')+'.webp'}))}
  else{try{const r=await fetch(NOTIFY_URL+'/dinner/list');const j=await r.json();if(j.ok)list=j.list||[]}catch(e){$('#cnt').textContent='讀不到名單，請稍後再試'}}
  const [bg,fore]=await Promise.all([load('catch-video/dinner/table.jpg'),load('catch-video/dinner/fore.webp?v=2')]);
  const imgs=await Promise.all(list.map(x=>load(x.cut,!DEMO)));
  people=list.map((x,i)=>({...x,img:imgs[i]})).filter(x=>x.img);
  let n=1;while(n<12&&seatsFor(n).length<Math.max(MIN_SEATS,people.length))n++;
  const SEATS=seatsFor(n);cv.width=tableW(n);cv.height=SEG_H;
  drawLong(ctx,bg,n,0,SEG_H);
  hits=[];
  people.slice(0,SEATS.length).forEach((p,i)=>{const x=SEATS[i],h=PERSON_H*(0.97+((i*37)%7)/100),w=h*p.img.naturalWidth/p.img.naturalHeight;
    const src=warm(p.img);ctx.drawImage(src,x-w/2,SEAT_BOTTOM-h,w,h);hits.push({x0:x-w/2,x1:x+w/2,y0:SEAT_BOTTOM-h,y1:SEAT_BOTTOM,p})});
  if(fore){const fc=document.createElement('canvas');fc.width=SEG_W;fc.height=SEG_H-FORE_TOP;fc.getContext('2d').drawImage(fore,0,0,SEG_W,SEG_H-FORE_TOP);drawLong(ctx,fc,n,FORE_TOP,SEG_H-FORE_TOP)}   // 桌上的食物和桌巾蓋在人前面
  $('#cnt').textContent=people.length?('目前 '+people.length+' 位客人入座・長桌還有 '+Math.max(0,SEATS.length-people.length)+' 個空位'+(DEMO?'（示範）':'')):'';
  $('#empty').hidden=!!people.length;
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width,x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;
  const h=hits.slice().reverse().find(h=>x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1);if(!h){$('#pop').hidden=true;return}
  $('#pImg').src=h.p.img.src;$('#pQ').textContent='「'+(h.p.msg||'感恩有你們一起吃飯！')+'」';$('#pW').textContent=(h.p.n||'客人')+(h.p.ch?'・'+h.p.ch:'');$('#pop').hidden=false});
$('#pX').onclick=()=>{$('#pop').hidden=true};
main();
/* 開門動畫：每次從遊戲或作品島進來都播一次（?nodoor=1 不播） */
(()=>{if(/[?&]nodoor=1/.test(location.search))return;const d=$('#door'),v=$('#doorV');let done=false,mode='';   // mode：'vid' 播影片／'css' 播程式畫的門，只會選一種
  const end=()=>{if(done)return;done=true;if(d.hidden)return;d.classList.add('out');setTimeout(()=>{d.hidden=true;try{v.pause()}catch(e){}},700)};
  /* 開門影片（door.mp4，另一個工作階段 7429523 接上的）優先；影片壞掉或 2.5 秒還沒載好，才改播程式畫的門 */
  const css=()=>{if(done||mode)return;mode='css';v.hidden=true;d.hidden=false;$('#dcss').hidden=false;setTimeout(()=>$('#dcss').classList.add('open'),400);setTimeout(()=>{d.style.transition='opacity .5s';d.style.opacity='0';setTimeout(end,500)},2700)};
  v.onended=end;v.onerror=css;$('#doorX').onclick=end;
  v.oncanplay=()=>{if(done||mode)return;mode='vid';d.hidden=false;v.muted=false;v.play().catch(()=>{v.muted=true;v.play().catch(end)})};
  v.src='catch-video/dinner/door.mp4?v=2';setTimeout(()=>{if(!mode)css()},2500)})();
})();
</script>
</body>
</html>
