<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>大家的晚餐</title>
<style>
/* 2026-11-14 感恩節「大家的晚餐」長桌大圖：玩接火雞拍了合照的人，一個一個坐到桌子後面。
   一段桌子 10 個位子，坐滿就往右接一段；左右滑看整桌，點人看他的感恩的話。 */
:root{--bg:#2a1d12;--ink:#fbf1dc;--soft:#e6cfa3;--gold:#ffcf6b;--card:#fbf6ea;--cardInk:#3b2416;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{flex:none;padding:12px max(16px,env(safe-area-inset-left,0px)) 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:20px;color:var(--gold);letter-spacing:.05em}
#cnt{font-size:14px;font-weight:700}
#hint{font-size:12px;color:var(--soft);width:100%}
#wrap{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;position:relative;display:flex;align-items:center}
#cv{display:block;height:min(100%,440px);flex:none;border-block:3px solid #6b4a24}   /* 直拿手機一次看得到 3～4 個人 */
#empty{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);background:rgba(42,29,18,.82);padding:12px 18px;border-radius:14px;font-size:15px;font-weight:700;text-align:center;line-height:1.6;max-width:80vw}
#pop{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card);color:var(--cardInk);border-radius:14px;padding:12px 16px;
  box-shadow:0 10px 26px rgba(0,0,0,.5);width:min(86vw,360px);box-sizing:border-box;display:flex;gap:12px;align-items:center}
#pop[hidden],#empty[hidden]{display:none}
#pop img{width:64px;height:88px;object-fit:contain;flex:none}
#pop .q{font-size:15px;font-weight:800;line-height:1.5}
#pop .w{font-size:12px;color:#8a6a4a;margin-top:4px}
#pop button{position:absolute;top:4px;right:8px;border:0;background:none;font-size:20px;color:#8a6a4a;cursor:pointer}
footer{flex:none;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--soft);text-align:center}
</style>
</head>
<body>
<header><h1>🍽 大家的晚餐</h1><span id="cnt">載入中…</span><span id="hint">左右滑動看整桌，點一個人看他的感恩的話（手機橫過來看更大）</span></header>
<div id="wrap"><canvas id="cv" aria-label="長桌晚餐"></canvas><div id="empty" hidden>還沒有人入座<br>玩「感恩節接火雞」拍完合照，就能當第一位客人！</div></div>
<div id="pop" hidden><img id="pImg" alt=""><div><div class="q" id="pQ"></div><div class="w" id="pW"></div></div><button type="button" id="pX" aria-label="關閉">×</button></div>
<footer>OTTO2 ARTCLUB・2026 感恩節　梵谷村的長桌晚餐</footer>
<script>
(()=>{
'use strict';
const NOTIFY_URL='https://otto2-notify-production.up.railway.app';
const DEMO=/[?&]demo=1/.test(location.search);
const SEG_W=2000,SEG_H=667,FORE_TOP=207;
/* 一段桌子的 10 個位子（背景圖座標）：避開正中間的向日葵 */
const SEATS=[175,350,525,690,1075,1240,1405,1570,1740,1895],SEAT_BOTTOM=462,PERSON_H=232;
const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');
const load=(src,cors)=>new Promise(ok=>{const im=new Image();if(cors)im.crossOrigin='anonymous';im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src});
let people=[],hits=[];
/* 上傳的人比較暗，調亮一點、偏暖，才搭這張明亮的桌子 */
function warm(im){try{const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){p[i]=Math.min(255,p[i]*1.3*.87+255*.13);p[i+1]=Math.min(255,p[i+1]*1.3*.87+205*.13);p[i+2]=Math.min(255,p[i+2]*1.3*.87+150*.13)}
  x.putImageData(d,0,0);return c}catch(e){return im}}
async function main(){
  let list=[];
  if(DEMO){list=Array.from({length:13},(_,i)=>({id:'demo'+i,n:['林○○','陳○○','王○○','張○○','李○○'][i%5],ch:'村民',msg:['感恩有你們一起吃飯！','謝謝老師陪我畫完第一幅畫','今年最開心的一天','謝謝家人一直支持我','感恩每一堂課'][i%5],cut:'catch-video/dinner/demo/p'+String(i%15+1).padStart(2,'0')+'.webp'}))}
  else{try{const r=await fetch(NOTIFY_URL+'/dinner/list');const j=await r.json();if(j.ok)list=j.list||[]}catch(e){$('#cnt').textContent='讀不到名單，請稍後再試'}}
  const [bg,fore]=await Promise.all([load('catch-video/dinner/table.jpg'),load('catch-video/dinner/fore.webp?v=2')]);
  const imgs=await Promise.all(list.map(x=>load(x.cut,!DEMO)));
  people=list.map((x,i)=>({...x,img:imgs[i]})).filter(x=>x.img);
  const segs=Math.max(1,Math.ceil(people.length/SEATS.length));
  cv.width=SEG_W*segs;cv.height=SEG_H;
  for(let s=0;s<segs;s++)ctx.drawImage(bg,s*SEG_W,0,SEG_W,SEG_H);
  hits=[];
  people.forEach((p,i)=>{const s=Math.floor(i/SEATS.length),x=s*SEG_W+SEATS[i%SEATS.length],h=PERSON_H*(0.97+((i*37)%7)/100),w=h*p.img.naturalWidth/p.img.naturalHeight;
    const src=warm(p.img);ctx.drawImage(src,x-w/2,SEAT_BOTTOM-h,w,h);hits.push({x0:x-w/2,x1:x+w/2,y0:SEAT_BOTTOM-h,y1:SEAT_BOTTOM,p})});
  for(let s=0;s<segs;s++)if(fore)ctx.drawImage(fore,s*SEG_W,FORE_TOP,SEG_W,SEG_H-FORE_TOP);   // 桌上的食物和桌巾蓋在人前面
  $('#cnt').textContent=people.length?('目前 '+people.length+' 位客人入座'+(DEMO?'（示範）':'')):'';
  $('#empty').hidden=!!people.length;
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width,x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k;
  const h=hits.slice().reverse().find(h=>x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1);if(!h){$('#pop').hidden=true;return}
  $('#pImg').src=h.p.img.src;$('#pQ').textContent='「'+(h.p.msg||'感恩有你們一起吃飯！')+'」';$('#pW').textContent=(h.p.n||'客人')+(h.p.ch?'・'+h.p.ch:'');$('#pop').hidden=false});
$('#pX').onclick=()=>{$('#pop').hidden=true};
main();
})();
</script>
</body>
</html>
