<meta charset="utf-8">

<style>
/* 版面：全螢幕淺色天空的小島，左上標題、下方三個分頁和一個動作鈕。色調沿用作品小屋的橄欖綠、砂岩和霧感天空，但更圓、更柔 */
:root{--sky1:#e2eee8;--sky2:#f4e8de;--ink:#294136;--ink2:#4c6656;--paper:#fffaf0;--line:rgba(41,65,54,.22);--gold:#e8b94a;color-scheme:light}
html,body{height:100%}
body{margin:0;background:#e2eee8;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
#game{position:fixed;inset:0;background:linear-gradient(#dfece6 0%,#eef0e6 55%,#f4e8de 100%)}
#game canvas{display:block;width:100%;height:100%;touch-action:none}
#head{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 18px;pointer-events:none}
#head{background:linear-gradient(rgba(226,238,232,.92) 55%,rgba(226,238,232,0))}
#back{pointer-events:auto;display:inline-block;color:var(--ink2);font-size:13px;font-weight:700;text-decoration:none;margin-bottom:4px}
#head h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:600;font-size:25px;letter-spacing:.14em}
#head em{display:block;font-family:"Cormorant Garamond",serif;font-size:19px;color:var(--ink2);margin-top:1px}
#capD{margin:8px 0 0;font-size:13.5px;line-height:1.55;max-width:30em;color:var(--ink2)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:9px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:15px;font-weight:700;color:var(--ink);background:rgba(255,250,240,.9);border:1.5px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:42px;box-shadow:0 2px 8px rgba(41,65,54,.1)}
button:hover{background:#fff}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.go{background:#e0682f;border-color:#e0682f;color:#fff}.go:hover{background:#cf5a24}
button:disabled{opacity:.5;cursor:default}
#food{position:absolute;left:0;right:0;bottom:100%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px 8px}
.fd{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:7px 13px;min-height:38px;border-radius:999px;background:#fffaf0;border:1.5px solid var(--line)}
.fd i{width:12px;height:12px;border-radius:50%;display:block}
#dest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(440px,100%)}
.dc{display:inline-flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;padding:8px 15px;min-height:40px;border-radius:999px;background:rgba(255,250,240,.96);border:1.5px solid var(--line)}
.dc .tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--gold);color:var(--ink);flex:none}
.dc.main{background:#e0682f;border-color:#e0682f;color:#fff}.dc.main:hover{background:#cf5a24}.dc.main .tag{background:#fff;color:#c24f1a}
.dc.feed{background:rgba(255,250,240,.7);font-weight:500}
.dc:disabled{opacity:.6}
#meter{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
#meter i{display:block;width:90px;height:8px;border-radius:5px;background:rgba(41,65,54,.15);overflow:hidden}
#meter u{display:block;height:100%;width:62%;background:var(--gold);text-decoration:none;transition:width .4s}
#card{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);transform:translateX(-50%);width:min(380px,calc(100% - 32px));background:var(--paper);border-radius:18px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 34px rgba(41,65,54,.28)}
#card img{width:92px;height:92px;border-radius:14px;object-fit:cover;flex:none}
#card h2{margin:0;font-size:21px;font-weight:900}
#card .chip{display:inline-block;margin-left:6px;font-size:12px;font-weight:700;background:var(--gold);border-radius:999px;padding:2px 9px;vertical-align:3px}
#card p{margin:5px 0 0;font-size:14px;line-height:1.55}
#card .x{position:absolute;right:6px;top:4px;min-height:32px;padding:0 9px;background:none;border:none;box-shadow:none;font-size:20px}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,0);background:rgba(41,65,54,.92);color:var(--paper);font-weight:700;font-size:15px;padding:9px 18px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,-8px)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>

<div id="game"></div>
<div id="head"><a id="back" href="park.html?v=20261005zd">← 回遊戲</a><h1>OTTO2 吉祥物島</h1><em>little friends of the classroom</em><p id="capD"></p></div>
<div id="bar">
  <div id="food" hidden role="group" aria-label="選食物"></div>

</div>
<div id="card" hidden><button class="x" aria-label="關閉">×</button><img id="cImg" alt=""><div><h2><span id="cName"></span><span class="chip" id="cRole"></span></h2><p id="cLine"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const IMG={kabu:'pets/kabu.webp',gabi:'pets/gabi.webp',moka:'pets/moka.webp'};const PARK='park.html?v=20261005zd';
const $=id=>document.getElementById(id);
if(!window.THREE){$('err').style.display='flex';return}
const V3=THREE.Vector3;

const PETS={
  gabi:{name:'嘎逼',role:'老大',body:'#e39a3a',face:'#7a4a2c',top:'#eba84a',capLen:1.42,ear:'#f0b3a0',rump:'#7a4a2c',line:'沒人看的時候就趴著睡。只要有菜吃，一定第一個衝到。'},
  kabu:{name:'卡布',role:'最無害',body:'#eba643',ear:'#f0b3a0',patch:'#fff7e6',line:'最笨的一隻，不會咬人。常常跑錯方向，吃得最慢。'},
  moka:{name:'摩卡',role:'長毛・躲貓貓',body:'#52463c',face:'#43382f',top:'#a69d92',capLen:.8,ear:'#6a574b',hair:'#7a7064',backc:'#615549',long:true,line:'吃飯也會搶，可是最會躲。躲在小屋後面看大家抓卡布和嘎逼。'}
};

/* ---------- renderer / 材質：低面數、平面著色，邊角再用抖動磨出一點不規則 ---------- */
let renderer,scene,camera;
try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){$('err').style.display='flex';return}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));$('game').appendChild(renderer.domElement);
scene=new THREE.Scene();scene.fog=new THREE.Fog(0xeaf0ea,34,100);camera=new THREE.PerspectiveCamera(36,1,.1,300);
scene.add(new THREE.HemisphereLight(0xf4f8ff,0xa9b99a,.6));
const sun=new THREE.DirectionalLight(0xfff0d8,.5);sun.position.set(-6,14,9);scene.add(sun);
const hash=(x,y,z)=>{const s=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return s-Math.floor(s)-.5};
function fl(g,j){if(j){const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);p.setXYZ(i,x+hash(x,y,z)*j,y+hash(y,z,x)*j,z+hash(z,x,y)*j)}}g=g.toNonIndexed();g.computeVertexNormals();return g}
const lam=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const mesh=(g,m,x,y,z)=>{const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);return o};
const SGf=(r,w,h,a,b,c,d,j)=>fl(new THREE.SphereGeometry(r,w||12,h||8,a,b,c,d),j);
const ICO=(r,d,j)=>fl(new THREE.IcosahedronGeometry(r,d===undefined?1:d),j);
const CYL=(a,b,h,s,j)=>fl(new THREE.CylinderGeometry(a,b,h,s||10),j);
const CON=(r,h,s,j)=>fl(new THREE.ConeGeometry(r,h,s||8),j);
const BOX=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const GR={g1:'#7fa65a',g2:'#68914a',g3:'#92b866',sand:'#e0c98e',rock:'#b39366',deep:'#85704e',wood:'#b07a45',wood2:'#8b5e34',cream:'#f7ecd2',roof:'#e0723a',blush:'#f2d4cf'};

/* ---------- 天竺鼠（圓頭、大眼、柔和稜面） ---------- */
function cavyHead(p){
  const k=1.11,g=new THREE.Group(),fc=p.face||p.body;
  const head=mesh(SGf(.36*k,14,10),lam(fc));head.scale.set(1,.95,1.06);g.add(head);
  if(p.top){const cap=mesh(SGf(.366*k,14,8,0,Math.PI*2,0,p.capLen||1.12),lam(p.top));cap.scale.copy(head.scale);g.add(cap)}
  if(p.id==='gabi'){const bl=mesh(SGf(.08*k,8,6),lam('#ffffff'),0,.262*k,.252*k);bl.scale.set(.55,.22,1.7);bl.rotation.x=.7;g.add(bl)}
  const eyes=new THREE.Group();g.add(eyes);
  [-1,1].forEach(d=>{eyes.add(mesh(new THREE.SphereGeometry(.068,12,10),lam('#16110f'),d*.19,.05,.345));eyes.add(mesh(new THREE.SphereGeometry(.024,8,6),new THREE.MeshBasicMaterial({color:0xffffff}),d*.19+.022,.085,.405))});
  g.add(mesh(new THREE.SphereGeometry(.05,10,8),lam('#e8908e'),0,-.1,.415));
  [-1,1].forEach(d=>{const c=mesh(new THREE.CircleGeometry(.05,10),new THREE.MeshBasicMaterial({color:0xf49a9a,transparent:true,opacity:.5}),d*.27,-.06,.31);c.rotation.y=d*.8;g.add(c)});
  [-1,1].forEach(d=>{const e=mesh(SGf(.12*k,9,7),lam(p.ear),d*.29,.21,-.03);e.scale.set(1,.85,.4);e.rotation.z=d*-.7;e.rotation.y=d*.5;g.add(e)});
  g.userData.eyes=eyes;return g}
function makeZzz(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  x.fillStyle='#294136';x.font='900 70px "Noto Sans TC",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('Z',50,80);x.font='900 44px "Noto Sans TC",sans-serif';x.fillText('z',92,40);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));s.scale.set(.6,.6,1);return s}
function makeCavy(id){
  const p=PETS[id];p.id=id;const g=new THREE.Group();
  const body=mesh(SGf(.46,14,10),lam(p.body),0,.4,-.06);body.scale.set(.92,.82,1.18);g.add(body);
  if(p.patch){const pt=mesh(SGf(.28,10,7),lam(p.patch),0,.7,-.1);pt.scale.set(.95,.4,1.25);g.add(pt)}
  if(p.rump){const r=mesh(SGf(.3,10,8),lam(p.rump),0,.44,-.46);r.scale.set(1.05,.9,.85);g.add(r)}
  if(p.long){
    const sk=mesh(SGf(.48,14,8),lam(p.hair),0,.22,-.12);sk.scale.set(1.25,.46,1.5);g.add(sk);
    const back=mesh(SGf(.49,14,8,0,Math.PI*2,0,1.25),lam(p.backc),0,.4,-.08);back.scale.set(.95,.82,1.25);g.add(back);
    const tail=mesh(SGf(.28,10,8),lam(p.hair),0,.3,-.74);tail.scale.set(1,.7,.8);g.add(tail)}
  const head=cavyHead(p);head.position.set(0,.48,.5);g.add(head);
  const feet=[];[[-.2,.32],[.2,.32],[-.23,-.32],[.23,-.32]].forEach(([x,z])=>{const f=mesh(SGf(.08,8,6),lam('#d9b49a'),x,.07,z);f.scale.set(1,.6,1.35);g.add(f);feet.push(f)});
  const sh=new THREE.Mesh(new THREE.CircleGeometry(.6,16),new THREE.MeshBasicMaterial({color:0x294136,transparent:true,opacity:.16,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.position.y=.012;sh.scale.set(1,1.25,1);g.add(sh);
  const zzz=makeZzz();zzz.position.set(.2,1.4,.5);zzz.visible=false;g.add(zzz);
  Object.assign(g.userData,{id,head,eyes:head.userData.eyes,feet,body,zzz});return g}

/* 比例參考：畢卡索公仔（高約 1.3），三隻都要比他矮 */
function makeFigure(){const g=new THREE.Group();
  const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');for(let i=0;i<8;i++){x.fillStyle=i%2?'#fff':'#2b3a4a';x.fillRect(0,i*8,64,8)}const st=new THREE.CanvasTexture(c);
  g.add(mesh(CYL(.2,.24,.4,10),lam('#ffffff',{map:st}),0,.52,0));
  [-1,1].forEach(d=>g.add(mesh(CYL(.07,.075,.34,7),lam('#2b2b2b'),d*.1,.17,0)));
  [-1,1].forEach(d=>{const a=mesh(CYL(.055,.06,.3,7),lam('#ffffff',{map:st}),d*.26,.55,0);a.rotation.z=d*.25;g.add(a)});
  const h=mesh(SGf(.38,14,10),lam('#f2c9a8'),0,1.0,0);h.scale.set(1,1.04,.95);g.add(h);
  [-1,1].forEach(d=>{const hr=mesh(SGf(.14,8,6),lam('#f4efe6'),d*.33,1.04,-.03);hr.scale.set(.75,1.25,1.1);g.add(hr);
    g.add(mesh(new THREE.SphereGeometry(.06,10,8),lam('#fff'),d*.12,1.04,.34),mesh(new THREE.SphereGeometry(.028,8,6),lam('#111'),d*.12,1.04,.39))});
  g.add(mesh(new THREE.SphereGeometry(.035,8,6),lam('#f4a19a'),0,.94,.37));
  const dv=new THREE.Group();dv.add(mesh(SGf(.13,8,6),lam('#fff'),0,0,0),mesh(SGf(.07,8,6),lam('#fff'),.1,.07,0));dv.position.set(0,1.42,0);g.add(dv);return g}

/* ---------- 島：圓潤的砂岩懸崖＋草地＋小窩 ---------- */
const world=new THREE.Group();scene.add(world);
function islandBase(R,cx,cz,tint){
  const g=new THREE.Group();g.position.set(cx,0,cz);
  const L=(pts,col,j)=>{const geo=fl(new THREE.LatheGeometry(pts.map(a=>new THREE.Vector2(a[0]*R,a[1])),20),j||.12);const m=new THREE.Mesh(geo,lam(col,{side:THREE.DoubleSide}));g.add(m)};
  L([[0,0],[.9,0],[.98,-.28],[.99,-.52]],tint||GR.g1,.06);
  L([[.99,-.52],[1,-1.2],[.92,-1.9]],GR.sand);
  L([[.92,-1.9],[.8,-2.8],[.6,-3.6]],GR.rock);
  L([[.6,-3.6],[.38,-4.5],[.12,-5.2],[0,-5.4]],GR.deep);
  return g}
function lpTree(kind,s){const g=new THREE.Group();g.add(mesh(CYL(.12,.2,1.1,6),lam(GR.wood2),0,.55,0));
  if(kind==='pine'){[[1.0,1.2,1.2],[.78,1.1,1.95],[.52,.95,2.65]].forEach(([r,h,y],i)=>g.add(mesh(CON(r,h,8,.05),lam(i%2?'#6c9448':'#5d853d'),0,y,0)))}
  else{const cols=kind==='blossom'?['#f2d4cf','#f7e2dd','#ecc3bf']:['#7fae52','#93c062','#6f9a4a'];
    [[0,1.6,0,.95],[-.5,1.35,.25,.62],[.5,1.4,-.2,.66]].forEach(([x,y,z,r],i)=>{const c=mesh(ICO(r,1,.1),lam(cols[i%3]),x,y,z);c.scale.y=.88;g.add(c)})}
  g.scale.setScalar(s||1);return g}
function rock(r){return mesh(ICO(r,0,.08),lam('#d9ccb0'),0,r*.45,0)}
function flowers(g,n,R,rng){const cols=['#ffd36a','#ff9ac0','#ffffff','#a9d4ff','#ffb27a'];for(let i=0;i<n;i++){const a=rng()*6.28,d=Math.sqrt(rng())*R*.86,f=mesh(new THREE.OctahedronGeometry(.1),lam(cols[i%5]),Math.cos(a)*d,.1,Math.sin(a)*d);f.rotation.set(rng()*3,rng()*3,0);g.add(f)}}
let seed=7;const rng=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function signTex(txt,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#e9c98f';x.fillRect(0,0,w,h);x.strokeStyle='#8b5e34';x.lineWidth=8;x.strokeRect(4,4,w-8,h-8);x.fillStyle='#4a2f17';x.font='900 '+Math.floor(h*.5)+'px "Noto Sans TC",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,h/2+4);return new THREE.CanvasTexture(c)}
function sign(txt,w,h,flip){const g=new THREE.Group();g.add(mesh(CYL(.06,.07,1.4,6),lam(GR.wood2),0,.7,0));
  const b=mesh(BOX(w,h,.08),[lam(GR.wood),lam(GR.wood),lam(GR.wood),lam(GR.wood),new THREE.MeshLambertMaterial({map:signTex(txt,256,Math.round(256*h/w))}),lam(GR.wood)],0,1.35,0);g.add(b);return g}

/* 吉祥物島 */
const HOME=islandBase(7,0,0);world.add(HOME);
[[-1.5,1.6,.9,.12],[3.4,-1.6,1.2,.1],[-4.4,-1.8,1.1,.1],[2.4,3.6,1.0,.1]].forEach(([x,z,r,h])=>{const m=mesh(ICO(r,2,.05),lam(GR.g3),x,0,z);m.scale.y=h/ r*1.0+.12;HOME.add(m)});
function makeHut(){const g=new THREE.Group();
  g.add(mesh(CYL(1.35,1.45,1.5,10,.04),lam(GR.cream),0,.75,0));
  g.add(mesh(CON(1.85,1.5,10,.05),lam(GR.roof),0,2.2,0));
  g.add(mesh(CYL(.12,.14,.7,6),lam('#9a8058'),.8,2.7,-.2));
  g.add(mesh(BOX(.75,1.0,.12),lam('#7a4a2c'),0,.5,1.36));
  g.add(mesh(new THREE.SphereGeometry(.05,8,6),lam('#f2c14e'),.2,.5,1.44));
  [-1,1].forEach(d=>{const w=mesh(new THREE.CylinderGeometry(.24,.24,.1,12),lam('#bfe3f2'),d*.9,.95,1.15);w.rotation.x=Math.PI/2;w.rotation.z=0;w.rotation.y=0;g.add(w)});
  const sg=sign('毛孩之家',1.5,.55);sg.scale.setScalar(.65);sg.position.set(-1.5,0,1.5);g.add(sg);return g}
const HUT=makeHut();HUT.position.set(0,0,-2.3);HOME.add(HUT);
[[-4.6,-3.2,'pine',1.0],[-5.4,.4,'blossom',.95],[4.8,-2.8,'round',1.05],[5.0,1.8,'pine',.85],[-2.6,-4.6,'round',.9],[2.4,-4.8,'blossom',.9],[-4.6,3.2,'round',.8]].forEach(([x,z,k,s])=>{const t=lpTree(k,s);t.position.set(x,0,z);t.rotation.y=x;HOME.add(t)});
[[3.7,2.6,.45],[-3.2,2.9,.35],[5.5,-.4,.4],[-1.8,-5.0,.35]].forEach(([x,z,r])=>{const k=rock(r);k.position.x=x;k.position.z=z;HOME.add(k)});
flowers(HOME,70,6.4,rng);
{ // 菜圃
  const g=new THREE.Group();g.position.set(-3.3,0,.9);g.add(mesh(BOX(2.2,.14,1.5),lam('#8a6038'),0,.07,0));
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){const x=-.75+c*.5,z=-.45+r*.45;g.add(mesh(ICO(.17,0,.03),lam(r===1?'#f08a2f':'#6fae4a'),x,.22,z));if(r===1)g.add(mesh(CON(.06,.22,5),lam('#f08a2f'),x,.12,z).translateY(-.05))}

    if(o.dis)b.disabled=true;else b.addEventListener('click',()=>go(k));box.appendChild(b)};
  if(CUR!=='none')add(CUR,{main:true,tag:'本月'});
  if(ART_PUBLIC||adm)add('art',{tag:ART_PUBLIC?'常駐':'示範',main:CUR==='none'});
  else add('art',{dis:true,sfx:'・準備中'});
  if(adm){const other=CUR==='gacha'?'xmas':CUR==='xmas'?'gacha':null;
    if(other)add(other,{tag:'管理者'});else{add('gacha',{tag:'管理者'});add('xmas',{tag:'管理者'})}}
  const f=document.createElement('button');f.type='button';f.id='fFeed';f.className='dc feed';f.textContent='餵食';f.addEventListener('click',feedNext);box.appendChild(f);updateUI()}
renderDest();
(async()=>{try{const c=new AbortController(),t=setTimeout(()=>c.abort(),2500);const r=await fetch(NOTIFY+'/xmas/info',{signal:c.signal});clearTimeout(t);const j=await r.json();if(j&&j.ok&&j.status==='on'&&CUR!=='xmas'){CUR='xmas';renderDest()}}catch(e){}})();
window.__dbg={pets,cross,feed,setMode,get loc(){return loc}};
})();
</script>
