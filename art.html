<style>

.bottom{display:flex; flex-direction:column; align-items:center; gap:9px}
.btns{display:grid; grid-template-columns:repeat(4,auto); gap:8px; justify-content:center}
@media (max-width:420px){.btns{grid-template-columns:repeat(2,1fr); width:100%}}
.pill{font-family:var(--sans); font-size:15px; font-weight:500; letter-spacing:.08em; color:var(--ink); background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line); border-radius:99px; padding:11px 18px; cursor:pointer; box-shadow:0 6px 22px rgba(40,70,90,.14); white-space:nowrap}
.pill.main{background:var(--accent); color:#fff; border-color:transparent}

.sheet{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 16px); width:min(380px,calc(100% - 32px)); background:rgba(255,255,255,.88); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line); border-radius:22px; padding:16px 18px; box-shadow:0 16px 44px rgba(40,70,90,.2); z-index:3}

.sheet p{margin:8px 0 12px; font-size:14px; line-height:1.7; color:var(--ink2)}
.sheet .row{display:flex; gap:8px}
.sheet .row .pill{flex:1; box-shadow:none; padding:9px 8px; font-size:14px}
/* 2026-10-05 大熊：按鈕多了（天竺鼠＋青蛙）一排擠不下、最後一顆被切掉，卡片下面還空一條 → 卡片貼齊螢幕底、按鈕縮小可換行（一排最多三顆） */
.sheet{box-sizing:border-box; bottom:0; width:min(480px,100%); border-radius:22px 22px 0 0; border-bottom:0; padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}

.drawer{position:fixed; left:0; right:0; bottom:0; max-height:46vh; overflow:auto; background:var(--cream); border-top:1px solid var(--line); border-radius:22px 22px 0 0; padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 12px); z-index:6; box-shadow:0 -10px 40px rgba(40,70,90,.18)}
.drawer[hidden]{display:none}
/* 服裝衣櫥（2026-10-29） */
.clrow{display:flex; flex-wrap:wrap; gap:7px; margin:4px 0}.clrow>span{width:100%; font-size:12px; color:var(--ink2); margin-top:2px}
.cli{flex:0 0 calc((100% - 14px)/3); box-sizing:border-box; font:inherit; font-size:12px; line-height:1.2; padding:8px 4px; border-radius:12px; border:2px solid #e4d9c4; background:#fff; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:13.5px; line-height:1.35}
.cli i{font-style:normal; font-size:18px}.cli small{font-size:10.5px; color:#a0703c}.cli.on{border-color:#2f8f58; background:#eaf7ee}.cli.sel{border-color:#d63a2f; background:#ffecea}
.drawer h3{margin:12px 0 4px; font-size:14px; letter-spacing:.06em; color:var(--ink)}.drawer h3:first-child{margin-top:0}

.dsw{display:flex; flex-wrap:wrap; gap:10px; margin:6px 0 4px}

.dch{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px}
.dch button{min-width:44px; min-height:38px; padding:0 10px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-size:13.5px; cursor:pointer}

.drawer .acts{display:flex; gap:8px; justify-content:center; margin-top:14px}
.drawer .acts.stick{position:sticky; bottom:calc(-12px - env(safe-area-inset-bottom,0px)); background:var(--cream); margin:10px -16px 0; padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px); border-top:1px solid var(--line); flex-wrap:wrap} /* 2026-10-30 衣櫥：買下按鈕固定在底部，不用滑到最下面才看得到 */
.modal{position:fixed; inset:0; background:rgba(214,232,242,.55); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:grid; place-items:center; padding:16px; z-index:5}
.panel{width:min(420px,100%); max-height:calc(100% - 16px); overflow:auto; background:var(--cream); border:1px solid var(--line); border-radius:24px; padding:22px 20px 18px; box-shadow:0 22px 60px rgba(40,70,90,.22)}
.panel h2{margin:0 0 4px; font-family:var(--serif); font-weight:600; font-size:21px; letter-spacing:.08em; text-align:center}
.panel .meta{margin:0 0 14px; font-size:13px; color:var(--ink2); text-align:center}
.panel p{margin:0 0 14px; font-size:14px; line-height:1.75; color:var(--ink2); text-align:center}

.panel input[type=text],.panel input[type=tel],.panel select{width:100%; box-sizing:border-box; font-family:var(--sans); font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink)}
.panel .acts{display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap}
.panel .pill{box-shadow:none}

.panel > .acts:last-child{position:sticky; bottom:-18px; margin:16px -20px -18px; padding:12px 20px 14px; background:linear-gradient(rgba(251,246,236,0),var(--cream) 24%); border-radius:0 0 24px 24px; z-index:2}

.styles{display:flex; gap:6px}.styles .pill{flex:1; padding:9px 6px; font-size:14px}.panel p.sdesc{margin:6px 0 0; font-size:13px; text-align:left}

function saidHtml(A){const L=[];G.members.forEach(m=>m.works.forEach(w=>{if(w.cm&&w.cm.a===A.n)L.push({m,w})}));

  return`<div class="asaid"><h3>我留過的話（${L.length}）</h3><div class="list">${L.slice(0,30).map(({m,w})=>`<button type="button" data-h="${esc(m.id)}" data-w="${esc(w.id)}"><img alt="" src="${w.img||''}"><span><small>🏠 ${esc(m.name)}${w.title?'・'+esc(w.title):''}</small>${esc(w.cm.t)}</span></button>`).join('')}</div></div>`}

  im.onload=()=>{try{const sc=Math.min(1,1280/Math.max(im.width,im.height)),c=cvs(Math.round(im.width*sc),Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const ts=Math.min(1,360/Math.max(c.width,c.height)),t=cvs(Math.round(c.width*ts),Math.round(c.height*ts));t.getContext('2d').drawImage(c,0,0,t.width,t.height);
    URL.revokeObjectURL(u);res({data:c.toDataURL('image/jpeg',.8),thumb:t.toDataURL('image/jpeg',.76)})}catch(e){URL.revokeObjectURL(u);rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function fileTo(file,size,q=.82){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,size/Math.max(im.width,im.height)),c=cvs(Math.round(im.width*sc),Math.round(im.height*sc));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

  try{if(!ssTok()&&window.liff){await Promise.race([liff.init({liffId:LIFF_ID}),sleep(4000)])}}catch(e){}
  if(!token()){ME={ok:false,err:'請從 LINE 的 OTTO2 預約頁打開作品小屋，才能搬家、上傳'};return}
  try{const j=await api('/island/me');ME=Object.assign({ok:true},j);if(G)G.me=j.house}catch(e){ME={ok:false,err:e.message}}}
/* 訪客版資料：guest-island.json 是 2026-10-24 拍的快照（圖片直接從 Cloudinary 讀），讀不到就用全假的示範島 */
async function guestData(){try{const j=await fetch('guest-island.json?v=20261024g').then(r=>r.json());
  return{members:j.houses.map((h,i)=>{const last=(h.works[h.works.length-1]||{}).date||'2026/10';
    return{id:'g'+i,name:h.name,style:h.style,since:h.since,staff:!!h.staff,look:h.look||null,pet:h.pet||null,frog:h.frog||null,
      works:Array.from({length:h.n},(_,k)=>k<h.works.length?Object.assign({rx:{l:0,h:0,f:0}},h.works[k]):{seed:i*50+k+1,title:TITLES[(i+k)%12],date:last,by:'本人'})}}),
    album:demoData().album,me:null}}catch(e){return demoData()}}
function save(){if(!DEMO||window.GUEST)return;try{localStorage.setItem('otto2-island-v5',JSON.stringify(G))}catch(e){toast('手機空間不夠，示範版存不下更多照片')}}
async function start(data){
  G=null;
  if(window.GUEST){G=await guestData();ME={ok:false,staff:false,err:'體驗版'}} /* 訪客體驗版：真的小屋、名字遮掉，只放每間第一層（最早 4 件）的真作品，其他是程式畫的；讀 guest-island.json，不連伺服器 */
  else if(DEMO){G=data&&data.members&&data.album?data:null;
    if(!G){try{G=JSON.parse(localStorage.getItem('otto2-island-v5'))}catch(e){}}
    if(!G||!G.members||!G.album)G=demoData();ME={ok:true,staff:true}}
  else{let err;for(let k=0;k<3&&!G;k++){try{await reload()}catch(e){err=e;await sleep(1200)}}
    if(!G)throw new Error('連不上作品小屋，請稍後重新打開');whoAmI().then(()=>{gpRemember();if(ME.back)setTimeout(()=>gpCameBack(ME.back),1800);else{const mm=G.members.find(x=>x.id===G.me);setTimeout(mm&&mm.away&&mm.away.s==='storm'?gpStormAsk:gpAsk,1500)}setTimeout(gpGuests,2600)})}
  try{await Promise.race([document.fonts.load('20px "Noto Serif TC"'),sleep(2500)])}catch(e){}
  build();rebuildHouses();try{balMgr()&&BM.set(Anniv26.def26(),{today:''})}catch(e){}balLoad();setInterval(()=>{if(!document.hidden)balLoad()},600000);
  const g=camGoal();camPos.copy(g.pos);look.copy(g.at);
  $('loading').hidden=true;$('hud').hidden=false;requestAnimationFrame(loop);window.__islandReady=true;if(/[?&]hall=1/.test(location.search))walkIntoHall(true);   /* art.html?hall=1：先停在萬神殿門口，再走進大廳（分享連結、其他島的第五格） */try{tripSpawn()}catch(e){console.warn('trip',e)}
  const c=cvEl();c.addEventListener('pointerdown',onDown);c.addEventListener('pointermove',onMove);c.addEventListener('pointerup',onUp);c.addEventListener('pointercancel',onUp);
  c.addEventListener('wheel',e=>{zoom=Math.max(.5,Math.min(1.3,zoom+e.deltaY*.0008));idleT=0;e.preventDefault()},{passive:false});
  if(location.hash==='#album')setTimeout(openAlbum,800);
  window.claude?.hot?.snapshot?.(()=>G);
}
$('myBtn').onclick=()=>{if(window.GUEST){GuestCTA('house');return}const mine=G.members.find(m=>m.id===G.me);if(mine){openHouseSheet(mine)} /* 2026-10-29 大熊：先停在「大熊的小屋」卡片，要看作品再按「走進小屋」 */else if(!DEMO&&!ME.ok)toast(ME.err||'正在確認你的 LINE 身分，請稍等一下');else joinPanel()};
$('lbDel').onclick=async()=>{if(!lb||!lb.del)return;const w=lb.list[lb.i];if(!confirm('確定要刪除這張照片嗎？刪了就找不回來。'))return;
  try{await api('/island/delete',Object.assign({id:w.id},lb.del));await reload();$('lb').hidden=true;closeModal();rebuildHouses();toast('刪除了')}catch(e){toast(e.message)}};
/* 2026-10-24 作品小屋背景音樂〈畫室午後〉：跟遊樂島共用靜音設定（otto2-park-mute），第一次點畫面才會出聲（iPhone 規定） */
(function(){if(!window.OttoBGM)return;let ctx=null,on=true;try{on=localStorage.getItem('otto2-park-mute')!=='1'}catch(e){}
  const wake=()=>{try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running'){const p=ctx.resume();if(p&&p.catch)p.catch(()=>{})}}catch(e){}};
  ['pointerdown','touchend','click'].forEach(ev=>addEventListener(ev,wake,{passive:true,capture:true}));
  OttoBGM.init(()=>ctx);
  const ON='<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/></svg></i>音樂',
        OFF='<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="16.5" cy="16" r="2.5" fill="currentColor"/><path d="M3 3l18 18"/></svg></i>靜音';
  const b=document.getElementById('bgmBtn'),look=()=>{if(b){b.innerHTML=on?ON:OFF;b.setAttribute('aria-label',on?'關掉音樂':'打開音樂')}};
  if(b)b.onclick=()=>{on=!on;try{localStorage.setItem('otto2-park-mute',on?'0':'1')}catch(e){}look()};look();
  setInterval(()=>OttoBGM.update('art',on&&!!ctx&&!window.storyOn,false),250)})();
$('findBtn').onclick=findHouse;$('plHall').onclick=()=>{if(hallG)walkIntoHall()};$('upBtn').onclick=window.GUEST?()=>GuestCTA('house'):upPanel;$('albumBtn').onclick=openAlbum;$('tourBtn').onclick=tour;$('homeBtn').onclick=()=>{const u='park.html?v=20261013c';window.Ferry?Ferry.go({to:u,place:'park',from:'art'}):location.href=u};$('plPark').onclick=()=>{const u='park.html?v=20261013c&isl=oct';window.Ferry?Ferry.go({to:u,place:'park',from:'art'}):location.href=u}; /* 2026-10-07 四個分頁：扭蛋島／走格子島／吉祥物島／作品小屋 */$('plWalk').onclick=()=>{const u='park.html?v=20261013c&isl=walk';window.Ferry?Ferry.go({to:u,place:'park',from:'art'}):location.href=u};
$('plMascot').onclick=()=>{const u='park.html?v=20261013c&isl=mascot';window.Ferry?Ferry.go({to:u,place:'park',from:'art'}):location.href=u}; /* 吉祥物島在遊樂島裡面，回去後自動開 */$('tourStop').onclick=stopTour;$('sX').onclick=closeSheet;
$('lbX').onclick=()=>$('lb').hidden=true;
/* 2026-10-05 大熊：看作品時按 LINE 左上角返回會直接回扭蛋機 → 開視窗時塞一筆歷史，按返回只關最上層的視窗 */
function armBack(){try{if(!(history.state&&history.state.otOv))history.pushState({otOv:1},'')}catch(e){}}
const anyOv=()=>!$('lb').hidden||!$('modal').hidden||!$('sheet').hidden||!$('drawer').hidden;
new MutationObserver(()=>{if(anyOv())armBack()}).observe(document.body,{subtree:true,attributes:true,attributeFilter:['hidden']});
addEventListener('popstate',()=>{if(!$('lb').hidden)$('lb').hidden=true;else if(!$('drawer').hidden){closeLook(true);focus=null}else if(!$('modal').hidden){closeModal();focus=null}else if(!$('sheet').hidden)closeSheet();else{history.back();return}
  if(anyOv())armBack()});
/* 作品上傳後可以再改名稱（2026-10-05 大熊要的）：屋主改自己家、老師改任何一間和大樹相簿 */
$('lbRen').onclick=async()=>{if(!lb||!lb.del)return;const w=lb.list[lb.i];const t=prompt('作品名稱（最多 14 個字，空白就是不取名）',w.title&&w.title!=='作品'&&w.title!=='上課花絮'?w.title:'');if(t===null)return;
  const title=t.trim().slice(0,14);try{await api('/island/retitle',Object.assign({id:w.id,title},lb.del));w.title=title;openList(lb.list,lb.i,lb.label,lb.del,lb.house);toast(title?'改好了':'名稱拿掉了');reload().catch(()=>{})}catch(e){toast(e.message)}};
$('lbPrev').onclick=()=>{if(lb)openList(lb.list,(lb.i-1+lb.list.length)%lb.list.length,lb.label,lb.del,lb.house)};
$('lbNext').onclick=()=>{if(lb)openList(lb.list,(lb.i+1)%lb.list.length,lb.label,lb.del,lb.house)};
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('lb').hidden)$('lb').hidden=true;else if(!$('drawer').hidden)closeLook(true);else if(!$('modal').hidden)closeModal();else if(touring)stopTour();else if(!$('sheet').hidden)closeSheet()}});
function safeStart(d){return start(d).catch(err=>{console.error(err);$('loading').textContent='畫面載入失敗：'+(err&&err.message||err)+'（請截圖給我）'})}
window.claude?.hot?.ready?window.claude.hot.ready(safeStart):safeStart(window.claude?.hot?.data??{});
</script>
