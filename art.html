<style>
:root{
  --ink:#2f3a34; --ink2:#5d6a62; --line:rgba(47,58,52,.14); --glass:rgba(255,255,252,.74); --accent:#c07a45; --cream:#fbf8f0;

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const RM=false; /* 跟遊戲一致：不管手機有沒有開「減少動態效果」，動畫照常播 */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cvs=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400)}
function rng(seed){seed=Math.abs(Math.floor(seed))%2147483647||1;return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const fbm=(x,y)=>vnoise(x,y)*.6+vnoise(x*2.1,y*2.1)*.28+vnoise(x*4.3,y*4.3)*.12;
const smooth=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};

/* ================= island shape ================= */
const R0=22,K=R0/15,PIER_A=2.35;   // K: how much bigger than the first island
const outline=th=>R0*(1+.06*Math.sin(3*th+.5)+.04*Math.sin(5*th+1.3)+.02*Math.sin(7*th+2.1));
// two sunken lakes that spill over the rim as waterfalls, like the reference
const PONDS=[{a:.32,d:.6,r:3.4},{a:1.72,d:.6,r:3.2}].map(p=>Object.assign(p,{x:Math.cos(p.a)*R0*p.d,z:Math.sin(p.a)*R0*p.d}));
// winding footpaths from the big tree out to the island's corners
const PATHS=[[[0,3.6],[2.6,5.8],[3.4,8.4],[4.6,11.2]],[[3.5,-1],[6.2,-2.8],[8.4,-5.8],[9.8,-8.6]],[[-3.3,1.6],[-6.2,2.2],[-8.8,4.4],[-10.8,6.4]],
  [[-1,-3.5],[-2.8,-6.6],[-5.8,-8.8],[-7.4,-11]],[[3.3,1.4],[5.2,3.8],[5.9,5.6]],[[-2.4,2.8],[-3.6,5.4],[-4.2,7.4]]].map(P=>P.map((q,i)=>i?[q[0]*K,q[1]*K]:q));
function segDist(x,z,a,b){const dx=b[0]-a[0],dz=b[1]-a[1],t=Math.max(0,Math.min(1,((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz)));return Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t)}
function pathDist(x,z){let m=1e9;PATHS.forEach(P=>{for(let i=0;i<P.length-1;i++)m=Math.min(m,segDist(x,z,P[i],P[i+1]))});return m}
function channel(p,x,z){const ux=Math.cos(p.a),uz=Math.sin(p.a),rx=x-p.x,rz=z-p.z,t=rx*ux+rz*uz;if(t<0)return 1e9;return Math.abs(-rx*uz+rz*ux)}
function heightAt(x,z){
  const r=Math.hypot(x,z),th=Math.atan2(z,x),e=r/outline(th);
  let h=1.2*(1-e*e)+(fbm(x*.1+10,z*.1+3)-.45)*1.8*smooth(4,6.5,r);
  let notch=0;PONDS.forEach(p=>{notch=Math.max(notch,smooth(2.2,1,channel(p,x,z)))});
  h-=smooth(.86,1.02,e)*1.0*(1-notch);                            // rounded shoulder, except where the water leaves
  const plaza=smooth(3.8,2.8,r);h=h*(1-plaza)+1.4*plaza;
  let dip=0;PONDS.forEach(p=>{const d=Math.hypot(x-p.x,z-p.z);dip=Math.max(dip,smooth(p.r+1.1,p.r*.35,d)*1.6,smooth(1.2,.35,channel(p,x,z))*smooth(p.r*.4,p.r,Math.hypot(x-p.x,z-p.z))*1.05)});
  h-=dip;
  if(pathDist(x,z)<.6)h-=.04;
  return h}
PONDS.forEach(p=>{p.wy=heightAt(p.x,p.z)+1.05});
const inPond=(x,z,m=0)=>PONDS.some(p=>Math.hypot(x-p.x,z-p.z)<p.r+m||(channel(p,x,z)<1+m&&Math.hypot(x-p.x,z-p.z)>0&&((x-p.x)*Math.cos(p.a)+(z-p.z)*Math.sin(p.a))>0));
function onIsland(x,z,m=.9){return Math.hypot(x,z)<outline(Math.atan2(z,x))*m}

/* ================= materials: soft, rounded, painterly ================= */
const gradMap=(()=>{const t=new THREE.DataTexture(new Uint8Array([120,176,222,255]),4,1,THREE.LuminanceFormat);t.minFilter=t.magFilter=THREE.LinearFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
const MATS=new Map();
const toon=(c,extra)=>{if(!extra){if(MATS.has(c))return MATS.get(c);const m=new THREE.MeshLambertMaterial({color:c});MATS.set(c,m);return m}return new THREE.MeshLambertMaterial(Object.assign({color:c},extra))};
const SPH=new THREE.SphereGeometry(1,24,16),SPH_LO=new THREE.SphereGeometry(1,12,9);
function ball(c,r,x=0,y=0,z=0,sx=1,sy=1,sz=1,lo){const m=new THREE.Mesh(lo?SPH_LO:SPH,toon(c));m.position.set(x,y,z);m.scale.set(r*sx,r*sy,r*sz);m.castShadow=r>=.14;return m}
function cyl(c,r1,r2,h,x=0,y=0,z=0,seg=16){const g=new THREE.CylinderGeometry(r1,r2,h,seg);g.translate(0,h/2,0);const m=new THREE.Mesh(g,toon(c));m.position.set(x,y,z);m.castShadow=Math.max(r1,r2)>.06;return m}
// faceted low-poly pieces (big tree, rocks): flat shading + jittered vertices
const LPM=new Map();const lam=c=>LPM.get(c)||LPM.set(c,new THREE.MeshLambertMaterial({color:c,flatShading:true})).get(c);
function jitterGeo(g,amt,seed){const p=g.attributes.position,r=rng(seed),map=new Map();
  for(let i=0;i<p.count;i++){const k=p.getX(i).toFixed(3)+','+p.getY(i).toFixed(3)+','+p.getZ(i).toFixed(3);let o=map.get(k);if(!o){o=[(r()-.5)*amt,(r()-.5)*amt,(r()-.5)*amt];map.set(k,o)}
    p.setXYZ(i,p.getX(i)+o[0],p.getY(i)+o[1],p.getZ(i)+o[2])}g.computeVertexNormals();return g}
function lpMesh(g,c,x=0,y=0,z=0){const m=new THREE.Mesh(g,lam(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m}
let _rockN=0;function lpRock(c,s,x,y,z){const m=lpMesh(jitterGeo(new THREE.DodecahedronGeometry(s,0),s*.32,++_rockN*7),c,x,y+s*.25,z);m.scale.y=.62;m.rotation.y=_rockN*1.7;return m}

/* ================= world ================= */
let airship=null,turbines=[],falls=[],renderer,scene,camera,picks=[],movers=[],clouds=[],sky=[],artists=[],houses=[],bigTree,lanterns=[];

// lumpy foliage clumps, lighter on top and darker underneath like the painted trees in the references
const LUMPS=[0,1,2,3].map(k=>{const g=new THREE.SphereGeometry(1,28,20),p=g.attributes.position,col=[];for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
  const n=vnoise(x*2.4+k*9,y*2.4+z*1.3)*.55+vnoise(z*3.1+k*5,x*2.2-y)*.45,f=1+(n-.5)*.4;p.setXYZ(i,x*f,y*f*.92,z*f);const b=.66+.34*smooth(-1,1,y)+(n-.5)*.08;col.push(b,b,b)}
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.computeVertexNormals();return g});
const VMATS=new Map();const vmat=c=>VMATS.get(c)||VMATS.set(c,new THREE.MeshLambertMaterial({color:c,vertexColors:true})).get(c);
function clump(c,r,x=0,y=0,z=0,sy=.9){const m=new THREE.Mesh(LUMPS[Math.abs(Math.round(x*7+z*13+y*3+r*5))%4],vmat(c));m.position.set(x,y,z);m.scale.set(r,r*sy,r);m.castShadow=true;m.receiveShadow=true;return m}
// a leafy cluster = a darker core that fills the gaps + a marker where leaf cards are scattered later
function leafy(c,r,x=0,y=0,z=0,sy=1){const g=new THREE.Group();g.position.set(x,y,z);const core=clump('#'+new THREE.Color(c).multiplyScalar(.52).getHexString(),r*.6,0,0,0,sy*.9);g.add(core);
  const mk=new THREE.Object3D();mk.userData.foliage={r,tint:c,sy};g.add(mk);return g}
function leaf(c,r,x=0,y=0,z=0){const s=r*.95;return lpMesh(jitterGeo(new THREE.IcosahedronGeometry(s,r>.6?1:0),s*.24,Math.round(Math.abs(x*31+z*17+y*5+r*7))+5),c,x,y,z)}

function makeEasel(tex,size,ud){
  const g=new THREE.Group(),wood='#b08a62';
  [[-.26,-.12,.12],[.26,-.12,.12],[0,.22,-.32]].forEach(([x,z,tilt])=>{const l=cyl(wood,.028,.034,1.45*size,x*size,0,z*size,8);l.rotation.x=tilt;l.rotation.z=-x*.22;g.add(l)});
  const board=new THREE.Group();board.position.set(0,1.02*size,-.06*size);board.rotation.x=-.12;g.add(board);
  const fr=new THREE.Mesh(new THREE.BoxGeometry(.8*size,.8*size,.05),toon('#f2ebdc'));board.add(fr);
  const ph=new THREE.Mesh(new THREE.PlaneGeometry(.72*size,.72*size),new THREE.MeshBasicMaterial({map:tex}));ph.position.z=.028;ph.userData=ud||{};board.add(ph);if(ud)picks.push(ph);

  return g}

  const cur=renderer.getPixelRatio(),nx=[1.5,1.25].find(v=>v<cur-.01);
  if(nx){renderer.setPixelRatio(nx);resize()}else if(renderer.shadowMap.enabled){renderer.shadowMap.enabled=false;scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>m.needsUpdate=true)})}}

/* ================= camera ================= */
let yaw=.6,pitch=.58,zoom=1,focus=null,idleT=0,touring=false,dragging=false;const look=new THREE.Vector3(),camPos=new THREE.Vector3();
const portrait=()=>innerHeight>innerWidth;
function camGoal(){
  let at=new THREE.Vector3(0,2.4,0),d=(portrait()?66:36)*K*zoom,y=yaw,p=pitch;
  if(focus){if(focus.obj){focus.obj.getWorldPosition(focus.pos);focus.pos.y+=focus.h}at=focus.pos.clone();d=focus.d*(portrait()?1.45:1);if(focus.yaw!==undefined)y=focus.yaw;p=focus.pitch??.35;
    /* 直式手機下面有說明卡：看的點往下移，東西就會出現在畫面上半部，不會被卡片蓋住（2026-10-03） */
    if(portrait()&&!$('sheet').hidden)at.y-=d*.16}
  return{at,pos:at.clone().add(new THREE.Vector3(Math.sin(y)*Math.cos(p)*d,Math.sin(p)*d,Math.cos(y)*Math.cos(p)*d))};
}
function focusOn(obj,d,h,pitch){const w=new THREE.Vector3();obj.getWorldPosition(w);w.y+=h;focus={pos:w,d,yaw:Math.atan2(w.x,w.z)+.25,pitch:pitch??.3,obj,h}}
/* ================= loop ================= */
const tweens=[];const tween=(d,f)=>new Promise(r=>{if(RM)d=Math.min(d,60);tweens.push({t0:performance.now(),d,f,r})});
let tPrev=performance.now();
function loop(now){
  const raw=(now-tPrev)/1000,dt=Math.min(.05,raw);tPrev=now;perfTick(raw);
  for(let k=tweens.length-1;k>=0;k--){const w=tweens[k],p=Math.min(1,(now-w.t0)/w.d);w.f(p);if(p>=1){tweens.splice(k,1);w.r()}}
  if(!RM){
    clouds.forEach(c=>{c.userData.a+=c.userData.v*dt;c.position.x=Math.cos(c.userData.a)*c.userData.d;c.position.z=Math.sin(c.userData.a)*c.userData.d});
    sky.forEach(s=>{const o=s.userData.o;o.a+=o.sp*dt;s.position.set(Math.cos(o.a)*o.rad,o.y+Math.sin(now/2200+o.bob)*.6,Math.sin(o.a)*o.rad);s.rotation.y=-o.a+(o.sp>0?-Math.PI/2:Math.PI/2);
      if(s.userData.tail)s.userData.tail.rotation.z=Math.sin(now/900)*.25;if(s.userData.fl)s.userData.fl.forEach((f,i)=>f.rotation.x=Math.sin(now/500+i)*.4)});
    lanterns.forEach(l=>{l.rotation.z=Math.sin(now/1400+l.userData.ph)*.08});
    turbines.forEach((t,k)=>t.userData.hub.rotation.z+=dt*(.7+k*.15));
    falls.forEach(f=>f.material.map.offset.y+=dt*.9);
    if(airship){airship.position.y=1.6+Math.sin(now/1800)*.18;airship.rotation.z=Math.sin(now/2300)*.03;airship.userData.prop.rotation.x+=dt*4}
    artists.forEach(a=>artistTick(a,dt,now));movers.forEach(w=>animalTick(w,dt,now));
    idleT+=dt;if(!dragging&&!focus&&!touring&&idleT>5)yaw+=dt*.03;
  }
  const g=camGoal(),k=1-Math.pow(.05,dt);camPos.lerp(g.pos,k);look.lerp(g.at,k);camera.position.copy(camPos);camera.lookAt(look);
  renderer.render(scene,camera);requestAnimationFrame(loop);
}

function onDown(e){if(touring)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});cvEl().setPointerCapture(e.pointerId);idleT=0;
  if(pointers.size===1)down={x:e.clientX,y:e.clientY,yaw,pitch,moved:false};else if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0={d:Math.hypot(a.x-b.x,a.y-b.y),zoom};if(down)down.moved=true}}
function onMove(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});idleT=0;
  if(pointers.size===2&&pinch0){const [a,b]=[...pointers.values()];zoom=Math.max(.5,Math.min(1.3,pinch0.zoom*pinch0.d/Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))));return}
  if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>6){down.moved=true;dragging=true;if(focus)closeSheet();yaw=down.yaw-dx*.006;pitch=Math.max(.22,Math.min(1.2,down.pitch+dy*.004))}}
function onUp(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch0=null;if(pointers.size)return;dragging=false;if(!down)return;const moved=down.moved;down=null;if(moved)return;
  const u=pick(e);if(!u){if(focus)closeSheet();return}
  if(u.airship)return openAirship();

function fromServer(j){return{members:j.houses.map(h=>({id:h.id,name:h.name,style:h.style,since:h.since,staff:h.staff,works:h.works.map(w=>({id:w.id,img:imgUrl(w.id,'t'),full:imgUrl(w.id,'f'),title:w.title,date:w.date,by:w.by}))})),
  album:j.album.map(w=>({id:w.id,img:imgUrl(w.id,'t'),full:imgUrl(w.id,'f'),title:w.title,date:w.date,by:'老師'})),me:G?G.me:ME.house}}
async function reload(){const r=await fetch(NOTIFY_URL+'/island/data?t='+Date.now());const j=await r.json();if(!j.ok)throw new Error(j.error||'讀不到島上的資料');G=fromServer(j);return G}
async function whoAmI(){
  try{if(!ssTok()&&window.liff){await Promise.race([liff.init({liffId:LIFF_ID}),sleep(4000)])}}catch(e){}
  if(!token()){ME={ok:false,err:'請從 LINE 的 OTTO2 預約頁打開作品島，才能搬家、上傳'};return}
  try{const j=await api('/island/me');ME=Object.assign({ok:true},j);if(G)G.me=j.house}catch(e){ME={ok:false,err:e.message}}}
function save(){if(!DEMO)return;try{localStorage.setItem('otto2-island-v5',JSON.stringify(G))}catch(e){toast('手機空間不夠，示範版存不下更多照片')}}
async function start(data){
  G=null;
  if(DEMO){G=data&&data.members&&data.album?data:null;
    if(!G){try{G=JSON.parse(localStorage.getItem('otto2-island-v5'))}catch(e){}}
    if(!G||!G.members||!G.album)G=demoData();ME={ok:true,staff:true}}
  else{let err;for(let k=0;k<3&&!G;k++){try{await reload()}catch(e){err=e;await sleep(1200)}}
    if(!G)throw new Error('連不上作品島，請稍後重新打開');whoAmI()}
  try{await Promise.race([document.fonts.load('20px "Noto Serif TC"'),sleep(2500)])}catch(e){}
  build();rebuildHouses();
  const g=camGoal();camPos.copy(g.pos);look.copy(g.at);
  $('loading').hidden=true;$('hud').hidden=false;requestAnimationFrame(loop);window.__islandReady=true;
  const c=cvEl();c.addEventListener('pointerdown',onDown);c.addEventListener('pointermove',onMove);c.addEventListener('pointerup',onUp);c.addEventListener('pointercancel',onUp);
  c.addEventListener('wheel',e=>{zoom=Math.max(.5,Math.min(1.3,zoom+e.deltaY*.0008));idleT=0;e.preventDefault()},{passive:false});
  if(location.hash==='#album')setTimeout(openAlbum,800);
  window.claude?.hot?.snapshot?.(()=>G);
}
$('myBtn').onclick=()=>{const mine=G.members.find(m=>m.id===G.me);if(mine){openHouseSheet(mine);houseWall(mine)}else if(!DEMO&&!ME.ok)toast(ME.err||'正在確認你的 LINE 身分，請稍等一下');else joinPanel()};
$('lbDel').onclick=async()=>{if(!lb||!lb.del)return;const w=lb.list[lb.i];if(!confirm('確定要刪除這張照片嗎？刪了就找不回來。'))return;
  try{await api('/island/delete',Object.assign({id:w.id},lb.del));await reload();$('lb').hidden=true;closeModal();rebuildHouses();toast('刪除了')}catch(e){toast(e.message)}};
$('upBtn').onclick=upPanel;$('albumBtn').onclick=openAlbum;$('tourBtn').onclick=tour;$('homeBtn').onclick=()=>{const u='park.html?v=20261004h';window.Ferry?Ferry.go({to:u,place:'park',from:'art'}):location.href=u};$('tourStop').onclick=stopTour;$('sX').onclick=closeSheet;
$('lbX').onclick=()=>$('lb').hidden=true;
$('lbPrev').onclick=()=>{if(lb)openList(lb.list,(lb.i-1+lb.list.length)%lb.list.length,lb.label)};
$('lbNext').onclick=()=>{if(lb)openList(lb.list,(lb.i+1)%lb.list.length,lb.label)};
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('lb').hidden)$('lb').hidden=true;else if(!$('modal').hidden)closeModal();else if(touring)stopTour();else if(!$('sheet').hidden)closeSheet()}});
function safeStart(d){return start(d).catch(err=>{console.error(err);$('loading').textContent='畫面載入失敗：'+(err&&err.message||err)+'（請截圖給我）'})}
window.claude?.hot?.ready?window.claude.hot.ready(safeStart):safeStart(window.claude?.hot?.data??{});
</script>
