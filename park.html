<meta charset="utf-8">
<title>世界藝術日・畢卡索扭扭樂</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script>(function(){var ok=false;try{var c=document.createElement("canvas");ok=!!(c.getContext("webgl")||c.getContext("experimental-webgl"))}catch(e){}if(!ok)location.replace("index.html?go=gacha2d");window.addEventListener("error",function(){if(!window.__parkReady&&!window.__fb){window.__fb=1;location.replace("index.html?go=gacha2d")}})})()</script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
:root{
  --red:#d63a2f; --green:#2f8f58; --gold:#f2c14e; --ink:#2b2320; --paper:#fffaf2; --muted:#7a6d66;
  --round:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
html,body{height:100%}
body{-webkit-user-select:none; -webkit-touch-callout:none; margin:0; background:linear-gradient(180deg,#101d46 0%,#2a4688 55%,#6f8fcf 100%); color:var(--ink); font-family:var(--round); overflow:hidden; -webkit-tap-highlight-color:transparent; user-select:none}
#game{position:fixed; inset:0}
#game canvas{display:block; width:100%; height:100%}
.hud{position:fixed; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.hud > *{pointer-events:auto}
.row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.chip{background:var(--paper); border:2.5px solid var(--ink); border-radius:16px; box-shadow:0 4px 0 var(--ink); padding:6px 12px; display:flex; align-items:center; gap:8px; font-size:15px}
.chip img{width:30px; height:30px}
.chip b{font-weight:400; font-size:20px; color:var(--red)}
.brand{flex-direction:column; align-items:flex-start; gap:0; line-height:1.15}
.brand small{font-size:11px; color:var(--green)}
.row2{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-top:10px}
.tree{font-family:var(--round); color:var(--ink); text-align:left; cursor:pointer; background:rgba(255,250,242,.94); border:2px solid var(--ink); border-radius:12px; padding:5px 9px; font-size:12px; width:100%; box-sizing:border-box; box-shadow:0 3px 0 var(--ink)}
.tree .tt{display:flex; justify-content:space-between; align-items:center}
.tree .tt em{font-style:normal; background:var(--red); color:#fff; border-radius:99px; padding:0 7px; font-size:11px}
.tree .bar{height:9px; border:1.5px solid var(--ink); border-radius:99px; background:#e6e0d8; overflow:hidden; margin:3px 0 2px}
.tree .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--gold),#ffe58a); width:0; transition:width .6s}
.tree b{font-weight:400; color:var(--red); font-variant-numeric:tabular-nums}
.top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.colL{display:flex; flex-direction:column; align-items:stretch; gap:10px; min-width:0; width:calc(50% - 5px); flex:none}
.colR{display:flex; flex-direction:column; gap:6px; width:calc(50% - 5px); flex:none; align-items:stretch}
.colR .matlbl{order:2; text-align:right}
.colR .mats{order:1}
.colR .gchip{order:3}
body.busy .colR .mats,body.busy .colR .matlbl{opacity:0; pointer-events:none}
.colR .mats,.colR .matlbl{transition:opacity .25s}
.gchip{justify-content:center; padding-inline:8px}
.mats{display:grid; grid-template-columns:repeat(4,1fr); gap:5px}
.mat{aspect-ratio:1; border-radius:10px; border:2.2px solid var(--ink); background:rgba(255,255,255,.35); display:grid; place-items:center; box-shadow:0 3px 0 var(--ink)}
.mat img{width:74%; height:74%; filter:grayscale(1) opacity(.35)}
.mat.got{background:var(--paper)}
.mat.got img{filter:none}
.mat.mpop{animation:matpop .5s ease}  /* 注意：不能叫 pop，會吃到彈窗 .pop 的全螢幕樣式 */
@keyframes matpop{40%{transform:scale(1.3) rotate(-8deg)}}
.matlbl{font-size:11px; text-align:center; line-height:1.3; color:#fff; text-shadow:0 1px 2px #000}
.bottom{display:flex; flex-direction:column; align-items:center; gap:8px}
.mainbtns .rollbtn{padding-inline:22px}
.levels{display:flex; background:var(--paper); border:2.5px solid var(--ink); border-radius:99px; box-shadow:0 4px 0 var(--ink); overflow:hidden}
.levels button{font-family:var(--round); font-size:15px; border:0; background:transparent; color:var(--ink); padding:7px 16px; cursor:pointer; display:flex; align-items:center; gap:5px}
.levels button+button{border-left:2.5px solid var(--ink)}
.levels button.on{background:var(--green); color:#fff}
.levels button.locked{color:#9a8c85}
.levels svg{width:13px; height:13px}
.left{font-size:13px; background:rgba(255,250,242,.92); border-radius:99px; padding:3px 12px; border:2px solid var(--ink)}
.left b{font-weight:400; color:var(--red)}
.rollbtn{font-family:var(--round); font-size:24px; color:#fff; background:var(--red); border:3px solid var(--ink); border-radius:999px;
  padding:12px 30px; box-shadow:0 6px 0 var(--ink); cursor:pointer; letter-spacing:.08em; white-space:nowrap; transition:transform .08s, box-shadow .08s}
.mainbtns{display:flex; align-items:center; gap:10px}
.roombtn{font-family:var(--round); font-size:17px; color:var(--ink); background:var(--gold); border:3px solid var(--ink); border-radius:22px; padding:6px 14px 6px 8px; box-shadow:0 6px 0 var(--ink); cursor:pointer; display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto; column-gap:6px; align-items:center; text-align:left; line-height:1.1}
.roombtn img{width:38px; height:38px; grid-row:1/3}
.roombtn small{font-size:11px; color:#6b4f1a}
.menubtn{font-family:var(--round); font-size:11px; color:var(--ink); background:var(--paper); border:3px solid var(--ink); border-radius:18px; width:54px; height:58px; box-shadow:0 6px 0 var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:0}
.menubtn svg{width:24px; height:24px}
.menubtn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px}
.mgrid .small{font-size:14px; padding:9px 8px}
.mhead{font-size:12px!important; color:var(--muted); margin:4px 0 8px!important}
#menu{z-index:4}
.backbtn{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom,0px) + 20px); font-family:var(--round); font-size:18px; color:#fff; background:var(--green); border:3px solid var(--ink); border-radius:99px; padding:10px 28px; box-shadow:0 5px 0 var(--ink); cursor:pointer; display:none; white-space:nowrap}
body.ov .backbtn{display:block}
.hud{transition:opacity .3s}
body.ov .hud{opacity:0; pointer-events:none}
body.ov .hud > *{pointer-events:none}
.bottom{margin-inline:-16px; padding:22px 16px 0; background:linear-gradient(180deg,rgba(16,29,70,0),rgba(16,29,70,.55) 45%)}
.roombtn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.roombtn:disabled{opacity:.6}
.room{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px}
.rg{font-family:var(--round); background:#fff; color:var(--ink); border:2.5px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); padding:8px 6px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:15px}
.rg img{width:48px; height:48px}
.rg small{font-size:11px; color:var(--muted)}
.rollbtn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.rollbtn:disabled{background:#8d8480; cursor:default}
button:focus-visible{outline:3px solid var(--gold); outline-offset:3px}
.tools{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; max-width:420px}
.small{font-family:var(--round); font-size:13px; background:var(--paper); color:var(--ink); border:2px solid var(--ink); border-radius:99px; padding:5px 11px; cursor:pointer; box-shadow:0 3px 0 var(--ink)}
.small.on{background:var(--gold)}
.demo{font-size:12px; background:rgba(0,0,0,.55); color:#fff; border-radius:99px; padding:3px 12px; white-space:nowrap}
.flash{position:fixed; left:50%; top:34%; transform:translate(-50%,-50%) scale(.2); font-size:96px; color:#fff; -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:0 6px 0 var(--ink); opacity:0; pointer-events:none; transition:transform .35s cubic-bezier(.3,1.6,.5,1), opacity .2s}
.flash.on{opacity:1; transform:translate(-50%,-50%) scale(1)}
.toast{position:fixed; left:50%; top:26%; transform:translateX(-50%); background:var(--gold); border:2.5px solid var(--ink); border-radius:14px; padding:6px 16px; font-size:17px; box-shadow:0 4px 0 var(--ink); opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap}
.toast.on{opacity:1; transform:translateX(-50%) translateY(-8px)}
.pop{position:fixed; inset:0; display:grid; place-items:center; background:rgba(10,16,40,.5); padding:16px; z-index:5}
.card{width:min(340px,100%); max-height:calc(100% - 20px); overflow:auto; background:var(--paper); border:3px solid var(--ink); border-radius:24px; box-shadow:0 8px 0 var(--ink); padding:20px 18px 18px; text-align:center; animation:popin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.6); opacity:0}}
.card img.big{width:92px; height:92px}
.card h2{font-weight:400; font-size:24px; margin:4px 0 6px; color:var(--red)}
.card p{margin:0 0 14px; font-size:15px; line-height:1.6}
.acts{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.btn{font-family:var(--round); font-size:19px; color:#fff; background:var(--green); border:2.5px solid var(--ink); border-radius:99px; padding:8px 30px; box-shadow:0 4px 0 var(--ink); cursor:pointer}
.btn.ghost{background:#fff; color:var(--ink)}
.btn.red{background:var(--red)}
.btn:disabled{background:#b9aaa3}
table.rank{width:100%; border-collapse:collapse; font-size:14px; margin-bottom:14px; font-variant-numeric:tabular-nums}
table.rank td{padding:6px 4px; border-bottom:1.5px dashed #d9cfc6; text-align:left}
table.rank td:not(:nth-child(2)){text-align:center}
table.rank tr.me td{color:var(--red)}
table.rank th{font-weight:400; font-size:12px; color:var(--muted); padding:0 4px 4px}
/* minigames */
.mgcv{display:block; margin:0 auto 12px; border:2.5px solid var(--ink); border-radius:16px; background:#eaf4ff; touch-action:none; max-width:100%}
.mgstat{display:flex; justify-content:space-between; font-size:15px; margin-bottom:8px}
.mgstat b{font-weight:400; color:var(--red)}
.swatches{display:flex; justify-content:center; gap:18px; margin-bottom:10px}
.sw{display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px}
.sw i{width:86px; height:86px; border-radius:50%; border:3px solid var(--ink); display:block}
.drops{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px}
.drop{font-family:var(--round); border:2.5px solid var(--ink); border-radius:14px; padding:8px 0 6px; cursor:pointer; box-shadow:0 3px 0 var(--ink); font-size:14px; background:#fff; color:var(--ink)}
.drop i{display:block; width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); margin:0 auto 4px; border:2px solid var(--ink)}
.memo{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-bottom:12px}
.mc{aspect-ratio:3/4; border:2.5px solid var(--ink); border-radius:12px; background:var(--green); cursor:pointer; display:grid; place-items:center; box-shadow:0 3px 0 var(--ink); padding:0}
.mc img{width:84%; aspect-ratio:1; object-fit:cover; visibility:hidden}
.mc.open{background:#fff}
.mc.open img{visibility:visible}
.mc.done{background:#fff3c4}
.mc.done img{visibility:visible}
.mc::after{content:""}
.hue{display:grid; gap:6px; margin-bottom:12px}
.hue button{aspect-ratio:1; border:2px solid var(--ink); border-radius:10px; cursor:pointer; padding:0}
.holes{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px}
.hole{aspect-ratio:1; border:2.5px solid var(--ink); border-radius:16px 16px 50% 50%; background:#8a5a3b; cursor:pointer; display:grid; place-items:end center; padding:0 0 8px; overflow:hidden; box-shadow:inset 0 -14px 0 #6e4429}
.hole img{width:74%; transform:translateY(110%); transition:transform .12s}
.hole.up img{transform:none}
.hole.hit{background:#f2c14e}
.simon{display:grid; grid-template-columns:1fr 1fr; gap:14px; width:220px; margin:4px auto 14px}
.sb{aspect-ratio:1; border-radius:50% 50% 46% 46%; border:3px solid var(--ink); cursor:pointer; opacity:.35; transition:opacity .1s, transform .1s; padding:0}
.sb.lit{opacity:1; transform:scale(1.06); box-shadow:0 0 26px 6px var(--gl)}
.chars{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px}
.ch{font-family:var(--round); background:#fff; color:var(--ink); border:2.5px solid var(--ink); border-radius:16px; padding:10px 6px 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:15px; box-shadow:0 3px 0 var(--ink)}
.ch.on{background:#fff3c4; outline:3px solid var(--red)}
.ch img{width:72px; height:72px; border-radius:50%; object-fit:cover; background:#eef2f7}
.upl{display:inline-block; font-family:var(--round); font-size:14px; background:var(--gold); border:2px solid var(--ink); border-radius:99px; padding:6px 14px; cursor:pointer; box-shadow:0 3px 0 var(--ink); margin-bottom:8px}
.upl input{position:absolute; width:1px; height:1px; opacity:0}
.note{font-size:12px; color:var(--muted); line-height:1.5; margin:0 0 12px}
.tlist{display:flex; flex-direction:column; gap:8px; margin-bottom:12px; text-align:left}
.trow{display:grid; grid-template-columns:48px 1fr auto; gap:8px; align-items:center}
.trow img{width:48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid var(--ink)}
.trow input[type=text]{font-family:var(--round); font-size:15px; min-width:0; width:100%; padding:6px 8px; border:2px solid var(--ink); border-radius:10px; background:#fff; color:var(--ink)}
.trow .upl{margin:0; padding:5px 10px; font-size:13px}
.mc img{border-radius:50%}
.mc small{display:none}
[hidden]{display:none!important}
.phase{display:flex; align-items:center; background:rgba(255,250,242,.94); border:2.5px solid var(--ink); border-radius:99px; box-shadow:0 3px 0 var(--ink); overflow:hidden; font-size:13px}
.phase span{padding:5px 9px; color:var(--muted); font-size:11px; border-right:2px solid var(--ink)}
.phase button{font-family:var(--round); font-size:13px; border:0; background:transparent; color:var(--ink); padding:6px 11px; cursor:pointer}
.phase button+button{border-left:2px solid var(--ink)}
.phase button.on{background:var(--red); color:#fff}
.soon{font-size:13px; gap:6px; background:rgba(40,44,58,.9); color:#e6e8ee; border-color:var(--ink)}
.soon svg{width:14px; height:14px}
.soon small{display:block; font-size:11px; color:#aab0c0}
body.oct #treeBtn, body.oct .colR, body.oct .levels, body.oct #roll, body.oct #room{display:none}
body:not(.oct) #spin, body:not(.oct) #soon, body:not(.oct) #gpanel, body:not(.oct) .octinfo{display:none}
body.oct .top{display:none}
.places{display:flex; gap:8px; justify-content:center}
.places button{font:inherit; font-size:13px; color:var(--ink); background:rgba(255,250,242,.95); border:2px solid var(--ink); border-radius:99px; padding:5px 13px; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 0 var(--ink); cursor:pointer}
.places button small{font-size:10px; background:#8a8f9a; color:#fff; border-radius:99px; padding:0 6px}
.places button{position:relative}
.places button.dot::after{content:''; position:absolute; top:-5px; right:-4px; width:12px; height:12px; border-radius:50%; background:#e0322f; border:2px solid var(--ink)}
.places button.gray{background:#d3d6dc; color:#7d838f; border-color:#9aa0ab; box-shadow:0 2px 0 #9aa0ab}
.places button:disabled{opacity:.6}
@keyframes plPulse{0%,100%{transform:scale(1);box-shadow:0 2px 0 var(--ink),0 0 0 0 rgba(224,50,47,.55)}50%{transform:scale(1.1);box-shadow:0 2px 0 var(--ink),0 0 0 9px rgba(224,50,47,0)}}
.places button.pulse{animation:plPulse 1s ease-in-out 6}
#miUI{position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; flex-direction:column; align-items:center; gap:10px; z-index:4; pointer-events:none}
#miUI>*{pointer-events:auto}
#miUI .mich{font-size:13px; background:rgba(255,250,242,.95); border:2px solid var(--ink); border-radius:99px; padding:4px 14px; text-align:center; line-height:1.35}
#miUI .mich small{font-size:11.5px; opacity:.75}
#miReset{font:inherit; color:var(--ink); cursor:pointer}
#miFood{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0 12px}
#miFood button{font:inherit; font-size:15px; color:var(--ink); background:var(--paper); border:2.5px solid var(--ink); border-radius:99px; padding:8px 14px; display:inline-flex; align-items:center; gap:6px; box-shadow:0 3px 0 var(--ink); cursor:pointer}
#miFood i{width:12px; height:12px; border-radius:50%; display:block}
#miFood .fav{display:inline-flex}
#miFood .fav img{width:30px; height:30px; border-radius:50%; object-fit:cover; border:2px solid #fff; margin:-4px 0 -4px -10px; box-shadow:0 0 0 1px var(--ink)}
#miFood .fav img:first-child{margin-left:-4px}
#miFood button.ghost{background:transparent; box-shadow:none; border-style:dashed}
#miUI .mirow{display:flex; gap:10px}
#miUI .mirow button{font:inherit; font-size:19px; color:var(--ink); background:var(--paper); border:3px solid var(--ink); border-radius:99px; padding:12px 26px; box-shadow:0 5px 0 var(--ink); cursor:pointer}
#miUI .mirow button.red{background:var(--red); color:#fff}
#miUI button:disabled{opacity:.55}
body.mi .hud{opacity:0; pointer-events:none}
body.mi .xtra{display:none}
.demotag{position:fixed; left:6px; top:calc(env(safe-area-inset-top,0px) + 3px); font-size:10px; color:#fff; background:#8a8f9a; border-radius:99px; padding:1px 8px; z-index:3; pointer-events:none}
body.touring .demotag{display:none}
.octinfo{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; font-size:12px}
.octinfo b{font-weight:400; background:rgba(255,250,242,.95); border:2px solid var(--ink); border-radius:99px; padding:3px 10px}
.octinfo span{background:rgba(40,44,58,.88); color:#e6e8ee; border-radius:99px; padding:4px 10px}
.xtra{position:fixed; top:calc(env(safe-area-inset-top,0px) + 70px); right:10px; z-index:3; display:flex; flex-direction:column; align-items:center; gap:7px}
.xtra .xh{font-size:11px; background:#b5573f; color:#fff; border-radius:99px; padding:2px 8px; border:2px solid var(--ink)}
.xtra button{position:relative; width:52px; height:56px; border:2.5px solid var(--ink); border-radius:16px; background:var(--paper); box-shadow:0 3px 0 var(--ink); font-size:22px; line-height:1; padding:4px 0 0; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink); font-family:inherit}
.xtra button small{font-size:11px}
.xtra button b{position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; border-radius:11px; background:#e0322f; color:#fff; font-size:12px; font-weight:400; display:flex; align-items:center; justify-content:center; border:2px solid var(--ink); padding:0 3px}
.xtra button.done{opacity:.6}
.xtra button.done b{background:#2e7d4f}
body:not(.oct) .xtra{display:none}
body.touring .xtra{pointer-events:none}
.tour{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 18px); transform:translateX(-50%); width:min(360px,calc(100% - 32px)); background:var(--paper); border:3px solid var(--ink); border-radius:22px; box-shadow:0 8px 0 var(--ink); padding:14px 16px 14px; z-index:6; text-align:center; animation:popin .35s cubic-bezier(.3,1.5,.5,1)}
.tour h3{margin:6px 0 4px; font-weight:400; font-size:21px; color:#b5573f}
.tour p{margin:0 0 12px; font-size:15px; line-height:1.6}
.tour .tdots{display:flex; gap:6px; justify-content:center}
.tour .tdots i{width:8px; height:8px; border-radius:50%; background:#d9d2c3}
.tour .tdots i.on{background:#b5573f}
body.touring .hud{opacity:0; pointer-events:none}
body.oct,body.dayfade{background:linear-gradient(180deg,#86cdf5 0%,#bfe6fb 42%,#fff1d9 78%,#ffe0bf 100%)}
#nightVeil{position:fixed; inset:0; background:linear-gradient(180deg,#101d46 0%,#2a4688 55%,#6f8fcf 100%); opacity:0; pointer-events:none}
body:not(.oct) #left{display:none}
body:not(.oct) .bottom{align-items:stretch}
body:not(.oct) .mainbtns{width:100%}
body:not(.oct) .mainbtns .rollbtn{flex:1.15; padding-inline:8px}
body:not(.oct) .mainbtns .roombtn{flex:1; justify-content:center}
body:not(.oct) .levels{align-self:stretch}
body:not(.oct) .levels button{flex:1; justify-content:center}

/* ---------- board flow ---------- */
async function rollDie(vp){
  /* 小熊把骰子往前丟出去：拋物線飛出、在格子上彈三下邊滾邊轉，最後停在點數那一面（2026-10-03） */
  const b=bear.position.clone(),gy=b.y+.36;
  // 往小熊接下來要走的方向丟（沿著格子），不會丟進中間的大聖誕樹
  const N=LEVELS[G.cur].path.length,cur=G.lv[G.cur].pos,nx=tilePos(G.cur,(cur+2)%N),cp=tilePos(G.cur,cur);
  let dx=nx.x-cp.x,dz=nx.z-cp.z;const L=Math.hypot(dx,dz)||1;dx/=L;dz/=L;
  bear.rotation.y=Math.atan2(dx,dz);
  await tween(160,p=>{bearBody.rotation.x=-.35*p});                          // 小熊往後蓄力（按下去馬上動，點數同時跟伺服器拿）
  let v=null;vp.then(x=>{v=x});while(v===null)await tween(180,p=>{bearBody.rotation.x=-.35-.08*Math.sin(p*Math.PI);bear.position.y=b.y+.06*Math.sin(p*Math.PI)}); /* 網路慢就原地小跳等一下，不會整個停住 */
  bear.position.y=b.y;
  if(v<0){await tween(150,p=>{bearBody.rotation.x=-.35*(1-p)});return v}
  const E={1:[0,0],6:[Math.PI,0],2:[-Math.PI/2,0],5:[Math.PI/2,0],3:[0,Math.PI/2],4:[0,-Math.PI/2]}[v];
  const P0=new THREE.Vector3(b.x+dx*.35,b.y+1.25,b.z+dz*.35);
  // 每一段：往前多少、彈多高、花多久
  const seg=[[.75,1.35,420],[.45,.55,290],[.26,.22,210],[.1,0,220]],T=seg.reduce((a,q)=>a+q[2],0);
  const sx=(3+Math.floor(Math.random()*2))*Math.PI*2*(Math.random()<.5?1:-1),sy=Math.PI*(1+Math.random()),sz=(2+Math.floor(Math.random()*2))*Math.PI*2;
  dieG.visible=true;dieG.scale.setScalar(1);dieG.position.copy(P0);
  tween(220,p=>{bearBody.rotation.x=-.35+.75*Math.sin(p*Math.PI*.5)}).then(()=>tween(260,p=>{bearBody.rotation.x=.4*(1-p)}));
  let thump=0;
  await tween(T,p=>{let t=p*T,d=0,k=0;while(k<seg.length-1&&t>seg[k][2]){t-=seg[k][2];d+=seg[k][0];k++}
    const q=Math.min(1,t/seg[k][2]),fwd=d+seg[k][0]*(k===seg.length-1?easeOut(q):q);
    let y;if(k===0)y=P0.y+(gy-P0.y)*q+seg[0][1]*Math.sin(q*Math.PI)*.9;else y=gy+seg[k][1]*Math.sin(q*Math.PI);
    if(k!==thump&&k<seg.length){thump=k;try{sfx('tap')}catch(e){}}
    dieG.position.set(P0.x+dx*fwd,y,P0.z+dz*fwd);
    const e=1-easeOut(p);die.rotation.set(E[0]+sx*e,sy*e,E[1]+sz*e)});
  die.rotation.set(E[0],0,E[1]);
  await tween(160,p=>{const s=Math.sin(p*Math.PI);dieG.scale.set(1+.12*s,1-.12*s,1+.12*s)});
  const f=$('flash');f.textContent=v;f.classList.add('on');await sleep(800);f.classList.remove('on');
  await tween(220,p=>dieG.scale.setScalar(1-p));dieG.visible=false;dieG.scale.setScalar(1);bearBody.rotation.x=0;return v;
}

// the lighting ceremony: camera goes to the tree, bulbs light one by one, the current tier slowly glows, the star flashes
async function ceremony(from,to,label){
  treeCam=true;hud();await sleep(900);
  if(label)toast(label);
  const l0=Math.floor(amtOf(from)),l1=litOf(to);let last=l0,lay=layersOf(from);
  await tween(Math.min(5000,1800+(l1-l0)*260),p=>{
    const v=from+(to-from)*easeIO(p);setTreeVisual(v);
    const l=Math.min(NB,litOf(v));for(let i=last;i<l;i++){const b=TREE.bulbs[i];b.userData.pop=1;const w=new THREE.Vector3();b.getWorldPosition(w);sparkle(w,2,[`#${b.userData.col.getHexString()}`])}
    last=Math.max(last,l);
    const L=layersOf(v);if(L>lay){for(let k=lay;k<L;k++)TREE.flash[k]=1;lay=L;toast(L>=5?'整棵樹都亮了！':`第 ${L} 層亮起來了！`)}
    // the tier being filled right now shimmers while it brightens
    const cur=Math.min(4,layersOf(v));TREE.flash[cur]=Math.max(TREE.flash[cur],.2*Math.sin(p*Math.PI));
  });
  await starPulses(layersOf(to)>layersOf(from)?2:1);
  await sleep(600);treeCam=false;hud();
}
async function quickLight(from,to){
  const l0=Math.floor(amtOf(from));
  await tween(700,p=>setTreeVisual(from+(to-from)*p));
  const l1=Math.min(NB,litOf(to));for(let i=l0;i<l1;i++)TREE.bulbs[i].userData.pop=1;
  TREE.pulse=1;
}

function closeModal(){
  $("gcModal").classList.remove("show");
  var f = afterModal; afterModal = null;
  if (f) f();
}
function finish(){
  if (spun && spun.state) st = spun.state;
  busy = false; spun = null;
  if (ov && ov.style.display !== "none") render(true);
  if (window.onGachaDone) window.onGachaDone();
}
function confetti(big){
  var cs = ["#E3B34C","#E8836B","#1E2B4F","#7FB2A0","#8FA6D9","#E0322F","#F2C94C","#fff"];
  var shape = function(i){ return ["", "o", "s"][i % 3] };
  var W = window.innerWidth, H = window.innerHeight, h = "", fallN = big ? 200 : 120, shotN = big ? 60 : 32;
  for (var i = 0; i < fallN; i++) {
    h += '<i class="' + shape(i) + '" style="left:' + (Math.random() * 100).toFixed(1) + '%;background:' + cs[i % cs.length] +
      ';--t:' + (2.4 + Math.random() * 1.8).toFixed(2) + 's;--dl:' + (Math.random() * .9).toFixed(2) + 's;--dx:' + Math.round((Math.random() - .5) * 180) +
      'px;--r:' + Math.round((Math.random() - .5) * 1260) + 'deg;width:' + (6 + Math.round(Math.random() * 5)) + 'px"></i>';
  }
  [0, 1].forEach(function(side){
    for (var i = 0; i < shotN; i++) {
      var px = Math.round((side ? -1 : 1) * (W * .15 + Math.random() * W * .55)), py = -Math.round(H * .45 + Math.random() * H * .45);
      h += '<i class="k ' + shape(i) + '" style="' + (side ? "right" : "left") + ':' + Math.round(Math.random() * 20) + 'px;background:' + cs[(i + side) % cs.length] +
        ';--t:' + (1.8 + Math.random() * 1.2).toFixed(2) + 's;--dl:' + (Math.random() * .25).toFixed(2) + 's;--px:' + px + 'px;--py:' + py +
        'px;--r:' + Math.round((Math.random() - .5) * 1440) + 'deg;width:' + (6 + Math.round(Math.random() * 5)) + 'px"></i>';
    }
  });
  var c = $("gcConf"); c.innerHTML = h;
  clearTimeout(confetti._t); confetti._t = setTimeout(function(){ c.innerHTML = "" }, 5600);
}

window.Gacha = { result: function(j){ ensureUI(); spun = j; st = j.state; busy = true; showModal(j.prize) }, open: open, close: close, zoom: function(id, state, fb){ ensureUI(); if (state) st = state; zoomBear(id, fb) },  /* ensureUI：還沒開過扭蛋面板時樣式還沒載入，小卡會跑到畫面外看不到 */
  memory: function(state){ ensureUI(); if (state) st = state; memoryGame() } };
})();

</script>
